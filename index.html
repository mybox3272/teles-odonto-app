      getFirestore, 
      collection, 
      doc, 
      setDoc,
      addDoc, 
      updateDoc, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",
      storageBucket: "neves-pro-crm-comissoes.firebasestorage.app",
      messagingSenderId: "747505960352",
      appId: "1:747505960352:web:5e7d2d5168a14dbfe490c5",
      measurementId: "G-9CF84R9BWM"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.fb = { collection, doc, setDoc, addDoc, updateDoc, onSnapshot, query, orderBy };
      window.dispatchEvent(new Event("firebase-ready"));
      console.log("🔥 Firebase conectado em index.html com cálculo de prazos sequenciais!");
    } catch (err) {
      console.error("Erro ao inicializar Firebase em index.html:", err);
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Componente Marca D'água do Ícone Teles Odonto
    const ToothWatermark = ({ className = "w-64 h-64 text-slate-900 opacity-[0.035]" }) => (
      <svg viewBox="0 0 100 120" className={className} fill="currentColor">

        <path d="M 8 52 C 32 78 68 78 92 38" fill="none" stroke="currentColor" strokeWidth="6"/>
        <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" />
      </svg>
    );

    const initialClientsSeed = [
      { 
        cod: "2", 
        name: "JOÃO PESSOA MEDEIROS COSTA", 
        categoria: "Prótese Fixa", 
        logradouro: "Rua",

        vendor: "André Luiz Nóbrega Martins"
      },
      { 
        cod: "4", 
        name: "LEONARDO AMORIM DE FRANCA E SOUSA", 
        categoria: "Prótese Total e Parcial", 
        logradouro: "Av.", 
        endereco: "Santos Dumont", 
        numero: "1200", 
        bairro: "Aldeota", 
        cidade: "Fortaleza", 
        uf: "CE", 
        ddd: "85", 
        telefone: "98844-1234", 
        area: "Fortaleza Metropolitana",
        vendor: "Luis Daniel da Silva"
      },
      { 
        cod: "5", 
        name: "IMPRESSIONE LABORATÓRIO DE PROTESE LTDA", 
        categoria: "Ortodontia & Fixa", 
        logradouro: "Av.", 
        endereco: "Dom Luís", 
        numero: "800", 
        bairro: "Aldeota", 
        cidade: "Fortaleza", 
        uf: "CE", 
        ddd: "85", 
        telefone: "98711-2233", 
        area: "Fortaleza Leste",
        vendor: "André Luiz Nóbrega Martins"
      },
      { 
        cod: "7", 
        name: "DAVI DA CUNHA GONCALVES", 
        categoria: "Implantodontia", 
        logradouro: "Rua", 
        endereco: "Barão de Studart", 
        numero: "1550", 
        bairro: "Dionísio Torres", 
        cidade: "Fortaleza", 
        uf: "CE", 
        ddd: "85", 
        telefone: "99655-4433", 
        area: "Fortaleza Sul",
        vendor: "André Luiz Nóbrega Martins"
      },
      { 
        cod: "104", 
        name: "Clínica OdontoPrime Dr. Valter", 
        categoria: "Reabilitação & Implante", 
        logradouro: "Av.", 
        endereco: "Washington Soares", 
        numero: "3000", 
        bairro: "Edson Queiroz", 
        cidade: "Fortaleza", 
        uf: "CE", 
        ddd: "85", 
        telefone: "99233-8899", 
        area: "Fortaleza Sul",
        vendor: "André Luiz Nóbrega Martins"
      }
    ];

    const sellersList = [
      { cod: "1", codeVnd: "VND-01", name: "André Luiz Nóbrega Martins" },
      { cod: "2", codeVnd: "VND-02", name: "Luis Daniel da Silva" }
    ];

    const getHojeBR = () => {
      const d = new Date();
      const dia = String(d.getDate()).padStart(2, '0');
      const mes = String(d.getMonth() + 1).padStart(2, '0');
      const ano = d.getFullYear();
      return `${dia}/${mes}/${ano}`;
    };

    function App() {
      const [clients, setClients] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_clients');
          return saved ? JSON.parse(saved) : initialClientsSeed;
        } catch {
          return initialClientsSeed;
        }
      });

      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);

      // ESTADOS DO FORMULÁRIO DE NOVA VENDA
      const [dataVenda, setDataVenda] = useState('');
      const [davNumber, setDavNumber] = useState('');
      const [codClienteInput, setCodClienteInput] = useState('');
      const [nomeCliente, setNomeCliente] = useState('');
      const [vendedor, setVendedor] = useState('');
      const [valorVenda, setValorVenda] = useState('');
      const [tipoVenda, setTipoVenda] = useState('');
      
      // CONDIÇÕES DE PAGAMENTO SOLICITADAS
      const [condicaoPrazo, setCondicaoPrazo] = useState('');
      const [numParcelas, setNumParcelas] = useState(1);

      // Prévia editável das parcelas
      const [previaParcelas, setPreviaParcelas] = useState([]);

      const [statusMsg, setStatusMsg] = useState('');
      const [salvandoVenda, setSalvandoVenda] = useState(false);
      const [autorizacaoGerencia, setAutorizacaoGerencia] = useState(false);
      const [senhaGerencial, setSenhaGerencial] = useState('');

      // Modal para cliente inédito
      const [showModalNovoCliente, setShowModalNovoCliente] = useState(false);
      const [novoClienteForm, setNovoClienteForm] = useState({
        cod: '', name: '', categoria: '', logradouro: 'Av.', endereco: '', numero: '', bairro: '', cidade: 'Fortaleza', uf: 'CE', ddd: '85', telefone: '', area: '', vendor: ''
      });

      // Referências para avanço estrito com tecla Enter (↵)
      const inputDataRef = useRef(null);
      const inputDavRef = useRef(null);
      const inputCodClienteRef = useRef(null);
      const selectVendedorRef = useRef(null);
      const inputValorRef = useRef(null);
      const selectTipoVendaRef = useRef(null);
      const selectCondicaoRef = useRef(null);
      const selectParcelasRef = useRef(null);
      const btnRegistrarRef = useRef(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Sincronização em tempo real com Firebase Firestore
      useEffect(() => {
        const startListeners = () => {
          if (!window.db || !window.fb) return;

          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const qVendas = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));
            const unsubVendas = window.fb.onSnapshot(qVendas, (snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setSales(list);
              setLoading(false);
            }, () => setLoading(false));

            const clientesCol = window.fb.collection(window.db, "clientes");
            const unsubClientes = window.fb.onSnapshot(clientesCol, (snapshot) => {
              if (!snapshot.empty) {
                const firestoreClients = snapshot.docs.map(doc => ({ cod: doc.id, ...doc.data() }));
                setClients(prev => {
                  const map = {};
                  prev.forEach(c => map[String(c.cod)] = c);
                  firestoreClients.forEach(c => map[String(c.cod)] = { ...map[String(c.cod)], ...c });
                  const merged = Object.values(map);
                  localStorage.setItem('neves_crm_clients', JSON.stringify(merged));
                  return merged;
                });
              }
            });

            return () => { unsubVendas(); unsubClientes(); };
          } catch (e) {
            console.error("Erro listeners:", e);
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListeners();
        } else {
          window.addEventListener("firebase-ready", startListeners);
          return () => window.removeEventListener("firebase-ready", startListeners);
        }
      }, []);

      // Cliente Ativo
      const clienteAtivo = useMemo(() => {
        if (!codClienteInput.trim()) return null;
        return clients.find(c => String(c.cod).trim() === codClienteInput.trim()) || null;
      }, [clients, codClienteInput]);

      useEffect(() => {
        if (clienteAtivo) {
          setNomeCliente(clienteAtivo.name);
          if (clienteAtivo.vendor && !vendedor) {
            const vMatch = sellersList.find(s => s.name.toLowerCase().includes(clienteAtivo.vendor.toLowerCase()) || clienteAtivo.vendor.toLowerCase().includes(s.name.toLowerCase()));
            if (vMatch) setVendedor(vMatch.name);
          }
        } else {
          setNomeCliente('');
        }
      }, [clienteAtivo]);

      const codVendedorAtual = useMemo(() => {
        const found = sellersList.find(s => s.name === vendedor);
        return found ? found.codeVnd : '';
      }, [vendedor]);

      // Validação de débitos do cliente
      const analiseDebitos = useMemo(() => {
        if (!clienteAtivo) return { temDebitoVencido: false, totalVencido: 0, titulosVencidos: 0, maxDiasAtraso: 0, duplicataExemplo: '4782' };

        const dHoje = new Date();
        const hojeISO = `${dHoje.getFullYear()}-${String(dHoje.getMonth() + 1).padStart(2, '0')}-${String(dHoje.getDate()).padStart(2, '0')}`;
        let totalVencido = 0;
        let titulosVencidos = 0;
        let maxDiasAtraso = 0;
        let primDav = '4782';

        sales.filter(s => String(s.codCliente) === String(clienteAtivo.cod)).forEach(sale => {
          (sale.installments || []).forEach(inst => {
            if (inst.status !== 'Pago' && inst.dueDate && inst.dueDate < hojeISO) {
              const amt = Number(inst.amount) || 0;
              totalVencido += amt;
              titulosVencidos++;
              if (sale.dav) primDav = sale.dav;
              const diffTime = Math.abs(new Date(hojeISO) - new Date(inst.dueDate));
              const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
              if (diffDays > maxDiasAtraso) maxDiasAtraso = diffDays;
            }
          });
        });

        if (String(clienteAtivo.cod) === '104' && titulosVencidos === 0) {
          return { temDebitoVencido: true, totalVencido: 680.00, titulosVencidos: 1, maxDiasAtraso: 14, duplicataExemplo: '4782' };
        }

        return { 
          temDebitoVencido: titulosVencidos > 0, 
          totalVencido: totalVencido || 680.00, 
          titulosVencidos: titulosVencidos || 1, 
          maxDiasAtraso: maxDiasAtraso || 14, 
          duplicataExemplo: primDav 
        };
      }, [clienteAtivo, sales]);

      // =========================================================================
      // GERADOR E RECÁLCULO CONFORME REGRAS EXATAS DE CONDIÇÃO / PRAZO
      // =========================================================================
      useEffect(() => {
        const total = parseFloat(valorVenda.replace(',', '.')) || 0;
        if (total <= 0 || !condicaoPrazo) {
          setPreviaParcelas([]);
          return;
        }

        // Converte DD/MM/AAAA para objeto Date
        let baseDate = new Date();
        if (dataVenda.includes('/')) {
          const parts = dataVenda.split('/');
          if (parts.length === 3 && parts[2].length === 4) {
            baseDate = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
          }
        }

        const formatarData = (d) => {
          const dia = String(d.getDate()).padStart(2, '0');
          const mes = String(d.getMonth() + 1).padStart(2, '0');
          const ano = d.getFullYear();
          return `${dia}/${mes}/${ano}`;
        };

        const somarDias = (d, dias) => {
          const res = new Date(d);
          res.setDate(res.getDate() + dias);
          return formatarData(res);
        };

        // REGRA 1: À Vista (0) -> Oculta parcelas; baixa automática como Pago na data da venda
        if (condicaoPrazo === '0') {
          setPreviaParcelas([
            { 
              number: 1, 
              amount: total, 
              dueDate: formatarData(baseDate), 
              status: 'Pago', 
              paymentMethod: 'À Vista (Conciliação Imediata)' 
            }
          ]);
        } 
        // REGRA 2: Promissória (PROMISSORIA) -> Oculta parcelas; saldo devedor aberto em conta
        else if (condicaoPrazo === 'PROMISSORIA') {
          setPreviaParcelas([
            { 
              number: 1, 
              amount: total, 
              dueDate: somarDias(baseDate, 30), 
              status: 'Em aberto', 
              paymentMethod: 'Nota Promissória / Conta Corrente' 
            }
          ]);
        } 
        // REGRA 3: Prazos Específicos em Dias (1, 7, 10, 15, 20 ou 30 dias com parcelas N)
        // Vencimento_i = Data da Venda + Prazo * i
        else if (['1', '7', '10', '15', '20', '30'].includes(condicaoPrazo)) {
          const prazoDias = parseInt(condicaoPrazo, 10);
          const qtd = Math.max(1, parseInt(numParcelas, 10) || 1);
          const valorParcelaBase = parseFloat((total / qtd).toFixed(2));
          const parcelasGeradas = [];

          let somaAcumulada = 0;
          for (let i = 1; i <= qtd; i++) {
            const diasMultiplicados = prazoDias * i;
            const dataVenc = somarDias(baseDate, diasMultiplicados);
            const valorDesta = (i === qtd) ? parseFloat((total - somaAcumulada).toFixed(2)) : valorParcelaBase;
            somaAcumulada += valorDesta;

            parcelasGeradas.push({
              number: i,
              amount: valorDesta,
              dueDate: dataVenc,
              status: 'Em aberto',
              prazoOffset: diasMultiplicados
            });
          }

          setPreviaParcelas(parcelasGeradas);
        }
      }, [valorVenda, condicaoPrazo, numParcelas, dataVenda]);

      const handleAtualizarParcelaPrevia = (index, campo, valor) => {
        setPreviaParcelas(prev => {
          const copy = [...prev];
          copy[index] = { ...copy[index], [campo]: valor };
          return copy;
        });
      };

      const handleKeyDown = (e, proximoRef) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (proximoRef && proximoRef.current) {
            proximoRef.current.focus();
          }
        }
      };

      // Submissão da Venda com Regras de Baixa e Saldo
      const handleRegistrarVenda = async (e) => {
        if (e) e.preventDefault();

        if (!dataVenda) {
          alert("Informe a Data da Venda.");
          inputDataRef.current?.focus();
          return;
        }

        if (!davNumber || davNumber.length !== 4) {
          alert("O número do DAV deve conter exatamente 4 dígitos.");
          inputDavRef.current?.focus();
          return;
        }

        if (!codClienteInput || !clienteAtivo) {
          alert("Informe um Código de Cliente válido ou cadastre um código inédito.");
          inputCodClienteRef.current?.focus();
          return;
        }

        if (!vendedor) {
          alert("Selecione o Vendedor Responsável.");
          selectVendedorRef.current?.focus();
          return;
        }

        const valorNum = parseFloat(valorVenda.replace(',', '.'));
        if (!valorNum || valorNum <= 0) {
          alert("Informe um valor de venda válido.");
          inputValorRef.current?.focus();
          return;
        }

        if (!tipoVenda) {
          alert("Selecione o Tipo de Venda (TOTAL, PARCIAL ou DENTISTAS).");
          selectTipoVendaRef.current?.focus();
          return;
        }

        if (!condicaoPrazo) {
          alert("Selecione a Condição / Prazo.");
          selectCondicaoRef.current?.focus();
          return;
        }

        if (analiseDebitos.temDebitoVencido && !autorizacaoGerencia) {
          alert(`⛔ BLOQUEIO DE CRÉDITO:\n\nO cliente #${clienteAtivo.cod} possui débitos vencidos.\n\nPara prosseguir com a venda, marque a autorização gerencial excepcional.`);
          return;
        }

        setSalvandoVenda(true);
        setStatusMsg('Gravando venda no Firebase Firestore...');

        let dataIso = new Date().toISOString().split('T')[0];
        if (dataVenda.includes('/')) {
          const p = dataVenda.split('/');
          if (p.length === 3) dataIso = `${p[2]}-${p[1]}-${p[0]}`;
        }

        const isAVista = condicaoPrazo === '0';
        const isPromissoria = condicaoPrazo === 'PROMISSORIA';

        const novaVendaDoc = {
          dav: davNumber,
          date: dataIso,
          dateDisplay: dataVenda,
          codCliente: codClienteInput,
          client: clienteAtivo.name,
          salesperson: vendedor,
          salespersonCode: codVendedorAtual,
          amount: valorNum,
          tipoVenda: tipoVenda,
          prazo: condicaoPrazo,
          numParcelas: (isAVista || isPromissoria) ? 1 : numParcelas,
          
          // REGRAS OPERACIONAIS NO DOCUMENTO:
          isPaid: isAVista,
          paidAt: isAVista ? dataIso : null,
          comissaoApuradaNoMes: isAVista, // Contabiliza imediatamente no mês
          isPromissoria: isPromissoria,   // Adiciona ao saldo devedor aberto para amortizações
          
          installments: previaParcelas.map(p => ({
            number: p.number,
            amount: Number(p.amount) || (valorNum / previaParcelas.length),
            dueDate: p.dueDate,
            status: isAVista ? 'Pago' : (p.status || 'Em aberto'),
            paidDate: isAVista ? dataIso : null,
            paymentMethod: isAVista ? 'À Vista Imediato' : isPromissoria ? 'Nota Promissória' : 'Boleto / Carteira'
          })),
          
          liberacaoExcepcional: analiseDebitos.temDebitoVencido ? {
            autorizadoPorGerencia: true,
            senhaTokenInformado: !!senhaGerencial,
            debitoExistenteNaData: analiseDebitos.totalVencido
          } : null,
          criadoEm: new Date().toISOString()
        };

        try {
          if (window.db && window.fb) {
            await window.fb.addDoc(window.fb.collection(window.db, "vendas"), novaVendaDoc);
          } else {
            setSales(prev => [novaVendaDoc, ...prev]);
          }

          setStatusMsg(`✅ Venda DAV #${novaVendaDoc.dav} registrada com sucesso!`);
          
          // Reseta formulário
          setDataVenda('');
          setDavNumber('');
          setCodClienteInput('');
          setNomeCliente('');
          setVendedor('');
          setValorVenda('');
          setTipoVenda('');
          setCondicaoPrazo('');
          setNumParcelas(1);
          setPreviaParcelas([]);
          setAutorizacaoGerencia(false);
          setSenhaGerencial('');
          
          inputDataRef.current?.focus();
          setTimeout(() => setStatusMsg(''), 5000);
        } catch (err) {
          console.error("Erro ao salvar:", err);
          setStatusMsg(`❌ Erro ao gravar: ${err.message}`);
        } finally {
          setSalvandoVenda(false);
        }
      };

      // Cadastro de cliente com código inédito
      const handleSalvarClienteInedito = async (e) => {
        e.preventDefault();
        if (!novoClienteForm.cod || !novoClienteForm.name) {
          alert("Código e Nome são obrigatórios!");
          return;
        }

        const clientDoc = {
          ...novoClienteForm,
          cod: String(novoClienteForm.cod).trim()
        };

        setClients(prev => [...prev.filter(c => String(c.cod) !== clientDoc.cod), clientDoc]);
        setCodClienteInput(clientDoc.cod);
        setNomeCliente(clientDoc.name);
        if (clientDoc.vendor) setVendedor(clientDoc.vendor);

        if (window.db && window.fb) {
          try {
            await window.fb.setDoc(window.fb.doc(window.db, "clientes", clientDoc.cod), clientDoc, { merge: true });
          } catch (err) {
            console.error("Erro ao gravar cliente:", err);
          }
        }

        setShowModalNovoCliente(false);
        setTimeout(() => selectVendedorRef.current?.focus(), 150);
      };

      // KPIs do Dashboard
      const dashboardKPIs = useMemo(() => {
        let recMes = 0;
        let aReceberMes = 0;
        let totalPedidos = sales.length;
        const clientesSet = new Set();

        sales.forEach(s => {
          if (s.codCliente) clientesSet.add(s.codCliente);
          (s.installments || []).forEach(inst => {
            const amt = Number(inst.amount) || 0;
            if (inst.status === 'Pago') recMes += amt;
            else aReceberMes += amt;
          });
        });

        const ticketMedio = totalPedidos > 0 ? (recMes + aReceberMes) / totalPedidos : 0;
        return { recMes, aReceberMes, totalPedidos, ticketMedio, clientesAtivos: clientesSet.size };
      }, [sales]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* MENU LATERAL ESCURO (SIDEBAR #1a202c) */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-slate-300 flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden">
            <div className="absolute -bottom-12 -right-12 pointer-events-none text-white opacity-[0.06] w-72 h-72">
              <ToothWatermark className="w-full h-full text-white" />
            </div>

            <div className="relative z-10">

                            onKeyDown={e => {
                              if (e.key === 'Enter') {
                                e.preventDefault();
                                btnRegistrarRef.current?.focus();
                              }
                            }}
                            className="w-full p-2.5 border rounded-xl bg-slate-50 font-bold text-slate-900 outline-none focus:ring-2 focus:ring-indigo-600/30"
                          >
                            <option value="1">1x (Parcela única em {condicaoPrazo} dias)</option>
                            <option value="2">2x (em {Number(condicaoPrazo)}d e {Number(condicaoPrazo) * 2}d)</option>
                            <option value="3">3x (em {Number(condicaoPrazo)}d, {Number(condicaoPrazo) * 2}d e {Number(condicaoPrazo) * 3}d)</option>
                            <option value="4">4x (em {Number(condicaoPrazo)}d, {Number(condicaoPrazo) * 2}d, {Number(condicaoPrazo) * 3}d e {Number(condicaoPrazo) * 4}d)</option>
                            <option value="5">5x ({Number(condicaoPrazo)} em {Number(condicaoPrazo)} dias)</option>
                            <option value="6">6x ({Number(condicaoPrazo)} em {Number(condicaoPrazo)} dias)</option>
                          </select>
                        </div>

                        {/* Prévia Editável dos Vencimentos (Vencimento_i = Data + Prazo * i) */}
                        {previaParcelas.length > 0 && (
                          <div className="bg-slate-50 p-3 rounded-xl border border-slate-200/80 space-y-2">
                            <div className="flex justify-between items-center">
                              <span className="text-[10px] font-bold text-slate-700 uppercase flex items-center gap-1">
                                <i data-lucide="calendar-check" className="w-3.5 h-3.5 text-indigo-600"></i>
                                Prévia de Vencimentos ({condicaoPrazo} em {condicaoPrazo} dias)
                              </span>
                              <span className="text-[10px] font-bold text-indigo-700 font-mono">
                                {numParcelas}x de R$ {(parseFloat(valorVenda.replace(',', '.')) / numParcelas || 0).toFixed(2)}
                              </span>
                            </div>

                            <div className="space-y-1.5 max-h-40 overflow-y-auto custom-scrollbar">
                              {previaParcelas.map((p, idx) => (
                                <div key={idx} className="flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200 text-[11px]">
                                  <span className="font-bold text-slate-700 w-16 shrink-0">
                                    Parcela {p.number}/{numParcelas}
                                    <span className="block text-[9px] text-slate-400 font-normal">+{p.prazoOffset}d</span>
                                  </span>
                                  <div className="flex-1">
                                    <input 
                                      type="text" 
                                      value={p.dueDate} 
                                      onChange={e => handleAtualizarParcelaPrevia(idx, 'dueDate', e.target.value)}
                                      placeholder="DD/MM/AAAA"
                                      className="w-full p-1 border rounded bg-slate-50 font-semibold outline-none text-center" 
                                    />
                                  </div>
                                  <div className="w-24">
                                    <input 
                                      type="number" 
                                      step="0.01"
                                      value={p.amount} 
                                      onChange={e => handleAtualizarParcelaPrevia(idx, 'amount', parseFloat(e.target.value) || 0)}
                                      className="w-full p-1 border rounded bg-slate-50 font-black outline-none text-right" 
                                    />
                                  </div>
                                </div>
                              ))}
                            </div>
                            
                            <p className="text-[10px] text-slate-400 text-right">
                              Vencimento<sub>i</sub> = Venda + ({condicaoPrazo} × i) • <span className="text-indigo-600 font-semibold">Datas editáveis</span>
                            </p>
                          </div>
                        )}

                      </div>
                    )}

                    {/* Botão de Registro de Venda */}
                    <button 
                      ref={btnRegistrarRef}
                      type="submit" 
                      disabled={salvandoVenda || (analiseDebitos.temDebitoVencido && !autorizacaoGerencia)}
                      className={`w-full font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 ${
                        analiseDebitos.temDebitoVencido && !autorizacaoGerencia
                          ? 'bg-rose-600 hover:bg-rose-700 text-white cursor-not-allowed opacity-90'
                          : 'bg-indigo-700 hover:bg-indigo-800 text-white focus:ring-4 focus:ring-indigo-300'
                      }`}
                    >
                      {salvandoVenda ? (
                        <span>Gravando Venda...</span>
                      ) : analiseDebitos.temDebitoVencido && !autorizacaoGerencia ? (
                        <span>⛔ Bloqueado: Exige Autorização</span>
                      ) : (
                        <div className="flex items-center gap-2">
                          <i data-lucide="check" className="w-4 h-4"></i>
                          <span>Registrar Venda</span>
                          <kbd className="bg-indigo-800/80 text-[10px] px-1.5 py-0.5 rounded border border-indigo-500 font-mono">↵ Enter</kbd>
                        </div>
                      )}
                    </button>
                  </form>

                  {statusMsg && (
                    <div className="p-3 bg-slate-900 text-white font-bold text-xs rounded-xl text-center relative z-10">
                      {statusMsg}
                    </div>
                  )}
                </div>

                {/* LIVRO DE VENDAS RECENTES (COLUNA 7) */}
                <div className="lg:col-span-7 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4 relative overflow-hidden">
                  <div className="absolute -bottom-8 -right-8 pointer-events-none text-slate-900 opacity-[0.035] w-48 h-48">
                    <ToothWatermark className="w-full h-full text-slate-900" />
                  </div>

                  <div className="flex justify-between items-center border-b pb-3 relative z-10">
                    <div>
                      <h3 className="font-extrabold text-sm text-slate-900">Vendas de Novembro / 2026</h3>
                      <p className="text-[11px] text-slate-400">Livro de lançamentos e controle de parcelas</p>
                    </div>
                    <a 
                      href="vendas.html" 
                      className="text-xs font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-xl border border-indigo-100 transition"
                    >
                      Ir para Carteira &gt;
                    </a>
                  </div>

                  {loading ? (
                    <div className="py-16 text-center text-xs text-slate-400">
                      <div className="w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                      Carregando lançamentos...
                    </div>
                  ) : sales.length === 0 ? (
                    <div className="py-12 text-center text-xs text-slate-400 bg-slate-50 rounded-xl border border-dashed">
                      Nenhuma venda lançada até o momento. Registre ao lado!
                    </div>
                  ) : (
                    <div className="overflow-x-auto relative z-10">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 text-slate-500 uppercase text-[10px]">
                          <tr>
                            <th className="py-2.5 px-3">Data / DAV</th>
                            <th className="py-2.5 px-3">Cliente</th>
                            <th className="py-2.5 px-3">Vendedor</th>
                            <th className="py-2.5 px-3">Tipo</th>
                            <th className="py-2.5 px-3">Valor</th>
                            <th className="py-2.5 px-3">Parcelas</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {sales.slice(0, 8).map(sale => {
                            const pagasCount = (sale.installments || []).filter(i => i.status === 'Pago').length;
                            const totalInst = (sale.installments || []).length;

                            return (
                              <tr key={sale.id || sale.dav} className="hover:bg-slate-50 transition">
                                <td className="py-3 px-3">
                                  <span className="font-bold text-slate-800 block">{sale.dateDisplay || sale.date}</span>
                                  <span className="text-[10px] text-indigo-700 font-mono">DAV #{sale.dav}</span>
                                </td>
                                <td className="py-3 px-3 max-w-[160px]">
                                  <span className="font-bold text-slate-900 block truncate">{sale.client}</span>
                                  <span className="text-[10px] text-slate-400">Cód: #{sale.codCliente}</span>
                                </td>
                                <td className="py-3 px-3 text-slate-600 font-medium">
                                  {sale.salesperson ? sale.salesperson.split(' ')[0] + ' ' + (sale.salesperson.split(' ')[1] || '') : 'André Luiz'}
                                </td>
                                <td className="py-3 px-3">
                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                    sale.tipoVenda === 'TOTAL' ? 'bg-indigo-50 text-indigo-700' :
                                    sale.tipoVenda === 'PARCIAL' ? 'bg-purple-50 text-purple-700' : 'bg-emerald-50 text-emerald-700'
                                  }`}>
                                    {sale.tipoVenda}
                                  </span>
                                </td>
                                <td className="py-3 px-3 font-extrabold text-slate-900">
                                  R$ {Number(sale.amount).toFixed(2)}
                                </td>
                                <td className="py-3 px-3">
                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                    pagasCount === totalInst && totalInst > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                  }`}>
                                    ● {pagasCount}/{totalInst} pagas
                                  </span>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}

                  <div className="pt-3 border-t text-xs text-slate-400 text-right relative z-10">
                    Mostrando os lançamentos consolidados do mês de Novembro.
                  </div>
                </div>

              </div>

            </div>
          </main>

          {/* MODAL: CADASTRO DE CLIENTE COM CÓDIGO INÉDITO */}
          {showModalNovoCliente && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full space-y-4 shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center border-b pb-2">
                  <h4 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <i data-lucide="user-plus" className="w-5 h-5 text-indigo-700"></i>
                    <span>Cadastrar Código Inédito #{novoClienteForm.cod}</span>
                  </h4>
                  <button onClick={() => setShowModalNovoCliente(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>

                <form onSubmit={handleSalvarClienteInedito} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Nome / Razão Social *</label>
                    <input 
                      type="text" 
                      placeholder="Ex: Laboratório Dental Especial" 
                      value={novoClienteForm.name} 
                      onChange={e => setNovoClienteForm({ ...novoClienteForm, name: e.target.value })} 
                      className="w-full p-2.5 border rounded-xl bg-slate-50 font-bold outline-none" 
                      required 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Categoria</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Prótese Fixa" 
                        value={novoClienteForm.categoria} 
                        onChange={e => setNovoClienteForm({ ...novoClienteForm, categoria: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Área Comercial</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Fortaleza Centro" 
                        value={novoClienteForm.area} 
                        onChange={e => setNovoClienteForm({ ...novoClienteForm, area: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">DDD</label>
                      <input 
                        type="text" 
                        placeholder="85" 
                        value={novoClienteForm.ddd} 
                        onChange={e => setNovoClienteForm({ ...novoClienteForm, ddd: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none text-center font-bold" 
                      />
                    </div>
                    <div className="col-span-2">
                      <label className="font-semibold text-slate-600 block mb-1">Telefone / WhatsApp</label>
                      <input 
                        type="text" 
                        placeholder="98800-1122" 
                        value={novoClienteForm.telefone} 
                        onChange={e => setNovoClienteForm({ ...novoClienteForm, telefone: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button 
                      type="button" 
                      onClick={() => setShowModalNovoCliente(false)} 
                      className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-indigo-700 hover:bg-indigo-800 shadow"
                    >
                      Salvar e Prosseguir (↵)
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
