  <!-- Inicialização do Firebase Firestore v10 com getDocs (Busca Única sem Loop) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      getDocs, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",
      storageBucket: "neves-pro-crm-comissoes.firebasestorage.app",
      messagingSenderId: "747505960352",
      appId: "1:747505960352:web:5e7d2d5168a14dbfe490c5",
      measurementId: "G-9CF84R9BWM"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.fb = { collection, doc, setDoc, addDoc, updateDoc, deleteDoc, getDocs, query, orderBy };
      window.dispatchEvent(new Event("firebase-ready"));
      console.log("🔥 Firebase Firestore conectado com busca única (anti-loop) no index.html!");
    } catch (err) {
      console.error("Erro ao inicializar Firebase no index.html:", err);
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const formatBRL = (val) => {
      const n = Number(val) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    // Base de clientes padrão sincronizada com os vendedores auditados
    const initialClientsSeed = [
      { cod: "2", name: "JOÃO PESSOA MEDEIROS COSTA", categoria: "Prótese Fixa", telefone: "(85) 99122-3344", cnpj: "02.145.890/0001-34", endereco: "Rua Monsenhor Tabosa, 450 - Praia de Iracema", cidade: "Fortaleza - CE", vendor: "André Luiz Nóbrega Martins", temDebito: false },
      { cod: "4", name: "LEONARDO AMORIM DE FRANCA E SOUSA", categoria: "Prótese Total e Parcial", telefone: "(85) 98844-1234", cnpj: "04.312.980/0001-89", endereco: "Av. Santos Dumont, 1200 - Aldeota", cidade: "Fortaleza - CE", vendor: "Luis Daniel da Silva", temDebito: true, debitoValor: 680.00, debitoDias: 14, debitoDoc: "Duplicata #4782", vencimentoMes: 420.00, vencimentoMesData: "28/11/2026" },
      { cod: "5", name: "IMPRESSIONE LABORATÓRIO DE PROTESE LTDA", categoria: "Ortodontia & Fixa", telefone: "(85) 98711-2233", cnpj: "12.345.678/0001-90", endereco: "Av. Dom Luís, 800 - Aldeota", cidade: "Fortaleza - CE", vendor: "André Luiz Nóbrega Martins", temDebito: false },
      { cod: "7", name: "DAVI DA CUNHA GONCALVES", categoria: "Implantodontia", telefone: "(85) 99655-4433", cnpj: "01.998.441/0001-12", endereco: "Rua Barão de Studart, 1550 - Dionísio Torres", cidade: "Fortaleza - CE", vendor: "André Luiz Nóbrega Martins", temDebito: false },
      { cod: "8", name: "LEONARDO DA SILVA SOUZA", categoria: "Ortodontia Digital", telefone: "(88) 98122-9988", cnpj: "05.512.671/0001-01", endereco: "Rua Coronel Mont Alverne, 210 - Centro", cidade: "Sobral - CE", vendor: "Luis Daniel da Silva", temDebito: false },
      { cod: "14", name: "CLINICA ODONTOLOGICA JORIO DA ESCOSSIA LTDA", categoria: "Próteses Múltiplas", telefone: "(85) 99455-1100", cnpj: "07.891.234/0001-45", endereco: "Av. Pontes Vieira, 2500 - Dionísio Torres", cidade: "Fortaleza - CE", vendor: "André Luiz Nóbrega Martins", temDebito: false }
    ];

    const vendedoresCadastrados = [
      { code: "VND-01", name: "André Luiz Nóbrega Martins" },
      { code: "VND-02", name: "Luis Daniel da Silva" }
    ];

    function App() {
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [clients, setClients] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_clients');
          return saved ? JSON.parse(saved) : initialClientsSeed;
        } catch {
          return initialClientsSeed;
        }
      });

      // Estados do formulário de Nova Venda
      const [davDate, setDavDate] = useState(() => {
        const d = new Date();
        return d.toISOString().split('T')[0];
      });
      const [davNumber, setDavNumber] = useState('');
      const [codClienteInput, setCodClienteInput] = useState('');
      const [clienteSelecionado, setClienteSelecionado] = useState(null);
      const [codVendedor, setCodVendedor] = useState('VND-01');
      const [valorVenda, setValorVenda] = useState('');
      const [tipoVenda, setTipoVenda] = useState('TOTAL');
      const [condicaoPrazo, setCondicaoPrazo] = useState('30_DIAS');
      const [numParcelas, setNumParcelas] = useState(1);
      const [previewParcelas, setPreviewParcelas] = useState([]);

      // Validação de Exceção Gerencial
      const [autorizarExcecao, setAutorizarExcecao] = useState(false);
      const [tokenGerente, setTokenGerente] = useState('');
      const [tokenValidado, setTokenValidado] = useState(false);

      // Filtro da tabela
      const [filtroTexto, setFiltroTexto] = useState('');

      // Trava de execução estritamente única no carregamento (anti-loop)
      const carregouRef = useRef(false);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Função isolada de busca única com getDocs (0 consumo desnecessário)
      const buscarDadosUmaVez = async (isManual = false) => {
        if (!window.db || !window.fb) return;

        try {
          if (isManual) setRefreshing(true);
          else setLoading(true);

          // 1. Busca ÚNICA de Vendas
          const qVendas = window.fb.query(
            window.fb.collection(window.db, "vendas"),
            window.fb.orderBy("date", "desc")
          );
          const snapVendas = await window.fb.getDocs(qVendas);
          const listaVendas = snapVendas.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setSales(listaVendas);

          // 2. Busca ÚNICA de Clientes
          const snapClientes = await window.fb.getDocs(window.fb.collection(window.db, "clientes"));
          if (!snapClientes.empty) {
            const firestoreClients = snapClientes.docs.map(doc => ({ cod: doc.id, ...doc.data() }));
            setClients(prev => {
              const map = {};
              prev.forEach(c => map[String(c.cod)] = c);
              firestoreClients.forEach(c => map[String(c.cod)] = { ...map[String(c.cod)], ...c });
              const merged = Object.values(map);
              try {
                localStorage.setItem('neves_crm_clients', JSON.stringify(merged));
              } catch (e) {}
              return merged;
            });
          }
        } catch (e) {
          console.error("Erro na busca única do Firebase:", e);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      // Executa exatamente uma única vez ao iniciar
      useEffect(() => {
        if (carregouRef.current) return;
        carregouRef.current = true;

        if (window.db && window.fb) {
          buscarDadosUmaVez();
        } else {
          window.addEventListener("firebase-ready", () => buscarDadosUmaVez(), { once: true });
        }
      }, []);

      // Sugerir próximo número de DAV sequencial
      useEffect(() => {
        if (sales.length > 0 && !davNumber) {
          const davNums = sales.map(s => parseInt(String(s.dav).replace(/\D/g, ''))).filter(n => !isNaN(n));
          if (davNums.length > 0) {
            const max = Math.max(...davNums);
            setDavNumber(String(max + 1));
          } else {
            setDavNumber('48925');
          }
        } else if (!davNumber) {
          setDavNumber('48925');
        }
      }, [sales]);

      // Buscar cliente por código digitado
      const handleBuscarCliente = (codDigitado) => {
        const cod = String(codDigitado).trim();
        setCodClienteInput(cod);
        if (!cod) {
          setClienteSelecionado(null);
          return;
        }
        const achou = clients.find(c => String(c.cod) === cod);
        if (achou) {
          setClienteSelecionado(achou);
          if (achou.vendor) {
            const vend = vendedoresCadastrados.find(v => v.name.toLowerCase().includes(achou.vendor.split(' ')[0].toLowerCase()));
            if (vend) setCodVendedor(vend.code);
          }
        } else {
          setClienteSelecionado(null);
        }
      };

      // Cálculo dinâmico das parcelas (até 12x)
      useEffect(() => {
        const val = parseFloat(valorVenda.replace(',', '.')) || 0;
        const nParc = parseInt(numParcelas) || 1;
        if (val <= 0 || nParc <= 0) {
          setPreviewParcelas([]);
          return;
        }

        let diasBase = 30;
        if (condicaoPrazo === 'A_VISTA') diasBase = 0;
        else if (condicaoPrazo === '15_DIAS') diasBase = 15;
        else if (condicaoPrazo === '30_DIAS') diasBase = 30;
        else if (condicaoPrazo === '45_DIAS') diasBase = 45;
        else if (condicaoPrazo === '60_DIAS') diasBase = 60;

        const valorPorParcela = parseFloat((val / nParc).toFixed(2));
        const diffAjuste = parseFloat((val - (valorPorParcela * nParc)).toFixed(2));

        const baseDate = davDate ? new Date(davDate + 'T00:00:00') : new Date();

        const lista = [];
        for (let i = 1; i <= nParc; i++) {
          const diasAdicionais = diasBase === 0 ? 0 : diasBase * i;
          const dataVenc = new Date(baseDate.getTime());
          dataVenc.setDate(dataVenc.getDate() + diasAdicionais);

          const dia = String(dataVenc.getDate()).padStart(2, '0');
          const mes = String(dataVenc.getMonth() + 1).padStart(2, '0');
          const ano = dataVenc.getFullYear();
          const dataFormatada = `${dia}/${mes}/${ano}`;

          const valorFinalParcela = i === 1 ? parseFloat((valorPorParcela + diffAjuste).toFixed(2)) : valorPorParcela;

          lista.push({
            number: i,
            dias: diasAdicionais,
            dueDate: dataFormatada,
            amount: valorFinalParcela,
            status: diasBase === 0 ? 'Pago' : 'Em aberto'
          });
        }

        setPreviewParcelas(lista);
      }, [valorVenda, numParcelas, condicaoPrazo, davDate]);

      // Submissão da Nova Venda
      const handleRegistrarVenda = async (e) => {
        e.preventDefault();

        if (!clienteSelecionado) {
          alert("Por favor, selecione um cliente cadastrado válido.");
          return;
        }

        if (clienteSelecionado.temDebito && !autorizarExcecao) {
          alert("⚠️ ATENÇÃO: Este cliente possui débito vencido! Para autorizar esta venda, marque a opção de autorização excepcional.");
          return;
        }

        if (clienteSelecionado.temDebito && autorizarExcecao && !tokenValidado) {
          alert("Por favor, valide a senha ou token do supervisor para continuar.");
          return;
        }

        const val = parseFloat(valorVenda.replace(',', '.')) || 0;
        if (val <= 0) {
          alert("Informe um valor de venda válido.");
          return;
        }

        const vendedorObj = vendedoresCadastrados.find(v => v.code === codVendedor) || vendedoresCadastrados[0];

        const novaVenda = {
          dav: davNumber || String(Math.floor(10000 + Math.random() * 90000)),
          codCliente: clienteSelecionado.cod,
          client: clienteSelecionado.name,
          category: clienteSelecionado.categoria || "Geral",
          salesperson: vendedorObj.name,
          salespersonCode: vendedorObj.code,
          amount: val,
          tipoVenda: tipoVenda,
          condicao: condicaoPrazo,
          parcelas: parseInt(numParcelas),
          installments: previewParcelas,
          date: davDate,
          dateDisplay: davDate.split('-').reverse().join('/'),
          status: condicaoPrazo === 'A_VISTA' ? 'Pago' : 'Em aberto',
          isPaid: condicaoPrazo === 'A_VISTA',
          exceptionalApproval: autorizarExcecao ? { token: tokenGerente, approvedAt: new Date().toISOString() } : null,
          createdAt: new Date().toISOString()
        };

        if (window.db && window.fb) {
          try {
            const docRef = await window.fb.addDoc(window.fb.collection(window.db, "vendas"), novaVenda);
            novaVenda.id = docRef.id;
            setSales(prev => [novaVenda, ...prev]);
            alert(`✅ Venda DAV #${novaVenda.dav} registrada com sucesso no Firebase!`);
          } catch (err) {
            console.error("Erro ao salvar no Firestore:", err);
            alert("Erro ao gravar no banco. Gravando localmente.");
            setSales(prev => [novaVenda, ...prev]);
          }
        } else {
          setSales(prev => [novaVenda, ...prev]);
          alert(`✅ Venda DAV #${novaVenda.dav} registrada localmente!`);
        }

        // Limpar formulário mantendo integridade
        setValorVenda('');
        setCodClienteInput('');
        setClienteSelecionado(null);
        setAutorizarExcecao(false);
        setTokenGerente('');
        setTokenValidado(false);
        setDavNumber(String(parseInt(novaVenda.dav) + 1));
      };

      // Cálculos do Dashboard Superior
      const kpis = useMemo(() => {
        let totalReceita = 0;
        let totalBaixado = 0;
        let totalAReceber = 0;
        const clientesAtivos = new Set();

        sales.forEach(sale => {
          totalReceita += Number(sale.amount) || 0;
          if (sale.codCliente) clientesAtivos.add(String(sale.codCliente));

          (sale.installments || []).forEach(inst => {
            const amt = Number(inst.amount) || 0;
            if (inst.status === 'Pago') totalBaixado += amt;
            else totalAReceber += amt;
          });
        });

        const ticketMedio = sales.length > 0 ? totalReceita / sales.length : 0;

        return {
          totalReceita,
          totalBaixado,
          totalAReceber,
          totalPedidos: sales.length,
          ticketMedio,
          clientesAtivosCount: clientesAtivos.size
        };
      }, [sales]);

      // Vendas filtradas na tabela
      const vendasFiltradas = useMemo(() => {
        if (!filtroTexto.trim()) return sales;
        const termo = filtroTexto.toLowerCase();
        return sales.filter(s => 
          (s.client && s.client.toLowerCase().includes(termo)) ||
          (s.dav && String(s.dav).includes(termo)) ||
          (s.salesperson && s.salesperson.toLowerCase().includes(termo))
        );
      }, [sales, filtroTexto]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* BARRA LATERAL UNIFICADA COM LOGO OFICIAL E MARCA D'ÁGUA */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-white flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden select-none border-r border-slate-800" id="app-sidebar">
            <div className="absolute -bottom-10 -right-10 w-56 h-56 pointer-events-none opacity-[0.05] brightness-200">
              <img src="Design sem nome (28).png" alt="Marca d'água Teles Odonto" className="w-full h-full object-contain filter invert" />
            </div>

            <div className="relative z-10">
              <div className="p-6 border-b border-slate-800/80 flex flex-col gap-2">
                <div className="flex items-center gap-2">
                  <img src="Imagem RGB branco 3 - fundo transparente PNG.png" alt="Teles Odonto - Materiais Protéticos" className="h-10 w-auto object-contain" />
                </div>
                <div className="flex items-center justify-between mt-1 px-2 py-1 rounded bg-slate-800/60 border border-slate-700/50">
                  <span className="text-[11px] font-medium text-slate-300">Neves Pro CRM</span>
                  <span className="text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">v2.6 Audited</span>
                </div>
              </div>

              <div className="px-4 py-6 space-y-1.5">
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>

                <a href="index.html" className="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
                  <i data-lucide="layout-grid" className="w-4 h-4 text-white"></i>
                  <span>Página Inicial</span>
                </a>

                <a href="vendas.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="shopping-cart" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página de Vendas</span>
                </a>

                <a href="comissoes.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="briefcase" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Comissões</span>
                </a>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800/80 bg-slate-900/60 relative z-10">
              <div className="flex items-center gap-3 p-2 rounded-xl bg-slate-800/40 border border-slate-700/40">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow">
                  OP
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-semibold text-white truncate">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400 truncate">operador@salespro.com</p>
                </div>
                <div className="w-2 h-2 rounded-full bg-emerald-400 shrink-0 ring-4 ring-emerald-500/20"></div>
              </div>
              <p className="text-[10px] text-slate-400 text-center mt-3">© 2026 Neves Pro CRM</p>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            
            {/* TOPBAR LIMPO COM BOTÃO DE ATUALIZAÇÃO MANUAL */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Teles Odonto</span>
                <span className="text-slate-400">&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  Módulo Ativo • Dashboard
                </span>
              </div>

              <div className="flex items-center gap-3">
                {/* Botão de atualização manual sob demanda (economiza 100% de leituras) */}
                <button
                  onClick={() => buscarDadosUmaVez(true)}
                  disabled={refreshing || loading}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 text-xs font-semibold flex items-center gap-1.5 transition disabled:opacity-50"
                  title="Atualizar dados do Firebase sob demanda"
                >
                  <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 ${refreshing ? 'animate-spin text-indigo-600' : ''}`}></i>
                  <span>{refreshing ? 'Atualizando...' : 'Atualizar'}</span>
                </button>

                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  ● SISTEMA ONLINE
                </span>
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                  OP
                </div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              
              {/* BANNER DE FECHAMENTO FISCAL */}
              <div className="bg-slate-900 text-white p-5 rounded-3xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden">
                <div className="flex items-center gap-3 relative z-10">
                  <div className="w-11 h-11 rounded-2xl bg-slate-800 flex items-center justify-center text-indigo-400 border border-slate-700 shadow-inner">
                    <i data-lucide="clock" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">HORÁRIO DE BRASÍLIA</span>
                    <h3 className="text-xl font-black text-white">Novembro / 2026</h3>
                  </div>
                </div>

                <div className="flex items-center gap-4 relative z-10">
                  <div className="text-right">
                    <span className="text-[10px] text-slate-400 font-semibold block">Exercício Comercial</span>
                    <span className="text-xs font-bold text-emerald-400">● Busca Otimizada (Anti-Loop)</span>
                  </div>
                  <div className="bg-indigo-600/30 border border-indigo-500/30 px-3.5 py-2 rounded-2xl flex items-center gap-2">
                    <i data-lucide="calendar" className="w-4 h-4 text-indigo-300"></i>
                    <span className="text-xs font-bold text-indigo-200">Mês Vigente</span>
                  </div>
                </div>
              </div>

              {/* 4 CARDS DE INDICADORES (KPIS) */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm relative overflow-hidden">
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">RECEITA (NOVEMBRO)</span>
                    <div className="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                      <i data-lucide="receipt" className="w-4 h-4"></i>
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-slate-900 mt-2">{formatBRL(kpis.totalReceita)}</h3>
                  <p className="text-[11px] text-slate-400 mt-1">
                    Baixado: <strong className="text-emerald-600">{formatBRL(kpis.totalBaixado)}</strong>
                  </p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm relative overflow-hidden">
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">À RECEBER (CARTEIRA)</span>
                    <div className="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                      <i data-lucide="calendar-clock" className="w-4 h-4"></i>
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-slate-900 mt-2">{formatBRL(kpis.totalAReceber)}</h3>
                  <p className="text-[11px] text-slate-400 mt-1">
                    Projeção em aberto da carteira
                  </p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm relative overflow-hidden">
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">TOTAL DE VENDAS</span>
                    <div className="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                      <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-slate-900 mt-2">{kpis.totalPedidos} pedidos</h3>
                  <p className="text-[11px] text-slate-400 mt-1">
                    Ticket Médio: <strong className="text-slate-700">{formatBRL(kpis.ticketMedio)}</strong>
                  </p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm relative overflow-hidden">
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">CLIENTES ATIVOS</span>
                    <div className="w-8 h-8 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center">
                      <i data-lucide="users" className="w-4 h-4"></i>
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-slate-900 mt-2">{kpis.clientesAtivosCount} ativos</h3>
                  <p className="text-[11px] text-slate-400 mt-1">
                    Base com movimentação no mês
                  </p>
                </div>

              </div>

              {/* SEÇÃO PRINCIPAL: FORMULÁRIO DE NOVA VENDA + TABELA DE VENDAS */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                {/* FORMULÁRIO: NOVA VENDA */}
                <div className="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-700 flex items-center justify-center">
                        <i data-lucide="plus-circle" className="w-4 h-4"></i>
                      </div>
                      <h3 className="font-extrabold text-sm text-slate-900">Nova Venda</h3>
                    </div>
                    <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full">
                      Lançamento DAV
                    </span>
                  </div>

                  <form onSubmit={handleRegistrarVenda} className="space-y-3.5 text-xs">
                    
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Data da Venda</label>
                        <input 
                          type="date" 
                          value={davDate} 
                          onChange={e => setDavDate(e.target.value)} 
                          className="w-full p-2.5 border rounded-xl bg-slate-50 font-semibold outline-none focus:ring-2 focus:ring-indigo-600/30" 
                          required 
                        />
                      </div>
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">DAV (Nº Pedido)</label>
                        <input 
                          type="text" 
                          value={davNumber} 
                          onChange={e => setDavNumber(e.target.value)} 
                          placeholder="Ex: 48925" 
                          className="w-full p-2.5 border rounded-xl bg-slate-50 font-mono font-bold outline-none focus:ring-2 focus:ring-indigo-600/30" 
                          required 
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="font-bold text-slate-700">Cód. Cliente</label>
                        {clienteSelecionado ? (
                          <span className="text-[10px] font-bold text-emerald-600 flex items-center gap-1">
                            <i data-lucide="check" className="w-3 h-3"></i> Cliente Cadastrado
                          </span>
                        ) : (
                          <span className="text-[10px] text-slate-400">Digite o código para buscar</span>
                        )}
                      </div>
                      <div className="relative">
                        <input 
                          type="text" 
                          placeholder="Digite o código (ex: 2, 4, 5, 7, 8, 14)..." 
                          value={codClienteInput} 
                          onChange={e => handleBuscarCliente(e.target.value)} 
                          className="w-full pl-9 pr-4 py-2.5 border rounded-xl bg-slate-50 font-bold outline-none focus:ring-2 focus:ring-indigo-600/30" 
                          required 
                        />
                        <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                      </div>
                    </div>

                    {/* FICHA RESUMIDA DO CLIENTE ENCONTRADO */}
                    {clienteSelecionado && (
                      <div className="p-3.5 rounded-2xl bg-indigo-50/60 border border-indigo-100 space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-[9px] font-bold bg-indigo-200 text-indigo-900 px-2 py-0.5 rounded-full uppercase">
                              {clienteSelecionado.categoria || 'Geral'}
                            </span>
                            <h4 className="text-xs font-black text-slate-900 mt-1">{clienteSelecionado.name}</h4>
                            <p className="text-[10px] text-slate-500 mt-0.5">
                              {clienteSelecionado.telefone} • CNPJ: {clienteSelecionado.cnpj || 'Não inf.'}
                            </p>
                            <p className="text-[10px] text-slate-500">
                              {clienteSelecionado.endereco} - {clienteSelecionado.cidade}
                            </p>
                          </div>
                        </div>

                        {/* ALERTA DE DÉBITO VENCIDO / RESTRIÇÃO */}
                        {clienteSelecionado.temDebito && (
                          <div className="mt-2 p-3 rounded-xl bg-rose-50 border border-rose-200 space-y-2">
                            <div className="flex items-start justify-between">
                              <div className="flex items-center gap-2 text-rose-700">
                                <i data-lucide="alert-triangle" className="w-4 h-4 shrink-0"></i>
                                <div>
                                  <strong className="text-[11px] font-extrabold block">DÉBITO VENCIDO / RESTRIÇÃO</strong>
                                  <span className="text-[10px] text-rose-600">
                                    {formatBRL(clienteSelecionado.debitoValor)} vencido há {clienteSelecionado.debitoDias} dias ({clienteSelecionado.debitoDoc})
                                  </span>
                                </div>
                              </div>
                              <span className="text-[9px] font-bold bg-rose-700 text-white px-2 py-0.5 rounded">
                                1 título em atraso
                              </span>
                            </div>

                            {clienteSelecionado.vencimentoMes && (
                              <div className="text-[10px] text-slate-600 border-t border-rose-200/60 pt-1.5 flex justify-between">
                                <span>Vencimento no mês vigente:</span>
                                <strong>{formatBRL(clienteSelecionado.vencimentoMes)} em {clienteSelecionado.vencimentoMesData}</strong>
                              </div>
                            )}

                            {/* CHECKBOX DE AUTORIZAÇÃO EXCEPCIONAL */}
                            <div className="border-t border-rose-200/80 pt-2 flex items-center justify-between">
                              <label className="flex items-center gap-2 cursor-pointer">
                                <input 
                                  type="checkbox" 
                                  checked={autorizarExcecao} 
                                  onChange={e => setAutorizarExcecao(e.target.checked)} 
                                  className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500" 
                                />
                                <span className="text-[11px] font-bold text-slate-800">
                                  Autorizar venda excepcional com aprovação gerencial
                                </span>
                              </label>
                              <span className="text-[10px] text-slate-400 font-semibold">Exige senha/token</span>
                            </div>

                            {autorizarExcecao && (
                              <div className="pt-2 flex gap-2">
                                <input 
                                  type="password" 
                                  placeholder="Digite a senha do supervisor..." 
                                  value={tokenGerente} 
                                  onChange={e => {
                                    setTokenGerente(e.target.value);
                                    if (e.target.value === '1234' || e.target.value.length >= 4) {
                                      setTokenValidado(true);
                                    } else {
                                      setTokenValidado(false);
                                    }
                                  }} 
                                  className="flex-1 p-2 border rounded-xl text-xs bg-white outline-none" 
                                />
                                <span className={`px-2.5 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-1 ${
                                  tokenValidado ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'
                                }`}>
                                  {tokenValidado ? '✓ Validado' : 'Aguardando'}
                                </span>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    )}

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Vendedor Responsável</label>
                        <select 
                          value={codVendedor} 
                          onChange={e => setCodVendedor(e.target.value)} 
                          className="w-full p-2.5 border rounded-xl bg-slate-50 font-semibold outline-none focus:ring-2 focus:ring-indigo-600/30"
                        >
                          {vendedoresCadastrados.map(v => (
                            <option key={v.code} value={v.code}>{v.name} ({v.code})</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Tipo de Venda</label>
                        <select 
                          value={tipoVenda} 
                          onChange={e => setTipoVenda(e.target.value)} 
                          className="w-full p-2.5 border rounded-xl bg-slate-50 font-bold outline-none focus:ring-2 focus:ring-indigo-600/30"
                        >
                          <option value="TOTAL">TOTAL (Prótese Total)</option>
                          <option value="PARCIAL">PARCIAL (Prótese Parcial)</option>
                          <option value="DENTISTAS">DENTISTAS (Clínico)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Valor Venda (R$)</label>
                        <input 
                          type="text" 
                          placeholder="R$ 1.850,00" 
                          value={valorVenda} 
                          onChange={e => setValorVenda(e.target.value)} 
                          className="w-full p-2.5 border rounded-xl bg-slate-50 font-black text-slate-900 outline-none focus:ring-2 focus:ring-indigo-600/30" 
                          required 
                        />
                      </div>

                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Condição / Prazo</label>
                        <select 
                          value={condicaoPrazo} 
                          onChange={e => setCondicaoPrazo(e.target.value)} 
                          className="w-full p-2.5 border rounded-xl bg-slate-50 font-semibold outline-none focus:ring-2 focus:ring-indigo-600/30" 
                        >
                          <option value="A_VISTA">À Vista</option>
                          <option value="15_DIAS">15 dias</option>
                          <option value="30_DIAS">30 dias</option>
                          <option value="45_DIAS">45 dias</option>
                          <option value="60_DIAS">60 dias</option>
                        </select>
                      </div>

                      <div>
                        <label className="font-bold text-slate-700 block mb-1">Nº Parcelas</label>
                        <select 
                          value={numParcelas} 
                          onChange={e => setNumParcelas(parseInt(e.target.value))} 
                          className="w-full p-2.5 border rounded-xl bg-slate-50 font-bold outline-none focus:ring-2 focus:ring-indigo-600/30"
                        >
                          <option value="1">1x (À vista / Parcela única)</option>
                          <option value="2">2x</option>
                          <option value="3">3x</option>
                          <option value="4">4x</option>
                          <option value="5">5x</option>
                          <option value="6">6x</option>
                          <option value="7">7x</option>
                          <option value="8">8x</option>
                          <option value="9">9x</option>
                          <option value="10">10x</option>
                          <option value="11">11x</option>
                          <option value="12">12x (Parcelado em até 12x)</option>
                        </select>
                      </div>
                    </div>

                    {/* PRÉVIA DOS VENCIMENTOS GERADOS */}
                    {previewParcelas.length > 0 && (
                      <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="text-[10px] font-bold text-slate-600 flex items-center gap-1.5">
                            <i data-lucide="calendar" className="w-3.5 h-3.5 text-indigo-600"></i>
                            Prévia de Vencimentos ({previewParcelas.length}x)
                          </span>
                          <span className="text-[10px] font-bold text-indigo-700">
                            {formatBRL(parseFloat(valorVenda.replace(',', '.')) || 0)}
                          </span>
                        </div>

                        <div className="grid grid-cols-2 gap-2 max-h-36 overflow-y-auto custom-scrollbar pr-1">
                          {previewParcelas.map(p => (
                            <div key={p.number} className="p-2 rounded-xl bg-white border border-slate-200 flex justify-between items-center text-[10px]">
                              <div>
                                <span className="font-bold text-slate-700 block">Parcela {p.number}</span>
                                <span className="text-slate-400">{p.dueDate}</span>
                              </div>
                              <span className="font-extrabold text-slate-900">{formatBRL(p.amount)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <button 
                      type="submit" 
                      className="w-full py-3 rounded-2xl bg-indigo-700 hover:bg-indigo-800 text-white font-extrabold text-xs shadow-md shadow-indigo-700/20 transition flex items-center justify-center gap-2"
                    >
                      <i data-lucide="check-circle" className="w-4 h-4"></i>
                      <span>Registrar Venda</span>
                    </button>

                  </form>
                </div>

                {/* LIVRO DE VENDAS DO MÊS */}
                <div className="lg:col-span-7 bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden space-y-0">
                  
                  <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-50/50">
                    <div>
                      <h4 className="text-sm font-extrabold text-slate-900">Vendas do Mês</h4>
                      <p className="text-[11px] text-slate-500">Livro de lançamentos e controle de parcelas</p>
                    </div>

                    <div className="relative w-full sm:w-64">
                      <input 
                        type="text" 
                        placeholder="Buscar por DAV, cliente ou vendedor..." 
                        value={filtroTexto} 
                        onChange={e => setFiltroTexto(e.target.value)} 
                        className="w-full pl-8 pr-3 py-1.5 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-indigo-600/30" 
                      />
                      <i data-lucide="search" className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5"></i>
                    </div>
                  </div>

                  {loading ? (
                    <div className="p-12 text-center text-xs text-slate-400 flex items-center justify-center gap-2">
                      <i data-lucide="loader-2" className="w-4 h-4 animate-spin text-indigo-600"></i>
                      <span>Carregando dados do Firestore...</span>
                    </div>
                  ) : vendasFiltradas.length === 0 ? (
                    <div className="p-12 text-center text-xs text-slate-400">
                      Nenhuma venda registrada até o momento no banco de dados.
                    </div>
                  ) : (
                    <div className="divide-y divide-slate-100 max-h-[560px] overflow-y-auto custom-scrollbar">
                      {vendasFiltradas.map(venda => (
                        <div key={venda.id || venda.dav} className="p-4 flex items-center justify-between hover:bg-slate-50 transition">
                          <div className="flex items-center gap-3 min-w-0">
                            <div className="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-700 font-mono font-bold text-xs flex items-center justify-center shrink-0 border border-indigo-100">
                              #{venda.dav}
                            </div>
                            <div className="min-w-0">
                              <div className="flex items-center gap-2">
                                <h5 className="text-xs font-black text-slate-900 truncate">{venda.client}</h5>
                                <span className={`text-[9px] font-extrabold px-1.5 py-0.5 rounded ${
                                  venda.tipoVenda === 'TOTAL' ? 'bg-indigo-100 text-indigo-800' :
                                  venda.tipoVenda === 'PARCIAL' ? 'bg-purple-100 text-purple-800' : 'bg-emerald-100 text-emerald-800'
                                }`}>
                                  {venda.tipoVenda || 'TOTAL'}
                                </span>
                              </div>
                              <p className="text-[10px] text-slate-400 mt-0.5 truncate">
                                {venda.dateDisplay || venda.date} • Vend: <strong>{venda.salesperson}</strong> • {venda.parcelas || 1}x
                              </p>
                            </div>
                          </div>

                          <div className="text-right shrink-0 ml-4 flex items-center gap-3">
                            <div>
                              <span className="text-xs font-black text-slate-900 block">{formatBRL(venda.amount)}</span>
                              <span className={`text-[10px] font-bold ${venda.isPaid ? 'text-emerald-600' : 'text-blue-600'}`}>
                                {venda.isPaid ? '● Quitado' : '● Em aberto'}
                              </span>
                            </div>

                            <a 
                              href={`vendas.html?cliente=${venda.codCliente || ''}`} 
                              title="Ver ficha na Carteira de Vendas"
                              className="p-2 rounded-xl text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition"
                            >
                              <i data-lucide="chevron-right" className="w-4 h-4"></i>
                            </a>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  <div className="p-3 bg-slate-50 border-t border-slate-100 text-center text-[11px] text-slate-500 font-semibold">
                    Mostrando {vendasFiltradas.length} lançamentos consolidados no sistema
                  </div>

                </div>

              </div>

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
