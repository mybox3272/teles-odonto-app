    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",

      measurementId: "G-9CF84R9BWM"

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.fb = { collection, doc, setDoc, addDoc, updateDoc, onSnapshot, query, orderBy };

      console.log("🔥 Firebase conectado em index.html com validação de débitos!");

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Componente Vetorial do Ícone Gráfico do Dente Oficial Teles Odonto

        <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" />
      </svg>
    );

    const initialClientsSeed = [
      { 
        cod: "2", 
        name: "JOÃO PESSOA MEDEIROS COSTA", 
        categoria: "Prótese Fixa", 
        logradouro: "Rua", 
        endereco: "Monsenhor Tabosa", 
        numero: "450",

        ddd: "85", 
        telefone: "99122-3344",

        vendor: "André Luiz Nóbrega Martins"
      },
      { 
        cod: "4", 
        name: "LEONARDO AMORIM DE FRANCA E SOUSA", 
        categoria: "Prótese Total e Parcial", 
        logradouro: "Av.", 
        endereco: "Santos Dumont", 
        numero: "1200", 
        bairro: "Aldeota", 
        cidade: "Fortaleza", 
        uf: "CE", 
        ddd: "85", 
        telefone: "98844-1234", 
        area: "Fortaleza Metropolitana",
        vendor: "Luis Daniel da Silva"
      },
      { 
        cod: "5", 
        name: "IMPRESSIONE LABORATÓRIO DE PROTESE LTDA", 
        categoria: "Ortodontia & Fixa", 
        logradouro: "Av.", 
        endereco: "Dom Luís", 
        numero: "800", 
        bairro: "Aldeota", 
        cidade: "Fortaleza", 
        uf: "CE", 
        ddd: "85", 
        telefone: "98711-2233", 
        area: "Fortaleza Leste",
        vendor: "André Luiz Nóbrega Martins"
      },
      { 
        cod: "7", 
        name: "DAVI DA CUNHA GONCALVES", 
        categoria: "Implantodontia", 
        logradouro: "Rua", 
        endereco: "Barão de Studart", 
        numero: "1550", 
        bairro: "Dionísio Torres", 
        cidade: "Fortaleza", 
        uf: "CE", 
        ddd: "85", 
        telefone: "99655-4433", 
        area: "Fortaleza Sul",
        vendor: "André Luiz Nóbrega Martins"
      },
      { 
        cod: "104", 
        name: "Clínica OdontoPrime Dr. Valter", 
        categoria: "Reabilitação & Implante", 
        logradouro: "Av.", 
        endereco: "Washington Soares", 
        numero: "3000", 
        bairro: "Edson Queiroz", 
        cidade: "Fortaleza", 
        uf: "CE", 
        ddd: "85", 
        telefone: "99233-8899", 
        area: "Fortaleza Sul",
        vendor: "André Luiz Nóbrega Martins"
      }
    ];

    const sellersList = [
      { cod: "1", codeVnd: "VND-01", name: "André Luiz Nóbrega Martins", rate: "3.5%" },
      { cod: "2", codeVnd: "VND-02", name: "Luis Daniel da Silva", rate: "3.0%" }
    ];

    function App() {
      // Estado de Clientes com persistência e sincronia Firebase
      const [clients, setClients] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_clients');
          return saved ? JSON.parse(saved) : initialClientsSeed;
        } catch {
          return initialClientsSeed;
        }
      });

      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);

      // Campos da Nova Venda
      const [dataVenda, setDataVenda] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });
      const [davNumber, setDavNumber] = useState('');
      const [codClienteInput, setCodClienteInput] = useState('104');
      const [nomeCliente, setNomeCliente] = useState('Clínica OdontoPrime Dr. Valter');
      const [vendedor, setVendedor] = useState(sellersList[0].name);
      const [valorVenda, setValorVenda] = useState('1850.00');
      const [tipoVenda, setTipoVenda] = useState('TOTAL');
      const [condicaoPrazo, setCondicaoPrazo] = useState('2x');
      const [statusMsg, setStatusMsg] = useState('');
      const [salvandoVenda, setSalvandoVenda] = useState(false);

      // Controle de Autorização Gerencial para Débitos Vencidos
      const [autorizacaoGerencia, setAutorizacaoGerencia] = useState(false);
      const [justificativaLiberacao, setJustificativaLiberacao] = useState('');

      // Modal de Novo Cliente Rápido caso o código não exista
      const [showModalNovoCliente, setShowModalNovoCliente] = useState(false);
      const [novoClienteForm, setNovoClienteForm] = useState({
        cod: '', name: '', categoria: '', logradouro: 'Av.', endereco: '', numero: '', bairro: '', cidade: 'Fortaleza', uf: 'CE', ddd: '85', telefone: '', area: '', vendor: 'André Luiz Nóbrega Martins'
      });

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Gerador automático de DAV sugerido
      useEffect(() => {
        if (!davNumber) {
          const randomDav = Math.floor(48900 + Math.random() * 100);
          setDavNumber(String(randomDav));
        }
      }, [davNumber]);

      // Listener Firebase Firestore para Vendas e Clientes
      useEffect(() => {
        const startListeners = () => {
          if (!window.db || !window.fb) return;

          try {
            // 1. Vendas
            const vendasCol = window.fb.collection(window.db, "vendas");
            const qVendas = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));
            const unsubVendas = window.fb.onSnapshot(qVendas, (snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setSales(list);
              setLoading(false);
            }, () => setLoading(false));

            // 2. Clientes (coleção compartilhada)
            const clientesCol = window.fb.collection(window.db, "clientes");
            const unsubClientes = window.fb.onSnapshot(clientesCol, (snapshot) => {
              if (!snapshot.empty) {
                const firestoreClients = snapshot.docs.map(doc => ({ cod: doc.id, ...doc.data() }));
                setClients(prev => {
                  const map = {};
                  prev.forEach(c => map[String(c.cod)] = c);
                  firestoreClients.forEach(c => map[String(c.cod)] = { ...map[String(c.cod)], ...c });
                  const merged = Object.values(map);
                  localStorage.setItem('neves_crm_clients', JSON.stringify(merged));
                  return merged;
                });
              }
            });

            return () => { unsubVendas(); unsubClientes(); };
          } catch (e) {
            console.error("Erro listeners:", e);
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListeners();
        } else {
          window.addEventListener("firebase-ready", startListeners);
          return () => window.removeEventListener("firebase-ready", startListeners);
        }
      }, []);

      // Cliente Ativo Encontrado pela busca do Código
      const clienteAtivo = useMemo(() => {
        if (!codClienteInput) return null;
        return clients.find(c => String(c.cod).trim() === String(codClienteInput).trim()) || null;
      }, [clients, codClienteInput]);

      // Atualiza Nome do Cliente e Vendedor ao encontrar o código
      useEffect(() => {
        if (clienteAtivo) {
          setNomeCliente(clienteAtivo.name);
          if (clienteAtivo.vendor) {
            const vMatch = sellersList.find(s => s.name.includes(clienteAtivo.vendor) || clienteAtivo.vendor.includes(s.name));
            if (vMatch) setVendedor(vMatch.name);
          }
          // Reseta a autorização ao trocar de cliente
          setAutorizacaoGerencia(false);
          setJustificativaLiberacao('');
        }
      }, [clienteAtivo]);

      // =========================================================================
      // VALIDAÇÃO EM TEMPO REAL: VERIFICA SE O CLIENTE POSSUI DÉBITOS VENCIDOS
      // =========================================================================
      const analiseDebitos = useMemo(() => {
        if (!clienteAtivo) {
          return { temDebitoVencido: false, totalVencido: 0, titulosVencidos: 0, maxDiasAtraso: 0, listaVencidos: [] };
        }

        const hoje = new Date().toISOString().split('T')[0];
        let totalVencido = 0;
        let titulosVencidos = 0;
        let maxDiasAtraso = 0;
        const listaVencidos = [];

        sales.filter(s => String(s.codCliente) === String(clienteAtivo.cod)).forEach(sale => {
          (sale.installments || []).forEach(inst => {
            if (inst.status !== 'Pago' && inst.dueDate && inst.dueDate < hoje) {
              const amt = Number(inst.amount) || 0;
              totalVencido += amt;
              titulosVencidos++;
              const diffTime = Math.abs(new Date(hoje) - new Date(inst.dueDate));
              const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
              if (diffDays > maxDiasAtraso) maxDiasAtraso = diffDays;

              listaVencidos.push({
                dav: sale.dav,
                installmentNumber: inst.number,
                amount: amt,
                dueDate: inst.dueDate,
                diffDays
              });
            }
          });
        });

        return {
          temDebitoVencido: titulosVencidos > 0,
          totalVencido,
          titulosVencidos,
          maxDiasAtraso,
          listaVencidos
        };
      }, [clienteAtivo, sales]);

      // Cálculo das Parcelas Automáticas
      const parcelasCalculadas = useMemo(() => {
        const total = parseFloat(valorVenda.replace(',', '.')) || 0;
        if (total <= 0) return [];

        const addDays = (dateStr, days) => {
          const d = new Date(dateStr + "T12:00:00");
          d.setDate(d.getDate() + days);
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        if (condicaoPrazo === '0') {
          return [{ number: 1, amount: total, dueDate: dataVenda, status: 'Em aberto' }];
        } else if (condicaoPrazo === '1x') {
          return [{ number: 1, amount: total, dueDate: addDays(dataVenda, 30), status: 'Em aberto' }];
        } else if (condicaoPrazo === '2x') {
          const part = parseFloat((total / 2).toFixed(2));
          return [
            { number: 1, amount: part, dueDate: addDays(dataVenda, 30), status: 'Em aberto' },
            { number: 2, amount: total - part, dueDate: addDays(dataVenda, 60), status: 'Em aberto' }
          ];
        } else if (condicaoPrazo === '3x') {
          const part = parseFloat((total / 3).toFixed(2));
          return [
            { number: 1, amount: part, dueDate: addDays(dataVenda, 30), status: 'Em aberto' },
            { number: 2, amount: part, dueDate: addDays(dataVenda, 60), status: 'Em aberto' },
            { number: 3, amount: total - (part * 2), dueDate: addDays(dataVenda, 90), status: 'Em aberto' }
          ];
        } else {
          const part = parseFloat((total / 4).toFixed(2));
          return [
            { number: 1, amount: part, dueDate: addDays(dataVenda, 30), status: 'Em aberto' },
            { number: 2, amount: part, dueDate: addDays(dataVenda, 60), status: 'Em aberto' },
            { number: 3, amount: part, dueDate: addDays(dataVenda, 90), status: 'Em aberto' },
            { number: 4, amount: total - (part * 3), dueDate: addDays(dataVenda, 120), status: 'Em aberto' }
          ];
        }
      }, [valorVenda, condicaoPrazo, dataVenda]);

      // KPIs do Dashboard Inicial
      const dashboardKPIs = useMemo(() => {
        let recMes = 0;
        let aReceberMes = 0;
        let totalPedidos = sales.length;
        const clientesSet = new Set();

        sales.forEach(s => {
          if (s.codCliente) clientesSet.add(s.codCliente);
          (s.installments || []).forEach(inst => {
            const amt = Number(inst.amount) || 0;
            if (inst.status === 'Pago') recMes += amt;
            else aReceberMes += amt;
          });
        });

        const ticketMedio = totalPedidos > 0 ? (recMes + aReceberMes) / totalPedidos : 0;
        return { recMes, aReceberMes, totalPedidos, ticketMedio, clientesAtivos: clientesSet.size };
      }, [sales]);

      // Gravação do DAV no Firebase com validação de Débitos
      const handleRegistrarVenda = async (e) => {
        e.preventDefault();

        // 1. Bloqueio por inadimplência
        if (analiseDebitos.temDebitoVencido && !autorizacaoGerencia) {
          alert(`⛔ BLOQUEIO DE CRÉDITO:\n\nO cliente #${clienteAtivo.cod} possui R$ ${analiseDebitos.totalVencido.toFixed(2)} em parcelas vencidas (${analiseDebitos.titulosVencidos} título(s) em atraso há ${analiseDebitos.maxDiasAtraso} dias).\n\nPara prosseguir, marque a opção de autorização gerencial excepcional no formulário.`);
          return;
        }

        const valorNum = parseFloat(valorVenda.replace(',', '.'));
        if (!valorNum || valorNum <= 0) {
          alert("Informe um valor válido de venda.");
          return;
        }

        setSalvandoVenda(true);
        setStatusMsg('Gravando venda no Firebase Firestore...');

        const novaVendaDoc = {
          dav: davNumber || String(Math.floor(48000 + Math.random() * 2000)),
          date: dataVenda,
          codCliente: codClienteInput || '0',
          client: nomeCliente || 'Cliente Balcão',
          salesperson: vendedor,
          amount: valorNum,
          tipoVenda: tipoVenda,
          prazo: condicaoPrazo,
          installments: parcelasCalculadas,
          isPaid: false,
          liberacaoExcepcional: analiseDebitos.temDebitoVencido ? {
            autorizadoPorGerencia: true,
            justificativa: justificativaLiberacao || 'Aprovado pelo operador comercial',
            debitoExistenteNaData: analiseDebitos.totalVencido
          } : null,
          criadoEm: new Date().toISOString()
        };

        try {
          if (window.db && window.fb) {
            await window.fb.addDoc(window.fb.collection(window.db, "vendas"), novaVendaDoc);
          } else {
            setSales(prev => [novaVendaDoc, ...prev]);
          }

          setStatusMsg(`✅ Venda DAV #${novaVendaDoc.dav} gravada com sucesso!`);
          setDavNumber(String(Math.floor(48900 + Math.random() * 100)));
          setValorVenda('');
          setAutorizacaoGerencia(false);
          setJustificativaLiberacao('');
          setTimeout(() => setStatusMsg(''), 5000);
        } catch (err) {
          console.error("Erro ao salvar:", err);
          setStatusMsg(`❌ Erro ao gravar: ${err.message}`);
        } finally {
          setSalvandoVenda(false);
        }
      };

      // Salvar Novo Cliente Rápido caso o código seja inédito
      const handleSalvarNovoClienteRapido = async (e) => {
        e.preventDefault();
        if (!novoClienteForm.cod || !novoClienteForm.name) {
          alert("Código e Nome são obrigatórios!");
          return;
        }

        const cData = {
          ...novoClienteForm,
          cod: String(novoClienteForm.cod)
        };

        setClients(prev => [...prev.filter(c => String(c.cod) !== cData.cod), cData]);
        setCodClienteInput(cData.cod);
        setNomeCliente(cData.name);

        if (window.db && window.fb) {
          try {
            await window.fb.setDoc(window.fb.doc(window.db, "clientes", cData.cod), cData, { merge: true });
          } catch (err) {
            console.error("Erro ao gravar cliente:", err);
          }
        }

        setShowModalNovoCliente(false);
        alert(`✅ Cliente #${cData.cod} cadastrado com sucesso!`);
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* MENU LATERAL ESCURO (SIDEBAR #1a202c / bg-slate-900) */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-slate-300 flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden">
            
            {/* MARCA D'ÁGUA INFERIOR */}
            <div className="absolute -bottom-12 -right-12 pointer-events-none text-white opacity-[0.06] w-72 h-72">
              <ToothWatermark className="w-full h-full text-white" />
            </div>

            <div className="relative z-10">
              {/* TOPO: LOGO OFICIAL TELES ODONTO + NEVES PRO CRM */}
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-sm shadow-md ring-2 ring-indigo-400/20">
                    TO
                  </div>
                  <div>
                    <h1 className="text-white font-extrabold text-sm tracking-tight leading-tight">Teles Odonto</h1>
                    <p className="text-[10px] text-indigo-400 font-bold tracking-wider uppercase">Materiais Protéticos</p>
                    <span className="inline-block mt-0.5 text-[9px] bg-slate-800 text-slate-300 px-1.5 py-0.2 rounded font-semibold border border-slate-700">
                      Neves Pro CRM
                    </span>
                  </div>
                </div>
              </div>

              {/* NAVEGAÇÃO COMERCIAL */}
              <div className="px-4 py-5">
                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2.5">
                  NAVEGAÇÃO COMERCIAL
                </p>
                <nav className="space-y-1.5">
                  <a 
                    href="index.html" 
                    className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold bg-indigo-700 text-white shadow-md transition"
                  >
                    <i data-lucide="layout-grid" className="w-4 h-4"></i>
                    <span>Página Inicial</span>
                  </a>
                  <a 
                    href="vendas.html" 
                    className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition"
                  >
                    <i data-lucide="shopping-cart" className="w-4 h-4"></i>
                    <span>Página de Vendas</span>
                  </a>
                  <a 
                    href="comissoes.html" 
                    className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition"
                  >
                    <i data-lucide="briefcase" className="w-4 h-4"></i>
                    <span>Comissões</span>
                  </a>
                </nav>
              </div>
            </div>

            {/* CARD DE OPERADOR */}
            <div className="p-4 border-t border-slate-800 relative z-10 space-y-3">
              <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex items-center gap-3 shadow-inner">
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center text-xs font-bold shrink-0">
                  <i data-lucide="user" className="w-4 h-4"></i>
                </div>
                <div className="truncate">
                  <p className="text-xs font-bold text-slate-200 leading-tight">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400 truncate">operador@nevespro.com</p>
                </div>
              </div>

              <div className="text-[9px] text-slate-500 text-center leading-tight">
                <p>Neves Pro CRM, Todos os Direitos Reservado</p>
                <p className="text-indigo-400 font-semibold mt-0.5">Por Daniel Silva</p>
              </div>
            </div>
          </aside>

          {/* MAIN CONTAINER */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            
            {/* TOPBAR */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Neves Pro CRM</span>
                <span className="text-slate-400">&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  Painel Inicial & Lançamento de DAV
                </span>
              </div>

              <div className="flex items-center gap-3">
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">

                      type="text" 
                      placeholder="Ex: Laboratório Dental Central" 
                      value={novoClienteForm.name} 
                      onChange={e => setNovoClienteForm({ ...novoClienteForm, name: e.target.value })} 
                      className="w-full p-2.5 border rounded-xl bg-slate-50 font-bold outline-none" 
                      required 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Categoria</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Prótese Fixa" 
                        value={novoClienteForm.categoria} 
                        onChange={e => setNovoClienteForm({ ...novoClienteForm, categoria: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Área Comercial</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Fortaleza Centro" 
                        value={novoClienteForm.area} 
                        onChange={e => setNovoClienteForm({ ...novoClienteForm, area: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">DDD</label>
                      <input 
                        type="text" 
                        placeholder="85" 
                        value={novoClienteForm.ddd} 
                        onChange={e => setNovoClienteForm({ ...novoClienteForm, ddd: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none text-center font-bold" 
                      />
                    </div>
                    <div className="col-span-2">
                      <label className="font-semibold text-slate-600 block mb-1">Telefone / WhatsApp</label>
                      <input 
                        type="text" 
                        placeholder="98800-1122" 
                        value={novoClienteForm.telefone} 
                        onChange={e => setNovoClienteForm({ ...novoClienteForm, telefone: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button 
                      type="button" 
                      onClick={() => setShowModalNovoCliente(false)} 
                      className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-indigo-700 hover:bg-indigo-800 shadow"
                    >
                      Salvar e Selecionar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
