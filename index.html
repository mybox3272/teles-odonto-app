        async function initFirebase() {
          try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");

            db = getFirestore(app);
            setDbStatus('FIREBASE CONECTADO');

              if (!snapshot.empty) {
                const fbSales = [];
                snapshot.forEach(docSnap => {
                  const d = docSnap.data();
                  fbSales.push({
                    id: docSnap.id,
                    codCliente: d.codCliente || '4',
                    client: d.cliente || d.client || 'Cliente Teles Odonto',
                    codVendedor: d.codVendedor || '1',
                    salesperson: d.vendedor || d.salesperson || 'André Luiz Nóbrega Martins',
                    amount: parseFloat(d.valor || d.amount || 0),
                    date: d.dataVenda || d.date || '2026-11-12',
                    dav: d.dav || '000',
                    parcelas: parseInt(d.parcelas || 1, 10),
                    prazo: d.prazo === 0 || d.prazo === '0' ? 0 : d.prazo || 0,

                        number: 1, 
                        amount: parseFloat(d.valor || d.amount || 0),

                  });
                });
                setSales(fbSales);
              }

            setDbStatus('MODO LOCAL (OFFLINE)');

        initFirebase();

        const y = currentTime.getFullYear();
        const m = String(currentTime.getMonth() + 1).padStart(2, '0');
        const d = String(currentTime.getDate()).padStart(2, '0');

        return sales.filter(s => s.date && s.date.startsWith(commissionMonth));

        let revenue = 0;
        let paid = 0;
        let receivable = 0;
        sales.forEach(sale => {
          revenue += sale.amount;
          sale.installments.forEach(inst => {
            if (inst.status === 'Pago') paid += inst.amount;
            else receivable += inst.amount;
          });
        });
        const paidPct = revenue > 0 ? (paid / revenue) * 100 : 0;
        const recPct = revenue > 0 ? (receivable / revenue) * 100 : 0;
        return { revenue, paid, receivable, paidPct, recPct };
      }, [sales]);

      // Análise financeira e títulos por cliente
      const clientData = useMemo(() => {
        const data = {};
        sales.forEach(sale => {
          if (!data[sale.codCliente]) {
            data[sale.codCliente] = {
              totalSpent: 0,
              paidAmount: 0,
              overdueAmount: 0,
              overdueCount: 0,
              upcomingAmount: 0,
              upcomingCount: 0,
              dueTodayAmount: 0,
              dueTodayCount: 0,
              dueMonthAmount: 0,
              dueMonthCount: 0,
              history: []
            };
          }
          const c = data[sale.codCliente];
          c.totalSpent += sale.amount;
          c.history.push(sale);
          sale.installments.forEach(inst => {
            if (inst.status === 'Pago') {
              c.paidAmount += inst.amount;
            } else {
              if (inst.dueDate < todayStr) {
                c.overdueAmount += inst.amount;
                c.overdueCount += 1;
              } else {
                c.upcomingAmount += inst.amount;
                c.upcomingCount += 1;
              }
              if (inst.dueDate === todayStr) {
                c.dueTodayAmount += inst.amount;
                c.dueTodayCount += 1;
              }
              if (inst.dueDate && inst.dueDate.startsWith(commissionMonth)) {
                c.dueMonthAmount += inst.amount;
                c.dueMonthCount += 1;
              }
            }
          });
        });
        return data;

            totalPaidMonth: 0, // Baixas reais onde a comissão incide

            salesParcial: 0,
            salesDentistas: 0,
            count: 0
          };
        });

        sales.forEach(sale => {
          const sCod = sale.codVendedor || '1';
          if (!data[sCod]) {
            data[sCod] = { name: sale.salesperson, totalSoldMonth: 0, totalPaidMonth: 0, salesTotal: 0, salesParcial: 0, salesDentistas: 0, count: 0 };
          }

          if (sale.date && sale.date.startsWith(commissionMonth)) {
            data[sCod].totalSoldMonth += sale.amount;
          }

          // A comissão é apurada estritamente sobre as parcelas BAIXADAS no mês
          sale.installments.forEach(inst => {
            if (inst.status === 'Pago' && inst.paymentDate && inst.paymentDate.startsWith(commissionMonth)) {
              data[sCod].totalPaidMonth += inst.amount;
              data[sCod].count += 1;

              if (sale.tipoVenda === 'TOTAL') data[sCod].salesTotal += inst.amount;
              else if (sale.tipoVenda === 'PARCIAL') data[sCod].salesParcial += inst.amount;
              else if (sale.tipoVenda === 'DENTISTAS') data[sCod].salesDentistas += inst.amount;
            }
          });
        });

        return data;
      }, [sales, sellers, commissionMonth]);

      // Regras por Faixa de Metas
      const calculateCommission = (sellerCod, stats) => {
        const seller = sellers.find(s => s.cod === sellerCod) || sellers[0];
        const volume = stats.totalPaidMonth || 0;

        let rate = seller.rateRegular;
        let faixa = 'Regular (Até R$ 16k)';

        if (volume >= 32000) {
          rate = seller.rateOtimo;
          faixa = 'Ótimo (Meta Batida 32k+)';
        } else if (volume >= 21000) {
          rate = seller.rateBom;
          faixa = 'Bom (Faixa 21k - 32k)';
        }

        const commTotal = stats.salesTotal * (rate / 100);
        const commParcial = seller.enableParcial ? stats.salesParcial * (seller.rateParcial / 100) : 0;
        const commDentistas = seller.enableDentistas ? stats.salesDentistas * (seller.rateDentistas / 100) : 0;
        const total = commTotal + commParcial + commDentistas;

        return { rate, faixa, commTotal, commParcial, commDentistas, total };
      };

        if (!formData.amount || !formData.dav) return;

        const isAvista = formData.prazo === '0';
        const numParc = isAvista ? 1 : Math.max(1, parseInt(formData.parcelas, 10));
        const instVal = val / numParc;

        const generatedInst = [];
        for (let i = 0; i < numParc; i++) {
          generatedInst.push({
            id: `inst-${Date.now()}-${i}`,
            number: i + 1,
            amount: instVal,
            dueDate: formData.date,
            status: isAvista ? 'Pago' : 'Em aberto',
            paymentDate: isAvista ? formData.date : null
          });
        }

        const newSaleObj = {
          dav: formData.dav,
          cliente: formData.client || 'Cliente Teles Odonto',
          codCliente: formData.codCliente || '4',
          vendedor: formData.salesperson,
          codVendedor: formData.codVendedor,
          valor: val,
          dataVenda: formData.date,
          tipoVenda: formData.tipoVenda,
          parcelas: numParc,
          prazo: formData.prazo,
          installments: generatedInst
        };

        // Salva no Firestore se disponível
        if (db) {
          try {
            const { collection, addDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
            await addDoc(collection(db, "vendas"), { ...newSaleObj, dataCriacao: serverTimestamp() });
          } catch (err) {
            console.warn("Salvando em contingência local:", err);
          }
        }

        setSales(prev => [{ ...newSaleObj, id: `local-${Date.now()}` }, ...prev]);
        alert("✅ Venda registrada com sucesso e integrada às regras de comissões!");

        setFormData(prev => ({ ...prev, dav: '', amount: '' }));
      };

      // Baixa / Reabertura de Parcela
      const toggleInstallment = (saleId, instId) => {
        setSales(prev => prev.map(s => {
          if (s.id !== saleId) return s;
          return {
            ...s,
            installments: s.installments.map(i => {
              if (i.id !== instId) return i;
              const isPaid = i.status === 'Pago';
              return {
                ...i,
                status: isPaid ? 'Em aberto' : 'Pago',
                paymentDate: isPaid ? null : `${commissionMonth}-12`
              };
            })
          };
        }));
      };

      // Amortização em Cascata (FIFO)
      const handleCascadePayment = (e, clientCod) => {
        e.preventDefault();
        const valToAbate = parseFloat(cascadeAmount);
        if (!valToAbate || valToAbate <= 0) return;

        let remaining = valToAbate;
        setSales(prev => prev.map(sale => {
          if (sale.codCliente !== clientCod) return sale;

          const updatedInst = sale.installments.map(inst => {
            if (inst.status === 'Pago' || remaining <= 0) return inst;
            const take = Math.min(remaining, inst.amount);
            remaining -= take;

            if (take >= inst.amount - 0.01) {
              return { ...inst, status: 'Pago', paymentDate: cascadeDate };
            }
            return inst;
          });

          return { ...sale, installments: updatedInst };
        }));

        setCascadeSuccessMsg(`Abatimento de R$ ${valToAbate.toFixed(2)} liquidado via FIFO! Comissões recalculadas.`);

                    /* Extrato Individual do Vendedor */
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                      <div className="flex justify-between items-center border-b pb-4">
                        <div>
                          <button onClick={() => setSelectedSellerDetail(null)} className="text-indigo-600 font-semibold text-xs mb-1">
                            ← Voltar para apuração geral
                          </button>
                          <h2 className="text-xl font-extrabold text-slate-900">Extrato de Comissões - {sellers.find(s => s.cod === selectedSellerDetail)?.name}</h2>
                          <p className="text-xs text-slate-400">Mês de Referência: {commissionMonth}</p>
                        </div>
                        <button onClick={() => window.print()} className="bg-slate-900 text-white font-bold text-xs px-4 py-2 rounded-xl">
                          Imprimir / PDF
                        </button>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-[10px]">
                            <tr>
                              <th className="py-3 px-3">Data Baixa</th>
                              <th className="py-3 px-3">DAV</th>
                              <th className="py-3 px-3">Cliente</th>
                              <th className="py-3 px-3">Tipo Venda</th>
                              <th className="py-3 px-3 text-right">Valor Baixado</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {sales.filter(s => s.codVendedor === selectedSellerDetail).map(sale => (
                              sale.installments.filter(i => i.status === 'Pago' && i.paymentDate && i.paymentDate.startsWith(commissionMonth)).map(inst => (
                                <tr key={inst.id} className="hover:bg-slate-50">
                                  <td className="py-2.5 px-3 font-semibold text-slate-600">{inst.paymentDate}</td>
                                  <td className="py-2.5 px-3 font-bold text-indigo-600">DAV #{sale.dav}</td>
                                  <td className="py-2.5 px-3 font-medium text-slate-800">{sale.client}</td>
                                  <td className="py-2.5 px-3"><span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100">{sale.tipoVenda}</span></td>
                                  <td className="py-2.5 px-3 text-right font-extrabold text-slate-900">R$ {inst.amount.toFixed(2)}</td>
                                </tr>
                              ))
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ) : (
                    /* Painel Geral de Comissões e Regras */
                    <div className="space-y-6">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                          <h2 className="text-xl font-bold text-slate-900">Apuração de Comissões e Metas por Vendedor</h2>
                          <p className="text-xs text-slate-500">Cálculo dinâmico baseado no escalonamento de metas atingidas no mês {commissionMonth}</p>
                        </div>
                        <input 
                          type="month" 
                          value={commissionMonth} 
                          onChange={e => setCommissionMonth(e.target.value)}
                          className="bg-indigo-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl border-none outline-none cursor-pointer"
                        />
                      </div>

                      {/* Cards com as Regras de Negócio e Metas de Cada Vendedor */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {sellers.map(seller => {
                          const stats = salespersonData[seller.cod] || { totalSoldMonth: 0, totalPaidMonth: 0, salesTotal: 0, salesParcial: 0, salesDentistas: 0 };
                          const comm = calculateCommission(seller.cod, stats);

                          return (
                            <div key={seller.cod} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                              <div className="flex justify-between items-start">
                                <div>
                                  <span className="text-[10px] font-bold uppercase tracking-wider bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md">Vendedor #{seller.cod}</span>
                                  <h3 className="text-base font-bold text-slate-900 mt-1">{seller.name}</h3>
                                  <p className="text-xs text-slate-400">Faixa Vigente: <strong className="text-indigo-600">{comm.faixa}</strong> ({comm.rate}%)</p>
                                </div>
                                <div className="text-right">
                                  <span className="text-xs text-slate-400">Comissão a Pagar:</span>
                                  <p className="text-2xl font-black text-emerald-600">R$ {comm.total.toFixed(2)}</p>
                                </div>
                              </div>

                              {/* Barra de Progresso da Meta R$ 32.000 */}
                              <div className="space-y-1">
                                <div className="flex justify-between text-xs font-semibold">
                                  <span className="text-slate-500">Volume Baixado: R$ {stats.totalPaidMonth.toFixed(2)}</span>
                                  <span className="text-indigo-600 font-bold">{Math.min(100, (stats.totalPaidMonth / 32000) * 100).toFixed(0)}% da Meta</span>
                                </div>
                                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                  <div 
                                    className={`h-full transition-all duration-500 ${stats.totalPaidMonth >= 32000 ? 'bg-emerald-500' : 'bg-indigo-600'}`}
                                    style={{ width: `${Math.min(100, (stats.totalPaidMonth / 32000) * 100)}%` }}
                                  ></div>
                                </div>
                              </div>

                              {/* Resumo por Linha de Venda */}
                              <div className="grid grid-cols-3 gap-2 text-center pt-3 border-t border-slate-100 text-xs">
                                <div className="bg-slate-50 p-2 rounded-lg">
                                  <span className="text-[10px] text-slate-400 block">Vendas Brutas</span>
                                  <b className="text-slate-800">R$ {stats.totalSoldMonth.toFixed(2)}</b>
                                </div>
                                <div className="bg-indigo-50 p-2 rounded-lg">
                                  <span className="text-[10px] text-indigo-600 block">Baixa Total</span>
                                  <b className="text-indigo-800">R$ {comm.commTotal.toFixed(2)}</b>
                                </div>
                                <div className="bg-emerald-50 p-2 rounded-lg">
                                  <span className="text-[10px] text-emerald-600 block">Parcial / Extra</span>
                                  <b className="text-emerald-800">R$ {(comm.commParcial + comm.commDentistas).toFixed(2)}</b>
                                </div>
                              </div>

                              <button 
                                onClick={() => setSelectedSellerDetail(seller.cod)}
                                className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-2 rounded-xl transition"
                              >
                                Ver Extrato Individual de Baixas →
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    // RENDERIZAÇÃO DA APLICAÇÃO
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
