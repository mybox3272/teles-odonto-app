<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teles Odonto - Dashboard & Nova Venda</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",
      storageBucket: "neves-pro-crm-comissoes.firebasestorage.app",
      messagingSenderId: "747505960352",
      appId: "1:747505960352:web:5e7d2d5168a14dbfe490c5",
      measurementId: "G-9CF84R9BWM"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.fb = { collection, doc, setDoc, addDoc, onSnapshot, query, orderBy };
      window.dispatchEvent(new Event("firebase-ready"));
      console.log("🔥 Firebase Firestore conectado com sucesso em index.html!");
    } catch (err) {
      console.error("Erro ao inicializar Firebase em index.html:", err);
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const formatBRL = (val) => {
      const n = Number(val) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const initialClientsSeed = [
      { cod: "CLI-088", name: "Laboratório Dental Sorriso", categoria: "Prótese Fixa & Reabilitação", endereco: "Av. Paulista, 1000 - Cj. 42, Bela Vista - São Paulo / SP", vendor: "André Luiz N." },
      { cod: "CLI-093", name: "Implantes & Próteses Vitória", categoria: "Implantodontia", endereco: "Rua das Flores, 450 - Centro - Vitória / ES", vendor: "Luis Daniel da Silva" },
      { cod: "CLI-112", name: "Consultório Dr. Marcelo Ramos", categoria: "Dentistas", endereco: "Rua do Ouro, 120 - Savassi - Belo Horizonte / MG", vendor: "André Luiz N." }
    ];

    function App() {
      const [sales, setSales] = useState([]);
      const [clients, setClients] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_clients');
          return saved ? JSON.parse(saved) : initialClientsSeed;
        } catch {
          return initialClientsSeed;
        }
      });

      const [horaBrasilia, setHoraBrasilia] = useState('');

      // Form Nova Venda
      const [dataVenda, setDataVenda] = useState(new Date().toISOString().split('T')[0]);
      const [davNumero, setDavNumero] = useState(String(Math.floor(10000 + Math.random() * 90000)));
      const [codClienteInput, setCodClienteInput] = useState('');
      const [clienteSelecionado, setClienteSelecionado] = useState(null);
      const [vendedorResp, setVendedorResp] = useState('VND-01');
      const [valorVenda, setValorVenda] = useState('');
      const [tipoVenda, setTipoVenda] = useState('TOTAL');
      const [condicaoPrazo, setCondicaoPrazo] = useState('30');
      const [numParcelas, setNumParcelas] = useState(1);
      const [parcelasCustom, setParcelasCustom] = useState([]);

      // Validação de Débitos
      const [autorizarExcepcional, setAutorizarExcepcional] = useState(false);
      const [tokenSupervisor, setTokenSupervisor] = useState('');
      const [tokenValidado, setTokenValidado] = useState(false);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        const updateClock = () => {
          const agora = new Date();
          setHoraBrasilia(agora.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo' }));
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const startListeners = () => {
          if (!window.db || !window.fb) return;
          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const qVendas = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));
            window.fb.onSnapshot(qVendas, (snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setSales(list);
            });
          } catch (e) {
            console.error(e);
          }
        };

        if (window.db && window.fb) {
          startListeners();
        } else {
          window.addEventListener("firebase-ready", startListeners);
          return () => window.removeEventListener("firebase-ready", startListeners);
        }
      }, []);

      // Busca e seleção do cliente
      const handleBuscarCliente = (e) => {
        const val = e.target.value;
        setCodClienteInput(val);
        const achou = clients.find(c => String(c.cod).toLowerCase() === val.trim().toLowerCase() || (c.name && c.name.toLowerCase().includes(val.trim().toLowerCase())));
        setClienteSelecionado(achou || null);
        setAutorizarExcepcional(false);
        setTokenSupervisor('');
        setTokenValidado(false);
      };

      // Cálculo de Parcelas (Suporte até 12x)
      useEffect(() => {
        const valorNum = parseFloat(valorVenda.replace(',', '.')) || 0;
        if (valorNum <= 0 || !numParcelas) {
          setParcelasCustom([]);
          return;
        }

        const parcelasCount = parseInt(numParcelas, 10) || 1;
        const prazoDias = parseInt(condicaoPrazo, 10) || 30;
        const valorParcela = parseFloat((valorNum / parcelasCount).toFixed(2));
        const dtBase = dataVenda ? new Date(dataVenda + 'T00:00:00') : new Date();

        const novasParcelas = [];
        for (let i = 1; i <= parcelasCount; i++) {
          const dtVenc = new Date(dtBase);
          dtVenc.setDate(dtVenc.getDate() + (prazoDias * i));
          const dia = String(dtVenc.getDate()).padStart(2, '0');
          const mes = String(dtVenc.getMonth() + 1).padStart(2, '0');
          const ano = dtVenc.getFullYear();

          novasParcelas.push({
            number: i,
            amount: valorParcela,
            dueDate: `${dia}/${mes}/${ano}`,
            status: 'Em aberto'
          });
        }
        setParcelasCustom(novasParcelas);
      }, [valorVenda, condicaoPrazo, numParcelas, dataVenda]);

      const handleRegistrarVenda = async (e) => {
        e.preventDefault();
        const valorNum = parseFloat(valorVenda.replace(',', '.'));
        if (!valorNum || valorNum <= 0) {
          alert("Informe um valor válido de venda.");
          return;
        }

        const nomeVendedor = vendedorResp === 'VND-01' ? 'André Luiz Nóbrega Martins' : 'Luis Daniel da Silva';
        const docVenda = {
          dav: davNumero,
          codCliente: clienteSelecionado ? clienteSelecionado.cod : codClienteInput,
          client: clienteSelecionado ? clienteSelecionado.name : 'Cliente Avulso',
          salespersonCode: vendedorResp,
          salesperson: nomeVendedor,
          amount: valorNum,
          tipoVenda: tipoVenda,
          prazo: condicaoPrazo,
          parcelasQtd: numParcelas,
          date: dataVenda,
          dateDisplay: new Date(dataVenda + 'T00:00:00').toLocaleDateString('pt-BR'),
          createdAt: new Date().toISOString(),
          isPaid: false,
          installments: parcelasCustom
        };

        if (window.db && window.fb) {
          try {
            await window.fb.addDoc(window.fb.collection(window.db, "vendas"), docVenda);
            alert(`✅ Venda DAV #${davNumero} cadastrada com sucesso!`);
          } catch (err) {
            console.error(err);
            setSales(prev => [docVenda, ...prev]);
            alert(`✅ Venda DAV #${davNumero} registrada localmente.`);
          }
        } else {
          setSales(prev => [docVenda, ...prev]);
          alert(`✅ Venda DAV #${davNumero} registrada!`);
        }

        setValorVenda('');
        setDavNumero(String(Math.floor(10000 + Math.random() * 90000)));
      };

      // Indicadores
      const totalReceita = useMemo(() => sales.reduce((acc, s) => acc + (Number(s.amount) || 0), 0), [sales]);
      const totalBaixado = useMemo(() => {
        let total = 0;
        sales.forEach(s => (s.installments || []).forEach(inst => { if (inst.status === 'Pago') total += Number(inst.amount) || 0; }));
        return total;
      }, [sales]);
      const totalAReceber = Math.max(0, totalReceita - totalBaixado);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* BARRA LATERAL UNIFICADA COM LOGO OFICIAL E MARCA D'ÁGUA */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-white flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden select-none border-r border-slate-800" id="app-sidebar">
            <div className="absolute -bottom-10 -right-10 w-56 h-56 pointer-events-none opacity-[0.05] brightness-200">
              <img src="Design sem nome (28).png" alt="Marca d'água Teles Odonto" className="w-full h-full object-contain filter invert" />
            </div>

            <div className="relative z-10">
              <div className="p-6 border-b border-slate-800/80 flex flex-col gap-2">
                <div className="flex items-center gap-2">
                  <img src="Imagem RGB branco 3 - fundo transparente PNG.png" alt="Teles Odonto - Materiais Protéticos" className="h-10 w-auto object-contain" />
                </div>
                <div className="flex items-center justify-between mt-1 px-2 py-1 rounded bg-slate-800/60 border border-slate-700/50">
                  <span className="text-[11px] font-medium text-slate-300">Neves Pro CRM</span>
                  <span className="text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">v2.6 Audited</span>
                </div>
              </div>

              <div className="px-4 py-6 space-y-1.5">
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>

                <a href="index.html" className="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
                  <i data-lucide="layout-grid" className="w-4 h-4 text-white"></i>
                  <span>Página Inicial</span>
                </a>

                <a href="vendas.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="shopping-cart" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página de Vendas</span>
                </a>

                <a href="comissoes.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="briefcase" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Comissões</span>
                </a>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800/80 bg-slate-900/60 relative z-10">
              <div className="flex items-center gap-3 p-2 rounded-xl bg-slate-800/40 border border-slate-700/40">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow">
                  OP
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-semibold text-white truncate">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400 truncate">operador@salespro.com</p>
                </div>
                <div className="w-2 h-2 rounded-full bg-emerald-400 shrink-0 ring-4 ring-emerald-500/20"></div>
              </div>
              <p className="text-[10px] text-slate-400 text-center mt-3">© 2026 Neves Pro CRM</p>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            
            {/* TOPBAR LIMPO COM CONTEXTO TELES ODONTO */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Teles Odonto</span>
                <span className="text-slate-400">&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  Módulo Ativo
                </span>
              </div>

              <div className="flex items-center gap-3">
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  ● SISTEMA ONLINE
                </span>
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                  OP
                </div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              
              {/* BANNER HORÁRIO DE BRASÍLIA E CICLO */}
              <div className="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-5 rounded-3xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center">
                    <i data-lucide="clock" className="w-5 h-5 text-indigo-300"></i>
                  </div>
                  <div>
                    <span className="text-[10px] uppercase tracking-widest text-indigo-300 font-bold block">HORÁRIO DE BRASÍLIA</span>
                    <h2 className="text-xl font-black">{horaBrasilia || 'Carregando...'}</h2>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="text-right">
                    <span className="text-[10px] uppercase tracking-widest text-slate-400 font-semibold block">MÊS VIGENTE</span>
                    <span className="text-xs font-bold text-indigo-200">Novembro / 2026</span>
                  </div>
                  <div className="w-9 h-9 rounded-xl bg-indigo-800/80 flex items-center justify-center text-indigo-200 border border-indigo-700/50">
                    <i data-lucide="calendar" className="w-4 h-4"></i>
                  </div>
                </div>
              </div>

              {/* 4 CARDS SUPERIORES DE INDICADORES */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-center text-slate-400 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider">RECEITA (NOVEMBRO)</span>
                    <i data-lucide="wallet" className="w-4 h-4 text-indigo-600"></i>
                  </div>
                  <p className="text-2xl font-black text-slate-900">{formatBRL(totalReceita)}</p>
                  <p className="text-[11px] text-emerald-600 font-semibold mt-1">Baixado: {formatBRL(totalBaixado)}</p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-center text-slate-400 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider">À RECEBER (NOVEMBRO)</span>
                    <i data-lucide="alert-circle" className="w-4 h-4 text-blue-500"></i>
                  </div>
                  <p className="text-2xl font-black text-slate-900">{formatBRL(totalAReceber)}</p>
                  <p className="text-[11px] text-slate-400 mt-1">Carteira operacional ativa</p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-center text-slate-400 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider">TOTAL DE VENDAS</span>
                    <i data-lucide="shopping-bag" className="w-4 h-4 text-emerald-600"></i>
                  </div>
                  <p className="text-2xl font-black text-slate-900">{sales.length} pedidos</p>
                  <p className="text-[11px] text-slate-400 mt-1">Lançamentos registrados</p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-center text-slate-400 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider">CLIENTES COM COMPRAS</span>
                    <i data-lucide="users" className="w-4 h-4 text-indigo-600"></i>
                  </div>
                  <p className="text-2xl font-black text-slate-900">{clients.length} cadastrados</p>
                  <p className="text-[11px] text-indigo-600 font-semibold mt-1">Base ativa Teles Odonto</p>
                </div>
              </div>

              {/* GRID PRINCIPAL: NOVA VENDA + LIVRO DE VENDAS */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                {/* FORMULÁRIO DE NOVA VENDA */}
                <div className="lg:col-span-5 bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-700 flex items-center justify-center font-bold">
                        <i data-lucide="plus" className="w-4 h-4"></i>
                      </div>
                      <h3 className="font-extrabold text-sm text-slate-900">Nova Venda</h3>
                    </div>
                    <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">
                      Lançamento DAV
                    </span>
                  </div>

                  <form onSubmit={handleRegistrarVenda} className="space-y-3 text-xs">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="font-semibold text-slate-600 block mb-1">Data da Venda</label>
                        <input 
                          type="date" 
                          value={dataVenda} 
                          onChange={e => setDataVenda(e.target.value)} 
                          className="w-full p-2 border rounded-xl bg-slate-50 font-bold outline-none" 
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-slate-600 block mb-1">DAV (Nº Pedido)</label>
                        <input 
                          type="text" 
                          value={davNumero} 
                          onChange={e => setDavNumero(e.target.value)} 
                          className="w-full p-2 border rounded-xl bg-slate-50 font-mono font-bold text-center outline-none" 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Cód. Cliente ou Nome</label>
                      <input 
                        type="text" 
                        placeholder="Digite o código (ex: CLI-088) ou nome..." 
                        value={codClienteInput} 
                        onChange={handleBuscarCliente} 
                        className="w-full p-2 border rounded-xl bg-slate-50 font-semibold outline-none" 
                        required 
                      />
                    </div>

                    {clienteSelecionado && (
                      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                        <div className="flex justify-between items-start">
                          <h4 className="font-bold text-slate-900">{clienteSelecionado.name}</h4>
                          <span className="text-[9px] font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded">
                            {clienteSelecionado.categoria}
                          </span>
                        </div>
                        <p className="text-[10px] text-slate-400">{clienteSelecionado.endereco}</p>
                      </div>
                    )}

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="font-semibold text-slate-600 block mb-1">Cód. Vend.</label>
                        <select 
                          value={vendedorResp} 
                          onChange={e => setVendedorResp(e.target.value)}
                          className="w-full p-2 border rounded-xl bg-slate-50 font-bold outline-none"
                        >
                          <option value="VND-01">VND-01 (André Luiz)</option>
                          <option value="VND-02">VND-02 (Luis Daniel)</option>
                        </select>
                      </div>
                      <div>
                        <label className="font-semibold text-slate-600 block mb-1">Tipo de Venda</label>
                        <select 
                          value={tipoVenda} 
                          onChange={e => setTipoVenda(e.target.value)}
                          className="w-full p-2 border rounded-xl bg-slate-50 font-bold outline-none"
                        >
                          <option value="TOTAL">TOTAL</option>
                          <option value="PARCIAL">PARCIAL</option>
                          <option value="DENTISTAS">DENTISTAS</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Valor da Venda (R$)</label>
                      <input 
                        type="text" 
                        placeholder="R$ 1.850,00" 
                        value={valorVenda} 
                        onChange={e => setValorVenda(e.target.value)} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 font-black text-sm outline-none text-slate-900" 
                        required 
                      />
                    </div>

                    {/* CONDIÇÃO DE PRAZO & ATÉ 12X */}
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="font-semibold text-slate-600 block mb-1">Condição / Prazo</label>
                        <select 
                          value={condicaoPrazo} 
                          onChange={e => setCondicaoPrazo(e.target.value)}
                          className="w-full p-2 border rounded-xl bg-slate-50 font-semibold outline-none"
                        >
                          <option value="0">À Vista (0 dias)</option>
                          <option value="15">15 dias</option>
                          <option value="30">30 dias</option>
                          <option value="45">45 dias</option>
                          <option value="60">60 dias</option>
                        </select>
                      </div>

                      <div>
                        <label className="font-semibold text-slate-600 block mb-1">Nº de Parcelas</label>
                        <select 
                          value={numParcelas} 
                          onChange={e => setNumParcelas(parseInt(e.target.value, 10))}
                          className="w-full p-2 border rounded-xl bg-slate-50 font-bold outline-none"
                        >
                          <option value="1">1x (Parcela Única)</option>
                          <option value="2">2x</option>
                          <option value="3">3x</option>
                          <option value="4">4x</option>
                          <option value="5">5x</option>
                          <option value="6">6x</option>
                          <option value="7">7x</option>
                          <option value="8">8x</option>
                          <option value="9">9x</option>
                          <option value="10">10x</option>
                          <option value="11">11x</option>
                          <option value="12">12x (Máximo)</option>
                        </select>
                      </div>
                    </div>

                    {/* PRÉVIA DE VENCIMENTOS */}
                    {parcelasCustom.length > 0 && (
                      <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-2">
                        <div className="flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase">
                          <span>Prévia de Vencimentos ({parcelasCustom.length}x)</span>
                          <span className="text-indigo-600">{formatBRL(parcelasCustom[0]?.amount)} /mês</span>
                        </div>
                        <div className="space-y-1 max-h-36 overflow-y-auto pr-1">
                          {parcelasCustom.map((p, idx) => (
                            <div key={idx} className="flex justify-between items-center bg-white p-1.5 px-2.5 rounded-lg border text-[11px]">
                              <span className="font-semibold text-slate-700">Parcela {p.number}</span>
                              <span className="font-mono text-slate-500">{p.dueDate}</span>
                              <span className="font-bold text-slate-900">{formatBRL(p.amount)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <button 
                      type="submit" 
                      className="w-full py-3 rounded-2xl bg-indigo-700 hover:bg-indigo-800 text-white font-bold text-xs shadow-md shadow-indigo-600/20 transition flex items-center justify-center gap-2 mt-2"
                    >
                      <i data-lucide="check" className="w-4 h-4"></i>
                      <span>Registrar Venda</span>
                    </button>
                  </form>
                </div>

                {/* LIVRO DE VENDAS REGISTRADAS */}
                <div className="lg:col-span-7 bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <div>
                      <h3 className="font-extrabold text-sm text-slate-900">Vendas de Novembro / 2026</h3>
                      <p className="text-[11px] text-slate-400">Livro de lançamentos e controle de parcelas</p>
                    </div>
                    <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full">
                      {sales.length} Lançamentos
                    </span>
                  </div>

                  {sales.length === 0 ? (
                    <div className="py-12 text-center text-xs text-slate-400 bg-slate-50 rounded-2xl border border-dashed">
                      Nenhuma venda registrada ainda no Firebase. Faça o primeiro lançamento ao lado!
                    </div>
                  ) : (
                    <div className="divide-y divide-slate-100">
                      {sales.map(s => (
                        <div key={s.id || s.dav} className="py-3 flex items-center justify-between">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-mono font-bold text-indigo-700 text-xs">#{s.dav}</span>
                              <h4 className="font-bold text-xs text-slate-900">{s.client}</h4>
                              <span className="text-[9px] font-bold bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded">
                                {s.tipoVenda || 'TOTAL'}
                              </span>
                            </div>
                            <p className="text-[10px] text-slate-400 mt-0.5">
                              {s.dateDisplay || s.date} • Vend: {s.salesperson} • {s.parcelasQtd || (s.installments ? s.installments.length : 1)}x
                            </p>
                          </div>

                          <div className="text-right">
                            <span className="text-xs font-black text-slate-900 block">{formatBRL(s.amount)}</span>
                            <a href={`vendas.html?cliente=${s.codCliente}`} className="text-[10px] text-indigo-600 font-bold hover:underline">
                              Ver na Carteira &gt;
                            </a>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
