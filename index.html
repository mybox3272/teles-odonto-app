<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neves Pro CRM - Gestão Comercial & Comissões</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { 50: '#f2f3ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', dark: '#1a202c' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @media print { aside, header, .no-print { display: none !important; } main { padding: 0 !important; } }
  </style>
</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",
      storageBucket: "neves-pro-crm-comissoes.firebasestorage.app",
      messagingSenderId: "747505960352",
      appId: "1:747505960352:web:5e7d2d5168a14dbfe490c5",
      measurementId: "G-9CF84R9BWM"
    };

    const ToothWatermark = ({ className = "w-48 h-48 opacity-[0.06]" }) => (
      <svg viewBox="0 0 100 120" className={className} fill="currentColor">
        <path d="M 45 15 C 28 15 15 32 15 55 C 15 78 28 98 42 98 C 48 98 52 82 52 70 C 52 82 56 98 62 98 C 76 98 89 78 89 55 C 89 32 76 15 59 15 C 55 15 52 24 52 24 C 52 24 49 15 45 15 Z" fill="none" stroke="currentColor" strokeWidth="6"/>
        <path d="M 8 52 C 32 78 68 78 92 38" fill="none" stroke="currentColor" strokeWidth="6"/>
        <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" />
      </svg>
    );

    const initialClients = [
      { cod: "2", name: "JOÃO PESSOA MEDEIROS COSTA", nickname: "" },
      { cod: "4", name: "LEONARDO AMORIM DE FRANCA E SOUSA", nickname: "ERDENIA" },
      { cod: "5", name: "IMPRESSIONE LABORATÓRIO DE PROTESE LTDA", nickname: "" },
      { cod: "7", name: "DAVI DA CUNHA GONCALVES", nickname: "DR. DAVI CUNHA" },
      { cod: "8", name: "LEONARDO DA SILVA SOUZA", nickname: "CHINA" },
      { cod: "9", name: "JOAO FERNANDO BRITO SILVA", nickname: "MARAPONGA" },
      { cod: "10", name: "JOSE BRENO MESQUITA FARIAS", nickname: "SMILE LAB" },
      { cod: "88", name: "Laboratório Dental Sorriso", nickname: "HELENA" },
      { cod: "93", name: "Implantes & Próteses Vitória", nickname: "CONCEPT" },
      { cod: "104", name: "Clínica OdontoPrime", nickname: "DR. VALTER" }
    ];

    const initialSellers = [
      { cod: "1", codeVnd: "VND-01", name: "André Luiz Nóbrega Martins", reg: 3.0, bom: 3.5, otimo: 4.0, parc: 1.5, dent: 0, hasDent: false },
      { cod: "2", codeVnd: "VND-02", name: "Luis Daniel da Silva", reg: 2.0, bom: 2.5, otimo: 3.0, parc: 1.5, dent: 4.0, hasDent: true }
    ];

    function App() {
      const [currentView, setCurrentView] = useState('home');
      const [isLayoutEdit, setIsLayoutEdit] = useState(false);
      const [commissionMonth, setCommissionMonth] = useState('2026-11');
      const [currentTime, setCurrentTime] = useState(new Date());
      const [clients, setClients] = useState(initialClients);
      const [sellers] = useState(initialSellers);
      const [sales, setSales] = useState([
        {
          id: 'v1', dav: '48911', codCliente: '88', client: 'Laboratório Dental Sorriso', codVendedor: '1', salesperson: 'André Luiz Nóbrega Martins',
          amount: 1600.0, date: '2026-11-04', tipoVenda: 'TOTAL', isPromissoria: false,
          installments: [{ id: 'i1-1', number: 1, amount: 1600.0, dueDate: '2026-11-04', status: 'Pago', paymentDate: '2026-11-04' }]
        },
        {
          id: 'v2', dav: '48919', codCliente: '93', client: 'Implantes & Próteses Vitória', codVendedor: '2', salesperson: 'Luis Daniel da Silva',
          amount: 3200.0, date: '2026-11-09', tipoVenda: 'PARCIAL', isPromissoria: false,
          installments: [
            { id: 'i2-1', number: 1, amount: 1600.0, dueDate: '2026-11-09', status: 'Pago', paymentDate: '2026-11-09' },
            { id: 'i2-2', number: 2, amount: 1600.0, dueDate: '2026-12-09', status: 'Em aberto', paymentDate: null }
          ]
        },
        {
          id: 'v3', dav: '48925', codCliente: '4', client: 'LEONARDO AMORIM DE FRANCA E SOUSA', codVendedor: '2', salesperson: 'Luis Daniel da Silva',
          amount: 850.0, date: '2026-11-12', tipoVenda: 'DENTISTAS', isPromissoria: false,
          installments: [{ id: 'i3-1', number: 1, amount: 850.0, dueDate: '2026-11-12', status: 'Em aberto', paymentDate: null }]
        }
      ]);

      // Form State
      const [form, setForm] = useState({
        codCliente: '', client: '', codVendedor: '1', dav: '48930', amount: '', date: '2026-11-12', tipoVenda: 'TOTAL', prazo: '0', parcelas: '1'
      });
      const [clientWarning, setClientWarning] = useState(false);

      // Carteira State
      const [selectedClient, setSelectedClient] = useState(initialClients[1]);
      const [clientFilter, setClientFilter] = useState('all'); // all, compras, inadimplentes, areceber, today, month
      const [clientSearch, setClientSearch] = useState('');
      const [fifoAmount, setFifoAmount] = useState('');
      const [fifoMsg, setFifoMsg] = useState('');

      // Comissões State
      const [compareMoM, setCompareMoM] = useState(true);
      const [selectedAuditSeller, setSelectedAuditSeller] = useState('1');

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const todayStr = useMemo(() => {
        const y = currentTime.getFullYear();
        const m = String(currentTime.getMonth() + 1).padStart(2, '0');
        const d = String(currentTime.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }, [currentTime]);

      const daysLeftInMonth = useMemo(() => {
        const y = currentTime.getFullYear();
        const m = currentTime.getMonth();
        const lastDay = new Date(y, m + 1, 0).getDate();
        return Math.max(0, lastDay - currentTime.getDate());
      }, [currentTime]);

      const currentMonthSales = useMemo(() => {
        return sales.filter(s => s.date && s.date.startsWith(commissionMonth));
      }, [sales, commissionMonth]);

      const kpis = useMemo(() => {
        let revenue = 0, paid = 0, receivable = 0, openInstCount = 0;
        const uniqueClients = new Set();

        currentMonthSales.forEach(s => {
          revenue += s.amount;
          uniqueClients.add(s.codCliente);
          (s.installments || []).forEach(i => {
            if (i.status === 'Pago') paid += i.amount;
            else { receivable += i.amount; openInstCount++; }
          });
        });
        const paidPct = revenue > 0 ? Math.round((paid / revenue) * 100) : 0;
        return { revenue, paid, receivable, openInstCount, ordersCount: currentMonthSales.length, clientsCount: uniqueClients.size, paidPct };
      }, [currentMonthSales]);

      // Handle Client Code in Form
      const handleClientCodeChange = (code) => {
        const found = clients.find(c => c.cod === code);
        if (found) {
          setForm(prev => ({ ...prev, codCliente: code, client: found.name }));
          setClientWarning(false);
        } else {
          setForm(prev => ({ ...prev, codCliente: code, client: '' }));
          setClientWarning(code.trim().length > 0);
        }
      };

      const handleQuickAddClient = () => {
        const newClientName = prompt("Digite o nome/razão social para o código #" + form.codCliente);
        if (newClientName) {
          const newC = { cod: form.codCliente, name: newClientName, nickname: '' };
          setClients(prev => [...prev, newC]);
          setForm(prev => ({ ...prev, client: newClientName }));
          setClientWarning(false);
        }
      };

      const handleAddSale = (e) => {
        e.preventDefault();
        const val = parseFloat(form.amount.replace(',', '.'));
        if (!val || !form.dav) return;

        const seller = sellers.find(s => s.cod === form.codVendedor) || sellers[0];
        let instList = [];

        if (form.prazo === '0') {
          instList.push({ id: `i-${Date.now()}-1`, number: 1, amount: val, dueDate: form.date, status: 'Pago', paymentDate: form.date });
        } else if (form.prazo === 'PROMISSORIA') {
          instList.push({ id: `i-${Date.now()}-1`, number: 1, amount: val, dueDate: '2026-12-31', status: 'Em aberto', paymentDate: null });
        } else {
          const pDays = parseInt(form.prazo, 10);
          const numP = Math.max(1, parseInt(form.parcelas, 10));
          const pVal = val / numP;
          for (let i = 1; i <= numP; i++) {
            const d = new Date(form.date);
            d.setDate(d.getDate() + (pDays * i));
            instList.push({
              id: `i-${Date.now()}-${i}`,
              number: i,
              amount: pVal,
              dueDate: d.toISOString().split('T')[0],
              status: 'Em aberto',
              paymentDate: null
            });
          }
        }

        const newSale = {
          id: `s-${Date.now()}`,
          dav: form.dav,
          codCliente: form.codCliente || '4',
          client: form.client || 'Cliente Avulso',
          codVendedor: form.codVendedor,
          salesperson: seller.name,
          amount: val,
          date: form.date,
          tipoVenda: form.tipoVenda,
          isPromissoria: form.prazo === 'PROMISSORIA',
          installments: instList
        };

        setSales(prev => [newSale, ...prev]);
        setForm(prev => ({ ...prev, dav: String(parseInt(prev.dav || 48930) + 1), amount: '' }));
        alert("✅ Venda registrada com sucesso no Neves Pro CRM!");
      };

      // FIFO Cascata
      const handleFifoAbatimento = (e) => {
        e.preventDefault();
        const abateVal = parseFloat(fifoAmount);
        if (!abateVal || !selectedClient) return;

        let rem = abateVal;
        setSales(prevSales => prevSales.map(s => {
          if (s.codCliente !== selectedClient.cod) return s;
          const updatedInst = s.installments.map(inst => {
            if (inst.status === 'Pago' || rem <= 0) return inst;
            if (rem >= inst.amount) {
              rem -= inst.amount;
              return { ...inst, status: 'Pago', paymentDate: todayStr };
            } else {
              const paidPart = rem;
              rem = 0;
              return { ...inst, amount: inst.amount - paidPart };
            }
          });
          return { ...s, installments: updatedInst };
        }));

        setFifoMsg(`✅ Amortização de R$ ${abateVal.toFixed(2)} liquidada via FIFO com sucesso!`);
        setFifoAmount('');
        setTimeout(() => setFifoMsg(''), 4000);
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* SIDEBAR #1a202c */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-slate-300 flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden">
            <div className="absolute -bottom-12 -right-12 pointer-events-none text-white/5 w-64 h-64">
              <ToothWatermark className="w-full h-full" />
            </div>

            <div>
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">TO</div>
                  <div>
                    <h1 className="text-white font-bold text-sm leading-tight">Teles Odonto</h1>
                    <p className="text-[10px] text-indigo-400 font-semibold tracking-wider uppercase">Neves Pro CRM</p>
                  </div>
                </div>
              </div>

              <div className="px-4 py-5">
                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>
                <nav className="space-y-1">
                  <button onClick={() => setCurrentView('home')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition text-left ${currentView === 'home' ? 'bg-indigo-700 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                    <i data-lucide="layout-grid" className="w-4 h-4"></i>
                    <span>Página Inicial</span>
                  </button>
                  <button onClick={() => setCurrentView('sales_page')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition text-left ${currentView === 'sales_page' ? 'bg-indigo-700 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                    <i data-lucide="shopping-cart" className="w-4 h-4"></i>
                    <span>Página de Vendas</span>
                  </button>
                  <button onClick={() => setCurrentView('commissions')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition text-left ${currentView === 'commissions' ? 'bg-indigo-700 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                    <i data-lucide="briefcase" className="w-4 h-4"></i>
                    <span>Comissões</span>
                  </button>
                  <button onClick={() => setIsLayoutEdit(!isLayoutEdit)} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition text-left mt-4 ${isLayoutEdit ? 'bg-amber-600 text-white' : 'text-slate-400 hover:bg-slate-800 border border-slate-700'}`}>
                    <i data-lucide="settings" className="w-4 h-4"></i>
                    <span>{isLayoutEdit ? 'Concluir Edição' : 'Editar Layout do Site'}</span>
                  </button>
                </nav>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800 relative z-10 space-y-3">
              <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center text-xs font-bold">OP</div>
                <div className="truncate">
                  <p className="text-xs font-bold text-slate-200">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400">operador@nevespro.com</p>
                </div>
              </div>
              <div className="text-[9px] text-slate-500 text-center leading-tight">
                <p>Neves Pro CRM, Todos os Direitos Reservado</p>
                <p className="text-indigo-400 font-semibold mt-0.5">Por Daniel Silva</p>
              </div>
            </div>
          </aside>

          {/* MAIN AREA */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            {/* TOPBAR */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Neves Pro CRM</span>
                <span>&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2 py-0.5 rounded-full capitalize">
                  {currentView === 'home' ? 'Página Inicial' : currentView === 'sales_page' ? 'Página de Vendas' : 'Comissões'}
                </span>
              </div>
              <div className="flex items-center gap-4">
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  ● SISTEMA ONLINE
                </span>
                <div className="flex items-center gap-3 text-slate-400">
                  <button title="Notificações"><i data-lucide="bell" className="w-4 h-4"></i></button>
                  <button title="Ajuda"><i data-lucide="help-circle" className="w-4 h-4"></i></button>
                  <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs">D</div>
                </div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">

              {/* VIEW 1: HOME */}
              {currentView === 'home' && (
                <div className="space-y-6">
                  {/* Bloco 1: Relógio e Fim de Mês */}
                  <div className="bg-slate-900 rounded-2xl p-5 text-white flex flex-col md:flex-row items-center justify-between gap-4 shadow-sm relative overflow-hidden">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-indigo-600/30 flex items-center justify-center text-indigo-400">
                        <i data-lucide="clock" className="w-5 h-5"></i>
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Horário de Brasília</span>
                        <p className="text-lg font-bold font-mono">
                          {currentTime.toLocaleTimeString('pt-BR')} <span className="text-xs text-slate-400 font-normal">| {currentTime.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span>
                        </p>
                      </div>
                    </div>
                    <div className="flex items-center gap-4">
                      <div className="text-right">
                        <span className="text-[10px] text-indigo-300 block font-semibold">PLANEJAMENTO</span>
                        <span className="text-xs text-white font-bold">Faltam {daysLeftInMonth} dias para o mês acabar</span>
                      </div>
                      <input 
                        type="month" 
                        value={commissionMonth} 
                        onChange={e => setCommissionMonth(e.target.value)} 
                        className="bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl border-none outline-none cursor-pointer"
                      />
                    </div>
                  </div>

                  {/* Bloco 2: 4 KPIs */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm relative overflow-hidden">
                      <span className="text-[10px] font-bold text-slate-500 uppercase">Receita (Mês)</span>
                      <p className="text-2xl font-black text-slate-900 mt-1">R$ {kpis.revenue.toFixed(2)}</p>
                      <p className="text-xs text-emerald-600 font-semibold mt-2">Baixado: R$ {kpis.paid.toFixed(2)}</p>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                      <span className="text-[10px] font-bold text-slate-500 uppercase">À Receber (Mês)</span>
                      <p className="text-2xl font-black text-amber-600 mt-1">R$ {kpis.receivable.toFixed(2)}</p>
                      <p className="text-xs text-slate-400 mt-2">{kpis.openInstCount} parcelas pendentes</p>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                      <span className="text-[10px] font-bold text-slate-500 uppercase">Total de Vendas (Mês)</span>
                      <p className="text-2xl font-black text-slate-900 mt-1">{kpis.ordersCount} DAVs</p>
                      <p className="text-xs text-indigo-600 mt-2">Emissão contínua</p>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                      <span className="text-[10px] font-bold text-slate-500 uppercase">Clientes com Compras</span>
                      <p className="text-2xl font-black text-slate-900 mt-1">{kpis.clientsCount} ativos</p>
                      <p className="text-xs text-purple-600 mt-2">Base única no mês</p>
                    </div>
                  </div>

                  {/* Bloco 3: Formulário + Tabela */}
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div className="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm relative overflow-hidden">
                      <h2 className="text-sm font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i data-lucide="plus-circle" className="w-4 h-4 text-indigo-700"></i>
                        Lançamento de Nova Venda
                      </h2>
                      <form onSubmit={handleAddSale} className="space-y-3.5">
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="text-[11px] font-semibold text-slate-600 block mb-1">Cód. Cliente</label>
                            <input 
                              type="text" 
                              value={form.codCliente} 
                              onChange={e => handleClientCodeChange(e.target.value)} 
                              placeholder="Ex: 4" 
                              className="w-full text-xs p-2.5 border rounded-xl bg-slate-50 outline-none" 
                              required 
                            />
                          </div>
                          <div>
                            <label className="text-[11px] font-semibold text-slate-600 block mb-1">Nome do Cliente</label>
                            <input 
                              type="text" 
                              value={form.client} 
                              readOnly 
                              placeholder="Auto-preenchido" 
                              className="w-full text-xs p-2.5 border rounded-xl bg-slate-100 text-slate-600 outline-none" 
                            />
                          </div>
                        </div>

                        {clientWarning && (
                          <div className="bg-amber-50 border border-amber-200 p-2.5 rounded-xl flex items-center justify-between text-xs text-amber-800">
                            <span>Código Inédito!</span>
                            <button type="button" onClick={handleQuickAddClient} className="bg-amber-600 text-white px-2.5 py-1 rounded-lg font-bold text-[11px]">
                              Cadastrar Cliente
                            </button>
                          </div>
                        )}

                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="text-[11px] font-semibold text-slate-600 block mb-1">Vendedor</label>
                            <select 
                              value={form.codVendedor} 
                              onChange={e => setForm({...form, codVendedor: e.target.value})} 
                              className="w-full text-xs p-2.5 border rounded-xl bg-slate-50 outline-none"
                            >
                              {sellers.map(s => <option key={s.cod} value={s.cod}>{s.codeVnd} - {s.name}</option>)}
                            </select>
                          </div>
                          <div>
                            <label className="text-[11px] font-semibold text-slate-600 block mb-1">Nº DAV</label>
                            <input 
                              type="text" 
                              value={form.dav}
