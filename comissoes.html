<head>

    import {

      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",

      messagingSenderId: "747505960352",

    try {

</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const formatBRL = (val) => {
      const n = Number(val) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    // Componente Marca D'água Teles Odonto
    const ToothWatermark = ({ className = "w-64 h-64 text-slate-900 opacity-[0.035]" }) => (
      <svg viewBox="0 0 100 120" className={className} fill="currentColor">
        <path d="M 45 15 C 28 15 15 32 15 55 C 15 78 28 98 42 98 C 48 98 52 82 52 70 C 52 82 56 98 62 98 C 76 98 89 78 89 55 C 89 32 76 15 59 15 C 55 15 52 24 52 24 C 52 24 49 15 45 15 Z" fill="none" stroke="currentColor" strokeWidth="6"/>
        <path d="M 8 52 C 32 78 68 78 92 38" fill="none" stroke="currentColor" strokeWidth="6"/>
        <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" />
      </svg>
    );

    const initialSellers = [
      {
        id: "vnd-01",
        codeVnd: "VND-01",
        name: "André Luiz Nóbrega Martins",
        shortName: "André Luiz N.",
        role: "Perfil Sênior • Clínicas Especializadas",
        metaMes: 32000.00,
        metaAnterior: 20800.00,
        regras: {
          regular: 3.0,
          bom: 3.5,
          otimo: 4.0,
          parcial: 1.5,
          dentistas: 4.0
        }
      },
      {
        id: "vnd-02",
        codeVnd: "VND-02",
        name: "Luis Daniel da Silva",
        shortName: "Luis Daniel da Silva",
        role: "Perfil Consultoria • Parcerias Clínicas",
        metaMes: 32000.00,
        metaAnterior: 16700.00,
        regras: {
          regular: 2.0,
          bom: 2.5,
          otimo: 3.0,
          parcial: 1.5,
          dentistas: 4.0
        }
      }
    ];

    function App() {
      const [sellers, setSellers] = useState(initialSellers);
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [periodoComparativo, setPeriodoComparativo] = useState('ATUAL_VS_ANTERIOR');
      const [filtroOperador, setFiltroOperador] = useState('TODOS');
      const [vendedorSelecionadoExtrato, setVendedorSelecionadoExtrato] = useState("VND-01");

      // Formulário para cadastro/configuração de novo vendedor
      const [novoVendedor, setNovoVendedor] = useState({
        codeVnd: "03",
        name: "",
        perfil: "Padrão Laboratorial",
        regRegular: "2.5",
        regBom: "3.0",
        regOtimo: "4.0",
        comissaoParcial: true,
        canalDentistas: false
      });

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Sincronização em tempo real com Firebase Firestore
      useEffect(() => {
        const startListeners = () => {
          if (!window.db || !window.fb) return;

          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const qVendas = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));
            const unsub = window.fb.onSnapshot(qVendas, (snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setSales(list);
              setLoading(false);
            }, () => setLoading(false));

            return () => unsub();
          } catch (e) {
            console.error("Erro listeners comissoes.html:", e);
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListeners();
        } else {
          window.addEventListener("firebase-ready", startListeners);
          return () => window.removeEventListener("firebase-ready", startListeners);
        }
      }, []);

      // =========================================================================
      // CÁLCULO ESTREITO DE COMISSÕES BASEADO 100% NAS VENDAS REAIS DO BANCO
      // =========================================================================
      const relatorioVendedores = useMemo(() => {
        return sellers.map(seller => {
          const vendasDoVendedor = sales.filter(s => {
            const matchNome = s.salesperson && s.salesperson.toLowerCase().includes(seller.name.toLowerCase().split(' ')[0]);
            const matchCod = s.salespersonCode && s.salespersonCode === seller.codeVnd;
            return matchNome || matchCod;
          });

          let totalBruto = 0;
          let totalBaixado = 0;
          let comissaoLiberada = 0;
          let comissaoProjetada = 0;
          let baixasCount = 0;

          vendasDoVendedor.forEach(venda => {
            const valorVenda = Number(venda.amount) || 0;
            totalBruto += valorVenda;

            // Determina a taxa de acordo com o tipo da venda ou faixa
            let taxaPercentual = seller.regras.regular;
            if (venda.tipoVenda === 'PARCIAL') {
              taxaPercentual = seller.regras.parcial;
            } else if (venda.tipoVenda === 'DENTISTAS') {
              taxaPercentual = seller.regras.dentistas;
            }

            let baixadoNaVenda = 0;
            (venda.installments || []).forEach(inst => {
              const amt = Number(inst.amount) || 0;
              if (inst.status === 'Pago') {
                baixadoNaVenda += amt;
                baixasCount++;
              }
            });

            totalBaixado += baixadoNaVenda;
            comissaoLiberada += (baixadoNaVenda * (taxaPercentual / 100));
            comissaoProjetada += (valorVenda * (taxaPercentual / 100));
          });

          const aLiquidarAberto = Math.max(0, totalBruto - totalBaixado);
          const percentualMeta = seller.metaMes > 0 ? (totalBruto / seller.metaMes) * 100 : 0;
          const vendasMesAnterior = seller.metaAnterior || 0;
          const crescimentoMoM = vendasMesAnterior > 0 ? ((totalBruto - vendasMesAnterior) / vendasMesAnterior) * 100 : 0;

          return {
            ...seller,
            totalBruto,
            totalBaixado,
            aLiquidarAberto,
            comissaoLiberada,
            comissaoProjetada,
            pedidosCount: vendasDoVendedor.length,
            baixasCount,
            percentualMeta,
            vendasMesAnterior,
            crescimentoMoM
          };
        });
      }, [sellers, sales]);

      // Métricas Consolidadas do Topo (Total da Empresa)
      const consolidados = useMemo(() => {
        let brutoGeral = 0;
        let baixadoGeral = 0;
        let aLiquidarGeral = 0;
        let comissaoLiberadaGeral = 0;
        let comissaoProjetadaGeral = 0;
        let totalPedidos = 0;
        let totalBaixas = 0;

        relatorioVendedores.forEach(r => {
          brutoGeral += r.totalBruto;
          baixadoGeral += r.totalBaixado;
          aLiquidarGeral += r.aLiquidarAberto;
          comissaoLiberadaGeral += r.comissaoLiberada;
          comissaoProjetadaGeral += r.comissaoProjetada;
          totalPedidos += r.pedidosCount;
          totalBaixas += r.baixasCount;
        });

        const ticketMedio = totalPedidos > 0 ? (brutoGeral / totalPedidos) : 0;
        const totalMesAnterior = 37500.00;
        const variacaoMoM = totalMesAnterior > 0 ? ((brutoGeral - totalMesAnterior) / totalMesAnterior) * 100 : 0;

        return {
          brutoGeral,
          baixadoGeral,
          aLiquidarGeral,
          comissaoLiberadaGeral,
          comissaoProjetadaGeral,
          totalPedidos,
          totalBaixas,
          ticketMedio,
          variacaoMoM
        };
      }, [relatorioVendedores]);

      // Extrato detalhado de auditoria por títulos para o vendedor ativo
      const extratoAuditoria = useMemo(() => {
        const sellerAtivo = sellers.find(s => s.codeVnd === vendedorSelecionadoExtrato) || sellers[0];
        if (!sellerAtivo) return [];

        const vendasDoVendedor = sales.filter(s => {
          const matchNome = s.salesperson && s.salesperson.toLowerCase().includes(sellerAtivo.name.toLowerCase().split(' ')[0]);
          const matchCod = s.salespersonCode && s.salespersonCode === sellerAtivo.codeVnd;
          return matchNome || matchCod;
        });

        const itens = [];
        vendasDoVendedor.forEach(venda => {
          let taxa = sellerAtivo.regras.regular;
          let regraNome = `Regular (${taxa.toFixed(1)}%)`;

          if (venda.tipoVenda === 'PARCIAL') {
            taxa = sellerAtivo.regras.parcial;
            regraNome = `Parcial (${taxa.toFixed(1)}%)`;
          } else if (venda.tipoVenda === 'DENTISTAS') {
            taxa = sellerAtivo.regras.dentistas;
            regraNome = `Dentistas (${taxa.toFixed(1)}%)`;
          }

          (venda.installments || []).forEach((inst, idx) => {
            if (inst.status === 'Pago') {
              const valorBaixado = Number(inst.amount) || 0;
              const comissao = valorBaixado * (taxa / 100);

              itens.push({
                dav: venda.dav || `DAV-${venda.id?.slice(0, 4)}`,
                cliente: venda.client || 'Cliente Teles Odonto',
                descricao: venda.description || 'Prótese Odontológica',
                dataBaixa: inst.paidAt ? new Date(inst.paidAt).toLocaleDateString('pt-BR') : inst.dueDate || venda.dateDisplay,
                tipoParcela: (venda.installments.length === 1 && venda.prazo === '0') ? 'À Vista' : `${inst.number || idx + 1}/${venda.installments.length}`,
                valorBaixado: valorBaixado,
                regra: regraNome,
                comissaoGerada: comissao
              });
            }
          });
        });

        return itens;
      }, [sellers, sales, vendedorSelecionadoExtrato]);

      const totalAuditoriaBaixado = useMemo(() => {
        return extratoAuditoria.reduce((acc, curr) => acc + curr.valorBaixado, 0);
      }, [extratoAuditoria]);

      const totalAuditoriaComissao = useMemo(() => {
        return extratoAuditoria.reduce((acc, curr) => acc + curr.comissaoGerada, 0);
      }, [extratoAuditoria]);

      // Ação: Salvar Novo Vendedor
      const handleSalvarNovoVendedor = (e) => {
        e.preventDefault();
        if (!novoVendedor.name.trim()) {
          alert("Informe o nome completo do vendedor.");
          return;
        }

        const novoDoc = {
          id: `vnd-${Date.now()}`,
          codeVnd: novoVendedor.codeVnd || `VND-${sellers.length + 1}`,
          name: novoVendedor.name,
          shortName: novoVendedor.name.split(' ')[0] + ' ' + (novoVendedor.name.split(' ')[1] || ''),
          role: novoVendedor.perfil,
          metaMes: 25000.00,
          metaAnterior: 0,
          regras: {
            regular: parseFloat(novoVendedor.regRegular) || 2.5,
            bom: parseFloat(novoVendedor.regBom) || 3.0,
            otimo: parseFloat(novoVendedor.regOtimo) || 4.0,
            parcial: novoVendedor.comissaoParcial ? 1.5 : 0,
            dentistas: novoVendedor.canalDentistas ? 4.0 : 0
          }
        };

        setSellers(prev => [...prev, novoDoc]);
        alert(`✅ Vendedor ${novoDoc.name} (${novoDoc.codeVnd}) cadastrado com sucesso!`);
        setNovoVendedor({
          codeVnd: String(sellers.length + 2).padStart(2, '0'),
          name: "",
          perfil: "Padrão Laboratorial",
          regRegular: "2.5",
          regBom: "3.0",
          regOtimo: "4.0",
          comissaoParcial: true,
          canalDentistas: false
        });
      };

      // Exportação em Excel / CSV
      const handleExportarRelatorio = () => {
        let csv = "data:text/csv;charset=utf-8,";
        csv += "Codigo;Vendedor;Meta Mes;Vendas Brutas;Total Baixado;A Liquidar (Aberto);Comissao Liberada;Comissao Total Projetada;Atingimento (%)\n";

        relatorioVendedores.forEach(r => {
          csv += `${r.codeVnd};${r.name};${r.metaMes.toFixed(2)};${r.totalBruto.toFixed(2)};${r.totalBaixado.toFixed(2)};${r.aLiquidarAberto.toFixed(2)};${r.comissaoLiberada.toFixed(2)};${r.comissaoProjetada.toFixed(2)};${r.percentualMeta.toFixed(1)}%\n`;
        });

        const encoded = encodeURI(csv);
        const link = document.createElement("a");
        link.setAttribute("href", encoded);
        link.setAttribute("download", `comissoes_teles_odonto_${periodoComparativo}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* BARRA LATERAL UNIFICADA */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-white flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden select-none border-r border-slate-800" id="app-sidebar">
            <div className="absolute -bottom-10 -right-10 w-56 h-56 pointer-events-none opacity-[0.06] brightness-200">
              <ToothWatermark className="w-full h-full text-white" />
            </div>

            <div className="relative z-10">
              <div className="p-6 border-b border-slate-800/80 flex flex-col gap-2">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center shrink-0 shadow-inner">
                    <svg className="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                      <path d="M12 2C7 2 4 5 4 9c0 5 2 9 3 13 1 1 2 1 3 0 1-2 2-2 2-2s1 0 2 2c1 1 2 1 3 0 1-4 3-8 3-13 0-4-3-7-8-7z"></path>
                      <path d="M9 8c.5-1 1.5-1.5 3-1.5s2.5.5 3 1.5"></path>
                    </svg>
                  </div>
                  <div>
                    <h1 className="text-base font-bold text-white tracking-tight leading-tight">Teles Odonto</h1>
                    <p className="text-[10px] font-medium text-slate-400 uppercase tracking-widest">Materiais Protéticos</p>
                  </div>
                </div>
                <div className="flex items-center justify-between mt-1 px-2 py-1 rounded bg-slate-800/60 border border-slate-700/50">
                  <span className="text-[11px] font-medium text-slate-300">Neves Pro CRM</span>
                  <span className="text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">v2.6 Audited</span>
                </div>
              </div>

              <div className="px-4 py-6 space-y-1.5">
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>

                <a href="index.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="layout-grid" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página Inicial</span>
                </a>

                <a href="vendas.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="shopping-cart" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página de Vendas</span>
                </a>

                <a href="comissoes.html" className="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
                  <i data-lucide="briefcase" className="w-4 h-4 text-white"></i>
                  <span>Comissões</span>
                </a>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800/80 bg-slate-900/60 relative z-10">
              <div className="flex items-center gap-3 p-2 rounded-xl bg-slate-800/40 border border-slate-700/40">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow">
                  OP
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-semibold text-white truncate">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400 truncate">operador@salespro.com</p>
                </div>
                <div className="w-2 h-2 rounded-full bg-emerald-400 shrink-0 ring-4 ring-emerald-500/20"></div>
              </div>
              <p className="text-[10px] text-slate-400 text-center mt-3">© 2026 Neves Pro CRM</p>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            
            {/* TOPBAR */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">SalesPro</span>
                <span className="text-slate-400">&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  Módulo Ativo
                </span>
              </div>

              <div className="flex items-center gap-3">
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  ● SISTEMA ONLINE
                </span>
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                  OP
                </div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              
              {/* CABEÇALHO */}
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold text-indigo-700 uppercase tracking-widest bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                      MÓDULO FINANCEIRO
                    </span>
                    <span className="text-xs text-slate-400">• Ciclo Mensal</span>
                  </div>
                  <h2 className="text-2xl font-black text-slate-900 mt-1">Comissões e Metas de Vendedores</h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Gestão escalonada de comissionamento, apuração por liquidação de títulos e conciliação de metas odontológicas.
                  </p>
                </div>

                <div className="flex items-center flex-wrap gap-2">
                  <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold shadow-xs">
                    <i data-lucide="calendar" className="w-4 h-4 text-indigo-600"></i>
                    <span className="text-slate-500">MÊS DE REFERÊNCIA:</span>
                    <span className="text-slate-800">Novembro / 2026</span>
                  </div>

                  <button 
                    onClick={handleExportarRelatorio}
                    className="flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-700 text-white text-xs font-bold hover:bg-indigo-800 shadow-md shadow-indigo-600/20 transition"
                  >
                    <i data-lucide="file-spreadsheet" className="w-4 h-4"></i>
                    <span>Relatório Geral</span>
                  </button>
                </div>
              </div>

              {/* CARD EXECUTIVO: CONSOLIDADO GERAL DE VENDAS BRUTAS */}
              <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 relative overflow-hidden">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-slate-100 gap-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600">
                      <i data-lucide="trending-up" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="font-extrabold text-sm text-slate-900">Consolidado Geral de Vendas Brutas do Mês</h3>
                        <span className="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">
                          Novembro / 2026
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-400">
                        Painel executivo de acompanhamento total: emissão bruta de pedidos/DAVs vs. liquidações efetivas
                      </p>
                    </div>

                      className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 transition"
                    >
                      <i data-lucide="printer" className="w-3.5 h-3.5 text-slate-500"></i>
                      <span>Imprimir / PDF</span>
                    </button>
                  </div>
                </div>

                {extratoAuditoria.length === 0 ? (
                  <div className="py-12 text-center text-xs text-slate-400 bg-slate-50 rounded-2xl border border-dashed">
                    Nenhuma parcela quitada/baixada no momento para este vendedor.
                    <br />
                    Ao dar baixa em duplicatas no <a href="vendas.html" className="text-indigo-600 font-bold hover:underline">vendas.html</a>, o extrato é atualizado instantaneamente!
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 uppercase text-[10px]">
                        <tr>
                          <th className="py-2.5 px-3">DAV / Título</th>
                          <th className="py-2.5 px-3">Cliente / Clínica</th>
                          <th className="py-2.5 px-3">Data Baixa</th>
                          <th className="py-2.5 px-3">Tipo / Parcela</th>
                          <th className="py-2.5 px-3">Valor Baixado (R$)</th>
                          <th className="py-2.5 px-3">Regra Aplicada</th>
                          <th className="py-2.5 px-3">Comissão Gerada</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {extratoAuditoria.map((item, idx) => (
                          <tr key={idx} className="hover:bg-slate-50 transition">
                            <td className="py-3 px-3">
                              <span className="font-mono font-bold text-indigo-700 block">#{item.dav}</span>
                            </td>
                            <td className="py-3 px-3">
                              <span className="font-bold text-slate-900 block">{item.cliente}</span>
                              <span className="text-[10px] text-slate-400">{item.descricao}</span>
                            </td>
                            <td className="py-3 px-3 text-slate-600 font-medium">
                              {item.dataBaixa}
                            </td>
                            <td className="py-3 px-3">
                              <span className="font-semibold text-slate-700 bg-slate-100 px-2 py-0.5 rounded text-[10px]">
                                {item.tipoParcela}
                              </span>
                            </td>
                            <td className="py-3 px-3 font-bold text-slate-900">
                              {formatBRL(item.valorBaixado)}
                            </td>
                            <td className="py-3 px-3">
                              <span className="text-[10px] font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">
                                {item.regra}
                              </span>
                            </td>
                            <td className="py-3 px-3 font-black text-emerald-600">
                              {formatBRL(item.comissaoGerada)}
                            </td>
                          </tr>
                        ))}

                        <tr className="bg-slate-50 font-bold text-slate-900 border-t">
                          <td colSpan="4" className="py-3 px-3 text-right">
                            Subtotal Apurado:
                          </td>
                          <td className="py-3 px-3 font-black text-slate-900">
                            {formatBRL(totalAuditoriaBaixado)}
                          </td>
                          <td className="py-3 px-3 text-slate-400 font-normal">
                            {extratoAuditoria.length} Liquidações
                          </td>
                          <td className="py-3 px-3 font-black text-emerald-600">
                            {formatBRL(totalAuditoriaComissao)}
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
