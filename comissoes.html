<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neves Pro CRM - Comissões e Metas (Firebase Conectado)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @media print { 
      aside, header, .no-print { display: none !important; } 
      main { padding: 0 !important; } 
      .custom-scrollbar { overflow: visible !important; height: auto !important; }
    }
  </style>

  <!-- Inicialização Modular do Firebase v10 via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",
      storageBucket: "neves-pro-crm-comissoes.firebasestorage.app",
      messagingSenderId: "747505960352",
      appId: "1:747505960352:web:5e7d2d5168a14dbfe490c5",
      measurementId: "G-9CF84R9BWM"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.fb = { collection, onSnapshot, query, orderBy };
      window.dispatchEvent(new Event("firebase-ready"));
      console.log("🔥 Firebase conectado em comissoes.html!");
    } catch (err) {
      console.error("Erro ao inicializar Firebase:", err);
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const ToothWatermark = ({ className = "w-64 h-64 opacity-[0.06]" }) => (
      <svg viewBox="0 0 100 120" className={className} fill="currentColor">
        <path d="M 45 15 C 28 15 15 32 15 55 C 15 78 28 98 42 98 C 48 98 52 82 52 70 C 52 82 56 98 62 98 C 76 98 89 78 89 55 C 89 32 76 15 59 15 C 55 15 52 24 52 24 C 52 24 49 15 45 15 Z" fill="none" stroke="currentColor" strokeWidth="6"/>
        <path d="M 8 52 C 32 78 68 78 92 38" fill="none" stroke="currentColor" strokeWidth="6"/>
        <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" />
      </svg>
    );

    const sellersConfig = [
      {
        cod: "1",
        codeVnd: "VND-01",
        name: "André Luiz Nóbrega Martins",
        meta: 32000,
        rates: {
          regular: 3.0,
          bom: 3.5,
          otimo: 4.0,
          parcial: 1.5,
          dentistas: 3.0
        }
      },
      {
        cod: "2",
        codeVnd: "VND-02",
        name: "Luis Daniel da Silva",
        meta: 30000,
        rates: {
          regular: 2.0,
          bom: 2.5,
          otimo: 3.0,
          parcial: 1.5,
          dentistas: 4.0
        }
      }
    ];

    function App() {
      const [commissionMonth, setCommissionMonth] = useState('2026-11');
      const [compareMoM, setCompareMoM] = useState(true);
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [firebaseStatus, setFirebaseStatus] = useState('Conectando...');
      const [selectedSellerFilter, setSelectedSellerFilter] = useState('all');

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Conexão em Tempo Real com o Firebase Firestore
      useEffect(() => {
        const startListener = () => {
          if (!window.db || !window.fb) return;
          setFirebaseStatus('Online');

          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const q = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));

            const unsubscribe = window.fb.onSnapshot(q, (snapshot) => {
              const docsList = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setSales(docsList);
              setLoading(false);
            }, (error) => {
              console.error("Erro no listener de comissões:", error);
              setFirebaseStatus('Erro de Regras');
              setLoading(false);
            });

            return unsubscribe;
          } catch (e) {
            console.error("Falha ao configurar Firestore:", e);
            setFirebaseStatus('Offline');
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListener();
        } else {
          window.addEventListener("firebase-ready", startListener);
          return () => window.removeEventListener("firebase-ready", startListener);
        }
      }, []);

      // Mês Anterior para Comparativo MoM
      const previousMonth = useMemo(() => {
        const [y, m] = commissionMonth.split('-').map(Number);
        const prevDate = new Date(y, m - 2, 1);
        const prevY = prevDate.getFullYear();
        const prevM = String(prevDate.getMonth() + 1).padStart(2, '0');
        return `${prevY}-${prevM}`;
      }, [commissionMonth]);

      // Função de cálculo de taxa por venda
      const getCommissionRate = (seller, tipoVenda, pctMeta) => {
        if (!seller) return 3.0;
        if (tipoVenda === 'PARCIAL') return seller.rates.parcial;
        if (tipoVenda === 'DENTISTAS') return seller.rates.dentistas;

        // Escalonamento por Meta
        if (pctMeta >= 100) return seller.rates.otimo;
        if (pctMeta >= 75) return seller.rates.bom;
        return seller.rates.regular;
      };

      // Apuração dos Dados do Mês Atual
      const currentMonthAudit = useMemo(() => {
        let totalBruto = 0;
        let totalLiquidado = 0;
        let totalComissao = 0;

        // Extrato detalhado de cada parcela baixada
        const baixas = [];

        sales.forEach(sale => {
          const saleVal = Number(sale.amount) || 0;
          const isSaleMonth = sale.date && sale.date.startsWith(commissionMonth);
          if (isSaleMonth) {
            totalBruto += saleVal;
          }

          // Analisa parcelas baixadas neste mês
          (sale.installments || []).forEach(inst => {
            const payDate = inst.paymentDate || (inst.status === 'Pago' ? sale.date : null);
            if (inst.status === 'Pago' && payDate && payDate.startsWith(commissionMonth)) {
              const instAmt = Number(inst.amount) || 0;
              totalLiquidado += instAmt;

              const sellerObj = sellersConfig.find(s => s.cod === sale.codVendedor || s.name === sale.salesperson);
              const rate = getCommissionRate(sellerObj, sale.tipoVenda, 50); // Base padrão regular
              const comissaoGerada = instAmt * (rate / 100);
              totalComissao += comissaoGerada;

              baixas.push({
                saleId: sale.id,
                dav: sale.dav,
                client: sale.client,
                salesperson: sale.salesperson || sellerObj?.name || 'Vendedor',
                codVendedor: sale.codVendedor || sellerObj?.cod,
                tipoVenda: sale.tipoVenda,
                instNumber: inst.number,
                instAmount: instAmt,
                payDate: payDate,
                rate: rate,
                comissao: comissaoGerada
              });
            }
          });
        });

        return { totalBruto, totalLiquidado, totalComissao, baixas };
      }, [sales, commissionMonth]);

      // Apuração do Mês Anterior para MoM
      const prevMonthAudit = useMemo(() => {
        let bruto = 0, liquidado = 0;
        sales.forEach(sale => {
          if (sale.date && sale.date.startsWith(previousMonth)) {
            bruto += Number(sale.amount) || 0;
          }
          (sale.installments || []).forEach(inst => {
            const payDate = inst.paymentDate || (inst.status === 'Pago' ? sale.date : null);
            if (inst.status === 'Pago' && payDate && payDate.startsWith(previousMonth)) {
              liquidado += Number(inst.amount) || 0;
            }
          });
        });
        return { bruto, liquidado };
      }, [sales, previousMonth]);

      const growthMoM = useMemo(() => {
        if (prevMonthAudit.bruto === 0) return '+100%';
        const diff = ((currentMonthAudit.totalBruto - prevMonthAudit.bruto) / prevMonthAudit.bruto) * 100;
        return `${diff >= 0 ? '+' : ''}${diff.toFixed(1)}%`;
      }, [currentMonthAudit.totalBruto, prevMonthAudit.bruto]);

      // Resumo individual por vendedor
      const sellerStats = useMemo(() => {
        return sellersConfig.map(s => {
          let brutoVendedor = 0;
          let liquidadoVendedor = 0;
          let comissaoVendedor = 0;
          let countDAVs = 0;

          sales.forEach(sale => {
            const match = sale.codVendedor === s.cod || sale.salesperson === s.name;
            if (match && sale.date && sale.date.startsWith(commissionMonth)) {
              brutoVendedor += Number(sale.amount) || 0;
              countDAVs++;
            }
          });

          currentMonthAudit.baixas.forEach(b => {
            if (b.codVendedor === s.cod || b.salesperson === s.name) {
              liquidadoVendedor += b.instAmount;
              comissaoVendedor += b.comissao;
            }
          });

          const pctMeta = Math.min(100, (brutoVendedor / s.meta) * 100);

          return {
            ...s,
            bruto: brutoVendedor,
            liquidado: liquidadoVendedor,
            comissao: comissaoVendedor,
            davs: countDAVs,
            pctMeta: pctMeta
          };
        });
      }, [sales, commissionMonth, currentMonthAudit.baixas]);

      const filteredBaixas = useMemo(() => {
        if (selectedSellerFilter === 'all') return currentMonthAudit.baixas;
        return currentMonthAudit.baixas.filter(b => b.codVendedor === selectedSellerFilter);
      }, [currentMonthAudit.baixas, selectedSellerFilter]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* SIDEBAR COM LINKS EXTERNOS */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-slate-300 flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden">
            <div className="absolute -bottom-12 -right-12 pointer-events-none text-white/5 w-64 h-64">
              <ToothWatermark className="w-full h-full" />
            </div>

            <div>
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">TO</div>
                  <div>
                    <h1 className="text-white font-bold text-sm leading-tight">Teles Odonto</h1>
                    <p className="text-[10px] text-indigo-400 font-semibold tracking-wider uppercase">Neves Pro CRM</p>
                  </div>
                </div>
              </div>

              <div className="px-4 py-5">
                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>
                <nav className="space-y-1">
                  <a href="index.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 transition">
                    <i data-lucide="layout-grid" className="w-4 h-4"></i>
                    <span>Página Inicial</span>
                  </a>
                  <a href="vendas.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 transition">
                    <i data-lucide="shopping-cart" className="w-4 h-4"></i>
                    <span>Página de Vendas</span>
                  </a>
                  <a href="comissoes.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold bg-indigo-700 text-white shadow-md">
                    <i data-lucide="briefcase" className="w-4 h-4"></i>
                    <span>Comissões</span>
                  </a>
                </nav>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800 relative z-10 space-y-3">
              <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center text-xs font-bold">OP</div>
                <div className="truncate">
                  <p className="text-xs font-bold text-slate-200">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400">operador@nevespro.com</p>
                </div>
              </div>
              <div className="text-[9px] text-slate-500 text-center leading-tight">
                <p>Neves Pro CRM, Todos os Direitos Reservado</p>
                <p className="text-indigo-400 font-semibold mt-0.5">Por Daniel Silva</p>
              </div>
            </div>
          </aside>

          {/* ÁREA PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            {/* TOPBAR */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Neves Pro CRM</span>
                <span>&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2 py-0.5 rounded-full">Comissões & Metas</span>
              </div>
              <div className="flex items-center gap-3">
                <span className={`px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 border ${
                  firebaseStatus === 'Online' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                  firebaseStatus === 'Conectando...' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                  'bg-rose-50 text-rose-700 border-rose-200'
                }`}>
                  <span className={`w-2 h-2 rounded-full ${
                    firebaseStatus === 'Online' ? 'bg-emerald-500 animate-pulse' :
                    firebaseStatus === 'Conectando...' ? 'bg-amber-500 animate-ping' :
                    'bg-rose-500'
                  }`}></span>
                  ● FIREBASE: {firebaseStatus}
                </span>
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs">D</div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              {/* Header do Módulo & Seletor de Ciclo */}
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                  <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full uppercase">
                    MÓDULO FINANCEIRO • APURAÇÃO AUTOMÁTICA EM NUVEM
                  </span>
                  <h2 className="text-xl font-bold text-slate-900 mt-1">Comissões e Metas de Vendedores</h2>
                  <p className="text-xs text-slate-400">Base calculada exclusivamente sobre valores efetivamente liquidados</p>
                </div>
                <div className="flex flex-wrap items-center gap-3 no-print">
                  <input 
                    type="month" 
                    value={commissionMonth} 
                    onChange={e => setCommissionMonth(e.target.value)} 
                    className="bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl border-none outline-none shadow-sm cursor-pointer" 
                  />
                  <label className="flex items-center gap-1.5 text-xs text-slate-600 font-semibold cursor-pointer bg-white border px-3 py-2 rounded-xl shadow-sm">
                    <input type="checkbox" checked={compareMoM} onChange={e => setCompareMoM(e.target.checked)} className="rounded text-indigo-600" />
                    Comparar MoM
                  </label>
                  <button onClick={() => window.print()} className="bg-[#1a202c] hover:bg-black text-white font-bold text-xs px-4 py-2 rounded-xl shadow-sm transition">
                    🖨 Imprimir Extrato
                  </button>
                </div>
              </div>

              {compareMoM && (
                <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs px-4 py-2.5 rounded-xl font-bold flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Modo Comparativo Ativo • {commissionMonth} vs. {previousMonth}</span>
                  </div>
                  <span className="text-emerald-700 font-black">Crescimento Faturado: {growthMoM}</span>
                </div>
              )}

              {/* 4 Cards Macro com Dados em Tempo Real do Banco */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">Faturamento Bruto ({commissionMonth})</span>
                  <p className="text-2xl font-black text-slate-900 mt-1">R$ {currentMonthAudit.totalBruto.toFixed(2)}</p>
                  <span className="text-xs text-emerald-600 font-semibold mt-1 block">MoM: {growthMoM}</span>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">Total Liquidado (Baixado)</span>
                  <p className="text-2xl font-black text-emerald-600 mt-1">R$ {currentMonthAudit.totalLiquidado.toFixed(2)}</p>
                  <span className="text-xs text-slate-400 mt-1 block">Base de cálculo da comissão</span>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">Comissão Total Apurada</span>
                  <p className="text-2xl font-black text-indigo-700 mt-1">R$ {currentMonthAudit.totalComissao.toFixed(2)}</p>
                  <span className="text-xs text-indigo-600 font-semibold mt-1 block">{currentMonthAudit.baixas.length} baixa(s) auditadas</span>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">Vendedores com Baixas</span>
                  <p className="text-2xl font-black text-slate-900 mt-1">2 Vendedores</p>
                  <span className="text-xs text-purple-600 font-semibold mt-1 block">Escalonamento ativo</span>
                </div>
              </div>

              {/* Cards de Desempenho e Metas por Vendedor */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {sellerStats.map(s => (
                  <div key={s.cod} className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4 relative overflow-hidden">
                    <div className="flex justify-between items-start">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-[10px] bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded-full">{s.codeVnd}</span>
                          <span className="text-xs font-semibold text-slate-400">{s.davs} venda(s) no mês</span>
                        </div>
                        <h3 className="font-extrabold text-slate-900 text-base mt-1">{s.name}</h3>
                      </div>
                      <span className="text-xs bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-full">Ativo</span>
                    </div>

                    {/* Resumo Financeiro do Vendedor */}
                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <span className="text-[10px] text-slate-400 block font-bold">FATURADO</span>
                        <b className="text-slate-900">R$ {s.bruto.toFixed(2)}</b>
                      </div>
                      <div className="bg-emerald-50/70 p-2.5 rounded-xl border border-emerald-100">
                        <span className="text-[10px] text-emerald-700 block font-bold">BAIXADO</span>
                        <b className="text-emerald-700">R$ {s.liquidado.toFixed(2)}</b>
                      </div>
                      <div className="bg-indigo-50/70 p-2.5 rounded-xl border border-indigo-100">
                        <span className="text-[10px] text-indigo-700 block font-bold">COMISSÃO</span>
                        <b className="text-indigo-700">R$ {s.comissao.toFixed(2)}</b>
                      </div>
                    </div>

                    {/* Escala de Alíquotas */}
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                      <span className="text-[10px] font-bold text-slate-500 uppercase block mb-1.5">Tabela de Percentuais Aplicados</span>
                      <div className="flex justify-between text-xs text-slate-600">
                        <span>Regular: <b>{s.rates.regular}%</b></span>
                        <span>Bom: <b>{s.rates.bom}%</b></span>
                        <span>Ótimo: <b>{s.rates.otimo}%</b></span>
                        <span>Parcial: <b>{s.rates.parcial}%</b></span>
                        {s.rates.dentistas && <span>Dentistas: <b>{s.rates.dentistas}%</b></span>}
                      </div>
                    </div>

                    {/* Barra de Progresso da Meta */}
                    <div className="space-y-1.5 text-xs">
                      <div className="flex justify-between font-semibold">
                        <span className="text-slate-500">Progresso da Meta (R$ {s.meta.toLocaleString('pt-BR')})</span>
                        <span className="text-indigo-700 font-bold">{s.pctMeta.toFixed(1)}%</span>
                      </div>
                      <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                        <div 
                          className="bg-indigo-700 h-full rounded-full transition-all duration-500" 
                          style={{ width: `${s.pctMeta}%` }}
                        ></div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Tabela de Auditoria e Extrato Linha a Linha das Baixas */}
              <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-4">
                  <div>
                    <h3 className="font-bold text-sm text-slate-900">Extrato de Auditoria de Comissões • Baixas Efetivas</h3>
                    <p className="text-xs text-slate-400">Detalhamento de cada recebimento com a regra e alíquota apurada</p>
                  </div>
                  <div className="flex items-center gap-2 no-print">
                    <span className="text-xs text-slate-500 font-medium">Filtrar Vendedor:</span>
                    <select 
                      value={selectedSellerFilter} 
                      onChange={e => setSelectedSellerFilter(e.target.value)} 
                      className="text-xs border rounded-xl px-3 py-1.5 bg-slate-50 outline-none font-semibold text-slate-700"
                    >
                      <option value="all">Todos os Vendedores</option>
                      {sellersConfig.map(s => <option key={s.cod} value={s.cod}>{s.name}</option>)}
                    </select>
                  </div>
                </div>

                {loading ? (
                  <div className="py-12 text-center text-xs text-slate-400">
                    <div className="w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                    Carregando apuração do Firebase...
                  </div>
                ) : filteredBaixas.length === 0 ? (
                  <div className="py-12 text-center text-xs text-slate-400 bg-slate-50 rounded-xl border border-dashed">
                    Nenhuma parcela com baixa registrada no mês de {commissionMonth}. 
                    Faça uma amortização ou baixa em <a href="vendas.html" className="text-indigo-600 underline font-semibold">Página de Vendas</a> para ver a comissão aparecer aqui!
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 uppercase text-[10px]">
                        <tr>
                          <th className="py-2.5 px-3">DAV / PARC</th>
                          <th className="py-2.5 px-3">CLIENTE</th>
                          <th className="py-2.5 px-3">VENDEDOR</th>
                          <th className="py-2.5 px-3">DATA BAIXA</th>
                          <th className="py-2.5 px-3">VALOR BAIXADO</th>
                          <th className="py-2.5 px-3">REGRA APLICADA</th>
                          <th className="py-2.5 px-3 text-right">COMISSÃO GERADA</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredBaixas.map((b, idx) => (
                          <tr key={`${b.saleId}-${b.instNumber}-${idx}`} className="hover:bg-slate-50 transition">
                            <td className="py-3 px-3 font-bold text-indigo-700">#{b.dav} (P.{b.instNumber})</td>
                            <td className="py-3 px-3 font-semibold text-slate-800">{b.client}</td>
                            <td className="py-3 px-3 text-slate-600">{b.salesperson}</td>
                            <td className="py-3 px-3 text-slate-500">{b.payDate}</td>
                            <td className="py-3 px-3 font-bold text-slate-900">R$ {b.instAmount.toFixed(2)}</td>
                            <td className="py-3 px-3">
                              <span className="bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded-full text-[10px]">
                                {b.tipoVenda} ({b.rate.toFixed(1)}%)
                              </span>
                            </td>
                            <td className="py-3 px-3 text-right font-black text-emerald-600 text-sm">
                              R$ {b.comissao.toFixed(2)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
