<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teles Odonto - Comissões & Metas de Vendedores</title>

  <!-- Tipografia Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel para execução autônoma no navegador -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf8ff; color: #1e1b4b; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f2f3ff; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c5c6d0; border-radius: 4px; }
    .watermark-bg {
      background-image: url('Design sem nome (28).png');
      background-repeat: no-repeat;
      background-position: right -20px bottom -20px;
      background-size: 240px;
    }
  </style>

  <!-- Firebase Firestore com Busca Única Protegida (Anti-Loop) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      getDocs, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",
      storageBucket: "neves-pro-crm-comissoes.firebasestorage.app",
      messagingSenderId: "747505960352",
      appId: "1:747505960352:web:5e7d2d5168a14dbfe490c5",
      measurementId: "G-9CF84R9BWM"
    };

    try {
      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.fb = { collection, doc, setDoc, addDoc, updateDoc, deleteDoc, getDocs, query, orderBy };
      window.dispatchEvent(new Event("firebase-ready"));
      console.log("🔥 Firebase conectado com busca protegida no comissoes.html!");
    } catch (err) {
      console.warn("Aviso na inicialização do Firebase no comissoes.html:", err);
    }
  </script>
</head>
<body class="min-h-screen bg-[#faf8ff] antialiased text-[#1e1b4b]">
  <div id="root">
    <!-- Fallback seguro para evitar tela em branco -->
    <div class="flex items-center justify-center min-h-screen p-8 text-center text-slate-500">
      <div class="space-y-3">
        <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="font-bold text-sm text-slate-800">Carregando Painel de Comissões Teles Odonto...</p>
        <p class="text-xs text-slate-400">Apurando vendas brutas e metas por vendedor.</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const formatBRL = (val) => {
      const n = Number(val) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    // Vendedores oficiais auditados e suas regras de comissionamento padrão
    const initialVendedoresConfig = [
      { 
        code: "VND-01", 
        name: "André Luiz Nóbrega Martins", 
        initials: "AL",
        metaMensal: 35000.00,
        taxas: { TOTAL: 2.5, PARCIAL: 2.0, DENTISTAS: 1.5 }
      },
      { 
        code: "VND-02", 
        name: "Luis Daniel da Silva", 
        initials: "LD",
        metaMensal: 30000.00,
        taxas: { TOTAL: 2.5, PARCIAL: 2.0, DENTISTAS: 1.5 }
      }
    ];

    // Lançamentos originais conciliados para referência imediata
    const initialSalesSeed = [
      {
        id: "seed-1",
        dav: "48911",
        codCliente: "CLI-088",
        client: "Laboratório Dental Sorriso",
        salesperson: "André Luiz Nóbrega Martins",
        salespersonCode: "VND-01",
        amount: 1600.00,
        tipoVenda: "TOTAL",
        date: "2026-11-04",
        dateDisplay: "04/11/2026",
        status: "Pago",
        isPaid: true,
        installments: [
          { number: 1, dueDate: "04/11/2026", amount: 1600.00, status: "Pago" }
        ]
      },
      {
        id: "seed-2",
        dav: "48919",
        codCliente: "CLI-093",
        client: "Implantes & Próteses Vitória",
        salesperson: "Luis Daniel da Silva",
        salespersonCode: "VND-02",
        amount: 3100.00,
        tipoVenda: "PARCIAL",
        date: "2026-11-09",
        dateDisplay: "09/11/2026",
        status: "Em aberto",
        isPaid: false,
        installments: [
          { number: 1, dueDate: "09/12/2026", amount: 1550.00, status: "Em aberto" },
          { number: 2, dueDate: "09/01/2027", amount: 1550.00, status: "Em aberto" }
        ]
      },
      {
        id: "seed-3",
        dav: "48921",
        codCliente: "CLI-112",
        client: "Consultório Dr. Marcelo Ramos",
        salesperson: "André Luiz Nóbrega Martins",
        salespersonCode: "VND-01",
        amount: 940.00,
        tipoVenda: "DENTISTAS",
        date: "2026-11-11",
        dateDisplay: "11/11/2026",
        status: "Em aberto",
        isPaid: false,
        installments: [
          { number: 1, dueDate: "11/12/2026", amount: 940.00, status: "Em aberto" }
        ]
      }
    ];

    function App() {
      const [sales, setSales] = useState(() => {
        try {
          const cached = localStorage.getItem('neves_crm_sales_cache');
          return cached ? JSON.parse(cached) : initialSalesSeed;
        } catch {
          return initialSalesSeed;
        }
      });

      const [loading, setLoading] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [vendedorFiltro, setVendedorFiltro] = useState('TODOS');
      const carregouRef = useRef(false);

      const renderIcons = () => {
        try {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
          }
        } catch (e) {}
      };

      useEffect(() => {
        renderIcons();
      });

      // Busca única no Firebase Firestore via getDocs (Anti-Loop protegido)
      const buscarDadosUmaVez = async (isManual = false) => {
        if (!window.db || !window.fb) return;

        try {
          if (isManual) setRefreshing(true);
          else setLoading(true);

          const qVendas = window.fb.query(
            window.fb.collection(window.db, "vendas"),
            window.fb.orderBy("date", "desc")
          );
          const snapVendas = await window.fb.getDocs(qVendas);
          if (!snapVendas.empty) {
            const listaVendas = snapVendas.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setSales(listaVendas);
            try {
              localStorage.setItem('neves_crm_sales_cache', JSON.stringify(listaVendas));
            } catch (e) {}
          }
        } catch (e) {
          console.warn("Aviso na busca do comissoes.html:", e);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      // Dispara estritamente 1 vez no carregamento
      useEffect(() => {
        if (carregouRef.current) return;
        carregouRef.current = true;

        if (window.db && window.fb) {
          buscarDadosUmaVez();
        } else {
          window.addEventListener("firebase-ready", () => buscarDadosUmaVez(), { once: true });
        }
      }, []);

      // Apuração completa de Vendas Brutas e Comissões por Vendedor
      const apuracaoVendedores = useMemo(() => {
        return initialVendedoresConfig.map(vend => {
          const vendasDoVendedor = sales.filter(s => {
            const matchCode = s.salespersonCode === vend.code;
            const matchNome = s.salesperson && s.salesperson.toLowerCase().includes(vend.name.split(' ')[0].toLowerCase());
            return matchCode || matchNome;
          });

          let vendasBrutasTotal = 0;
          let vendasBaixadasTotal = 0;
          let comissaoLiberada = 0;
          let comissaoProjetada = 0;

          const detalhesPorCategoria = {
            TOTAL: { volume: 0, taxa: vend.taxas.TOTAL, comissao: 0 },
            PARCIAL: { volume: 0, taxa: vend.taxas.PARCIAL, comissao: 0 },
            DENTISTAS: { volume: 0, taxa: vend.taxas.DENTISTAS, comissao: 0 }
          };

          vendasDoVendedor.forEach(v => {
            const valorVenda = Number(v.amount) || 0;
            const cat = (v.tipoVenda || 'TOTAL').toUpperCase();
            vendasBrutasTotal += valorVenda;

            const taxaAplicada = (detalhesPorCategoria[cat] ? detalhesPorCategoria[cat].taxa : 2.0) / 100;

            if (detalhesPorCategoria[cat]) {
              detalhesPorCategoria[cat].volume += valorVenda;
            }

            // Cálculo das comissões pelas parcelas adimplidas vs em aberto
            (v.installments || []).forEach(inst => {
              const valorParcela = Number(inst.amount) || 0;
              const comissaoParcela = valorParcela * taxaAplicada;

              if (inst.status === 'Pago') {
                vendasBaixadasTotal += valorParcela;
                comissaoLiberada += comissaoParcela;
                if (detalhesPorCategoria[cat]) {
                  detalhesPorCategoria[cat].comissao += comissaoParcela;
                }
              } else {
                comissaoProjetada += comissaoParcela;
              }
            });
          });

          const percentualMeta = vend.metaMensal > 0 ? (vendasBrutasTotal / vend.metaMensal) * 100 : 0;

          return {
            ...vend,
            vendasCount: vendasDoVendedor.length,
            vendas: vendasDoVendedor,
            vendasBrutasTotal,
            vendasBaixadasTotal,
            comissaoLiberada,
            comissaoProjetada,
            comissaoGeralPotencial: comissaoLiberada + comissaoProjetada,
            percentualMeta,
            detalhesPorCategoria
          };
        });
      }, [sales]);

      // Totais consolidados gerais da empresa
      const totaisGerais = useMemo(() => {
        let totalBruto = 0;
        let totalBaixado = 0;
        let totalComissaoPaga = 0;
        let totalComissaoPendente = 0;

        apuracaoVendedores.forEach(v => {
          totalBruto += v.vendasBrutasTotal;
          totalBaixado += v.vendasBaixadasTotal;
          totalComissaoPaga += v.comissaoLiberada;
          totalComissaoPendente += v.comissaoProjetada;
        });

        return {
          totalBruto,
          totalBaixado,
          totalComissaoPaga,
          totalComissaoPendente
        };
      }, [apuracaoVendedores]);

      const vendedoresExibidos = useMemo(() => {
        if (vendedorFiltro === 'TODOS') return apuracaoVendedores;
        return apuracaoVendedores.filter(v => v.code === vendedorFiltro);
      }, [apuracaoVendedores, vendedorFiltro]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* BARRA LATERAL INSTITUCIONAL OFICIAL (NAV ESQUERDA) */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-white flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden select-none border-r border-slate-800" id="app-sidebar">
            
            {/* MARCA D'ÁGUA SUAVE NO FUNDO DA SIDEBAR */}
            <div className="absolute -bottom-8 -right-8 w-56 h-56 pointer-events-none opacity-[0.045] brightness-200">
              <img src="Design sem nome (28).png" alt="Marca d'água Teles Odonto" className="w-full h-full object-contain filter invert" />
            </div>

            <div className="relative z-10">
              {/* LOGOMARCA PRINCIPAL OFICIAL */}
              <div className="p-6 border-b border-slate-800/80 flex flex-col gap-2">
                <div className="flex items-center gap-2">
                  <img src="Imagem RGB branco 3 - fundo transparente PNG.png" alt="Teles Odonto - Materiais Protéticos" className="h-9 w-auto object-contain" />
                </div>
                <div className="flex items-center justify-between mt-1 px-2 py-0.5 rounded bg-slate-800/60 border border-slate-700/50">
                  <span className="text-[11px] font-medium text-slate-300">Neves Pro CRM</span>
                  <span className="text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">Módulo Ativo</span>
                </div>
              </div>

              {/* LINKS DE NAVEGAÇÃO */}
              <div className="px-4 py-6 space-y-1.5">
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>

                <a href="index.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="layout-grid" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página Inicial</span>
                </a>

                <a href="vendas.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="shopping-cart" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página de Vendas</span>
                </a>

                <a href="comissoes.html" className="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
                  <i data-lucide="briefcase" className="w-4 h-4 text-white"></i>
                  <span>Comissões</span>
                </a>
              </div>
            </div>

            {/* OPERADOR COMERCIAL NO RODAPÉ */}
            <div className="p-4 border-t border-slate-800/80 bg-slate-900/60 relative z-10">
              <div className="flex items-center gap-3 p-2 rounded-xl bg-slate-800/40 border border-slate-700/40">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow">
                  OP
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-semibold text-white truncate">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400 truncate">operador@salespro.com</p>
                </div>
                <div className="w-2 h-2 rounded-full bg-emerald-400 shrink-0 ring-4 ring-emerald-500/20"></div>
              </div>
              <p className="text-[10px] text-slate-500 text-center mt-3">© 2026 Neves Pro CRM</p>
            </div>
          </aside>

          {/* ÁREA CENTRAL DE CONTEÚDO */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            
            {/* TOPBAR LIMPO */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Teles Odonto</span>
                <span className="text-slate-400">&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  Comissões & Metas de Vendedores
                </span>
              </div>

              <div className="flex items-center gap-4">
                <button
                  onClick={() => buscarDadosUmaVez(true)}
                  disabled={refreshing || loading}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 text-xs font-semibold flex items-center gap-1.5 transition disabled:opacity-50"
                  title="Atualizar dados do Firebase sob demanda"
                >
                  <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 ${refreshing ? 'animate-spin text-indigo-600' : ''}`}></i>
                  <span>{refreshing ? 'Atualizando...' : 'Atualizar Dados'}</span>
                </button>

                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  ● SISTEMA ONLINE
                </span>
                
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                  OP
                </div>
              </div>
            </header>

            {/* CONTAINER DAS SEÇÕES */}
            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              
              {/* CAIXA DE CONTROLE E VENDAS BRUTAS GERAIS NO TOPO COM MARCA D'ÁGUA */}
              <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 watermark-bg relative">
                <div>
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100">
                    Fechamento de Comissões • Novembro 2026
                  </span>
                  <h2 className="text-xl font-black text-slate-900 mt-2">Painel de Metas & Apuração de Comissões</h2>
                  <p className="text-xs text-slate-400 mt-0.5">
                    Acompanhamento em tempo real das vendas brutas gerais e liquidações por vendedor titular.
                  </p>
                </div>

                <div className="flex items-center gap-3">
                  <select 
                    value={vendedorFiltro} 
                    onChange={e => setVendedorFiltro(e.target.value)}
                    className="p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-600/30"
                  >
                    <option value="TODOS">Todos os Vendedores</option>
                    <option value="VND-01">André Luiz Nóbrega Martins</option>
                    <option value="VND-02">Luis Daniel da Silva</option>
                  </select>

                  <button 
                    onClick={() => window.print()}
                    className="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center gap-1.5 transition shadow-sm"
                  >
                    <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                    <span>Exportar</span>
                  </button>
                </div>
              </div>

              {/* 4 CARDS DE INDICADORES CONSOLIDADOS */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">VENDAS BRUTAS GERAIS</span>
                    <div className="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                      <i data-lucide="trending-up" className="w-4 h-4"></i>
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-slate-900 mt-2">{formatBRL(totaisGerais.totalBruto)}</h3>
                  <p className="text-[11px] text-slate-400 mt-1">Volume total emitido em DAVs</p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">COMISSÃO LIBERADA</span>
                    <div className="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                      <i data-lucide="check-circle-2" className="w-4 h-4"></i>
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-emerald-600 mt-2">{formatBRL(totaisGerais.totalComissaoPaga)}</h3>
                  <p className="text-[11px] text-slate-400 mt-1">
                    Sobre <strong className="text-slate-700">{formatBRL(totaisGerais.totalBaixado)}</strong> baixados
                  </p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">COMISSÃO A LIBERAR</span>
                    <div className="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                      <i data-lucide="clock" className="w-4 h-4"></i>
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-amber-600 mt-2">{formatBRL(totaisGerais.totalComissaoPendente)}</h3>
                  <p className="text-[11px] text-slate-400 mt-1">Vinculado a parcelas em aberto</p>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">POTENCIAL CONSOLIDADO</span>
                    <div className="w-8 h-8 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center">
                      <i data-lucide="award" className="w-4 h-4"></i>
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-purple-700 mt-2">
                    {formatBRL(totaisGerais.totalComissaoPaga + totaisGerais.totalComissaoPendente)}
                  </h3>
                  <p className="text-[11px] text-slate-400 mt-1">Total apurado do período</p>
                </div>

              </div>

              {/* CARDS INDIVIDUAIS DE CADA VENDEDOR COM MARCA D'ÁGUA */}
              <div className="space-y-6">
                {vendedoresExibidos.map(vend => (
                  <div key={vend.code} className="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-5 watermark-bg relative">
                    
                    {/* TOPO DO CARD DO VENDEDOR */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-4">
                      <div className="flex items-center gap-3">
                        <div className="w-12 h-12 rounded-2xl bg-indigo-600 text-white font-black text-base flex items-center justify-center shadow-md shadow-indigo-600/20">
                          {vend.initials || 'AL'}
                        </div>
                        <div>
                          <div className="flex items-center gap-2">
                            <h3 className="font-extrabold text-base text-slate-900">{vend.name}</h3>
                            <span className="text-[10px] font-mono font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200">
                              {vend.code}
                            </span>
                          </div>
                          <p className="text-xs text-slate-400 mt-0.5">
                            {vend.vendasCount} venda(s) lançada(s) no período vigente
                          </p>
                        </div>
                      </div>

                      {/* PROGRESSO DA META */}
                      <div className="w-full sm:w-64 space-y-1.5">
                        <div className="flex justify-between text-xs font-bold">
                          <span className="text-slate-500">Meta: {formatBRL(vend.metaMensal)}</span>
                          <span className={`${vend.percentualMeta >= 100 ? 'text-emerald-600' : 'text-indigo-600'}`}>
                            {vend.percentualMeta.toFixed(1)}% atingido
                          </span>
                        </div>
                        <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
                          <div 
                            className={`h-full rounded-full transition-all duration-500 ${
                              vend.percentualMeta >= 100 ? 'bg-emerald-500' : 'bg-indigo-600'
                            }`}
                            style={{ width: `${Math.min(vend.percentualMeta, 100)}%` }}
                          ></div>
                        </div>
                      </div>
                    </div>

                    {/* VALORES E RESUMO DE COMISSÕES */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                      
                      <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200/80">
                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Vendas Brutas</span>
                        <strong className="text-lg font-black text-slate-900 mt-1 block">
                          {formatBRL(vend.vendasBrutasTotal)}
                        </strong>
                        <span className="text-[11px] text-slate-500 mt-0.5 block">
                          Total vendido em DAVs
                        </span>
                      </div>

                      <div className="p-4 rounded-2xl bg-emerald-50/60 border border-emerald-100">
                        <span className="text-[10px] font-bold text-emerald-700 uppercase tracking-wider block">Comissão Liberada</span>
                        <strong className="text-lg font-black text-emerald-700 mt-1 block">
                          {formatBRL(vend.comissaoLiberada)}
                        </strong>
                        <span className="text-[11px] text-emerald-600 mt-0.5 block">
                          Disponível para pagamento
                        </span>
                      </div>

                      <div className="p-4 rounded-2xl bg-amber-50/60 border border-amber-100">
                        <span className="text-[10px] font-bold text-amber-700 uppercase tracking-wider block">Comissão a Liberar</span>
                        <strong className="text-lg font-black text-amber-700 mt-1 block">
                          {formatBRL(vend.comissaoProjetada)}
                        </strong>
                        <span className="text-[11px] text-amber-600 mt-0.5 block">
                          Aguardando liquidação de parcelas
                        </span>
                      </div>

                    </div>

                    {/* APURAÇÃO POR CATEGORIA DE PRODUTO */}
                    <div className="pt-2">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">
                        Desempenho por Categoria de Venda
                      </span>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                        <div className="p-3 rounded-xl border border-slate-200/80 bg-slate-50/50 flex justify-between items-center">
                          <div>
                            <span className="font-bold text-slate-800 block">TOTAL (Prótese Total)</span>
                            <span className="text-[10px] text-slate-400">Taxa: {vend.taxas.TOTAL}%</span>
                          </div>
                          <div className="text-right">
                            <span className="font-extrabold text-slate-900 block">{formatBRL(vend.detalhesPorCategoria.TOTAL.volume)}</span>
                            <span className="text-[10px] font-bold text-emerald-600">Comissão: {formatBRL(vend.detalhesPorCategoria.TOTAL.comissao)}</span>
                          </div>
                        </div>

                        <div className="p-3 rounded-xl border border-slate-200/80 bg-slate-50/50 flex justify-between items-center">
                          <div>
                            <span className="font-bold text-slate-800 block">PARCIAL (Prótese Parcial)</span>
                            <span className="text-[10px] text-slate-400">Taxa: {vend.taxas.PARCIAL}%</span>
                          </div>
                          <div className="text-right">
                            <span className="font-extrabold text-slate-900 block">{formatBRL(vend.detalhesPorCategoria.PARCIAL.volume)}</span>
                            <span className="text-[10px] font-bold text-emerald-600">Comissão: {formatBRL(vend.detalhesPorCategoria.PARCIAL.comissao)}</span>
                          </div>
                        </div>

                        <div className="p-3 rounded-xl border border-slate-200/80 bg-slate-50/50 flex justify-between items-center">
                          <div>
                            <span className="font-bold text-slate-800 block">DENTISTAS (Clínico)</span>
                            <span className="text-[10px] text-slate-400">Taxa: {vend.taxas.DENTISTAS}%</span>
                          </div>
                          <div className="text-right">
                            <span className="font-extrabold text-slate-900 block">{formatBRL(vend.detalhesPorCategoria.DENTISTAS.volume)}</span>
                            <span className="text-[10px] font-bold text-emerald-600">Comissão: {formatBRL(vend.detalhesPorCategoria.DENTISTAS.comissao)}</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* LISTA DE VENDAS DO VENDEDOR */}
                    {vend.vendas.length > 0 && (
                      <div className="pt-2 border-t border-slate-100">
                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">
                          Lançamentos do Vendedor
                        </span>
                        <div className="divide-y divide-slate-100 text-xs">
                          {vend.vendas.map(v => (
                            <div key={v.id || v.dav} className="py-2 flex justify-between items-center">
                              <div className="flex items-center gap-2">
                                <span className="font-mono font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px]">
                                  DAV #{v.dav}
                                </span>
                                <span className="font-semibold text-slate-800">{v.client}</span>
                                <span className="text-[10px] text-slate-400">({v.dateDisplay || v.date})</span>
                              </div>
                              <div className="flex items-center gap-3">
                                <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-indigo-50 text-indigo-700">
                                  {v.tipoVenda || 'TOTAL'}
                                </span>
                                <strong className="font-black text-slate-900">{formatBRL(v.amount)}</strong>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                  </div>
                ))}
              </div>

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
