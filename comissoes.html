<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const formatBRL = (val) => {
      const n = Number(val) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const initialSellers = [
      {
        id: "vnd-01",
        codeVnd: "VND-01",
        name: "André Luiz Nóbrega Martins",
        shortName: "André Luiz N.",
        role: "Perfil Sênior • Clínicas Especializadas",
        metaMes: 32000.00,
        metaAnterior: 20800.00,
        regras: { regular: 3.0, bom: 3.5, otimo: 4.0, parcial: 1.5, dentistas: 4.0 }
      },
      {
        id: "vnd-02",
        codeVnd: "VND-02",
        name: "Luis Daniel da Silva",
        shortName: "Luis Daniel da Silva",
        role: "Perfil Consultoria • Parcerias Clínicas",
        metaMes: 32000.00,
        metaAnterior: 16700.00,
        regras: { regular: 2.0, bom: 2.5, otimo: 3.0, parcial: 1.5, dentistas: 4.0 }
      }
    ];

    function App() {
      const [sellers, setSellers] = useState(initialSellers);
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filtroOperador, setFiltroOperador] = useState('TODOS');
      const [vendedorSelecionadoExtrato, setVendedorSelecionadoExtrato] = useState("VND-01");

      const [novoVendedor, setNovoVendedor] = useState({
        codeVnd: "03",
        name: "",
        perfil: "Padrão Laboratorial",
        regRegular: "2.5",
        regBom: "3.0",
        regOtimo: "4.0",
        comissaoParcial: true,
        canalDentistas: false
      });

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        const startListeners = () => {
          if (!window.db || !window.fb) return;
          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const qVendas = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));
            window.fb.onSnapshot(qVendas, (snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setSales(list);
              setLoading(false);
            });
          } catch (e) {
            console.error(e);
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListeners();
        } else {
          window.addEventListener("firebase-ready", startListeners);
          return () => window.removeEventListener("firebase-ready", startListeners);
        }
      }, []);

      const relatorioVendedores = useMemo(() => {
        return sellers.map(seller => {
          const vendasDoVendedor = sales.filter(s => {
            const matchNome = s.salesperson && s.salesperson.toLowerCase().includes(seller.name.toLowerCase().split(' ')[0]);
            const matchCod = s.salespersonCode && s.salespersonCode === seller.codeVnd;
            return matchNome || matchCod;
          });

          let totalBruto = 0;
          let totalBaixado = 0;
          let comissaoLiberada = 0;
          let comissaoProjetada = 0;
          let baixasCount = 0;

          vendasDoVendedor.forEach(venda => {
            const valorVenda = Number(venda.amount) || 0;
            totalBruto += valorVenda;

            let taxaPercentual = seller.regras.regular;
            if (venda.tipoVenda === 'PARCIAL') taxaPercentual = seller.regras.parcial;
            else if (venda.tipoVenda === 'DENTISTAS') taxaPercentual = seller.regras.dentistas;

            let baixadoNaVenda = 0;
            (venda.installments || []).forEach(inst => {
              const amt = Number(inst.amount) || 0;
              if (inst.status === 'Pago') {
                baixadoNaVenda += amt;
                baixasCount++;
              }
            });

            totalBaixado += baixadoNaVenda;
            comissaoLiberada += (baixadoNaVenda * (taxaPercentual / 100));
            comissaoProjetada += (valorVenda * (taxaPercentual / 100));
          });

          const aLiquidarAberto = Math.max(0, totalBruto - totalBaixado);
          const percentualMeta = seller.metaMes > 0 ? (totalBruto / seller.metaMes) * 100 : 0;
          const vendasMesAnterior = seller.metaAnterior || 0;
          const crescimentoMoM = vendasMesAnterior > 0 ? ((totalBruto - vendasMesAnterior) / vendasMesAnterior) * 100 : 0;

          return {
            ...seller,
            totalBruto,
            totalBaixado,
            aLiquidarAberto,
            comissaoLiberada,
            comissaoProjetada,
            pedidosCount: vendasDoVendedor.length,
            baixasCount,
            percentualMeta,
            vendasMesAnterior,
            crescimentoMoM
          };
        });
      }, [sellers, sales]);

      const consolidados = useMemo(() => {
        let brutoGeral = 0;
        let baixadoGeral = 0;
        let aLiquidarGeral = 0;
        let comissaoLiberadaGeral = 0;
        let comissaoProjetadaGeral = 0;
        let totalPedidos = 0;
        let totalBaixas = 0;

        relatorioVendedores.forEach(r => {
          brutoGeral += r.totalBruto;
          baixadoGeral += r.totalBaixado;
          aLiquidarGeral += r.aLiquidarAberto;
          comissaoLiberadaGeral += r.comissaoLiberada;
          comissaoProjetadaGeral += r.comissaoProjetada;
          totalPedidos += r.pedidosCount;
          totalBaixas += r.baixasCount;
        });

        const ticketMedio = totalPedidos > 0 ? (brutoGeral / totalPedidos) : 0;
        const totalMesAnterior = 37500.00;
        const variacaoMoM = totalMesAnterior > 0 ? ((brutoGeral - totalMesAnterior) / totalMesAnterior) * 100 : 0;

        return { brutoGeral, baixadoGeral, aLiquidarGeral, comissaoLiberadaGeral, comissaoProjetadaGeral, totalPedidos, totalBaixas, ticketMedio, variacaoMoM };
      }, [relatorioVendedores]);

      const extratoAuditoria = useMemo(() => {
        const sellerAtivo = sellers.find(s => s.codeVnd === vendedorSelecionadoExtrato) || sellers[0];
        if (!sellerAtivo) return [];

        const vendasDoVendedor = sales.filter(s => {
          const matchNome = s.salesperson && s.salesperson.toLowerCase().includes(sellerAtivo.name.toLowerCase().split(' ')[0]);
          const matchCod = s.salespersonCode && s.salespersonCode === sellerAtivo.codeVnd;
          return matchNome || matchCod;
        });

        const itens = [];
        vendasDoVendedor.forEach(venda => {
          let taxa = sellerAtivo.regras.regular;
          let regraNome = `Regular (${taxa.toFixed(1)}%)`;

          if (venda.tipoVenda === 'PARCIAL') {
            taxa = sellerAtivo.regras.parcial;
            regraNome = `Parcial (${taxa.toFixed(1)}%)`;
          } else if (venda.tipoVenda === 'DENTISTAS') {
            taxa = sellerAtivo.regras.dentistas;
            regraNome = `Dentistas (${taxa.toFixed(1)}%)`;
          }

          (venda.installments || []).forEach((inst, idx) => {
            if (inst.status === 'Pago') {
              const valorBaixado = Number(inst.amount) || 0;
              const comissao = valorBaixado * (taxa / 100);

              itens.push({
                dav: venda.dav || `DAV-${venda.id?.slice(0, 4)}`,
                cliente: venda.client || 'Cliente Teles Odonto',
                descricao: venda.description || 'Prótese Odontológica',
                dataBaixa: inst.paidAt ? new Date(inst.paidAt).toLocaleDateString('pt-BR') : inst.dueDate || venda.dateDisplay,
                tipoParcela: (venda.installments.length === 1 && venda.prazo === '0') ? 'À Vista' : `${inst.number || idx + 1}/${venda.installments.length}`,
                valorBaixado: valorBaixado,
                regra: regraNome,
                comissaoGerada: comissao
              });
            }
          });
        });

        return itens;
      }, [sellers, sales, vendedorSelecionadoExtrato]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* BARRA LATERAL UNIFICADA COM LOGO OFICIAL E MARCA D'ÁGUA */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-white flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden select-none border-r border-slate-800" id="app-sidebar">
            <div className="absolute -bottom-10 -right-10 w-56 h-56 pointer-events-none opacity-[0.05] brightness-200">
              <img src="Design sem nome (28).png" alt="Marca d'água Teles Odonto" className="w-full h-full object-contain filter invert" />
            </div>

            <div className="relative z-10">
              <div className="p-6 border-b border-slate-800/80 flex flex-col gap-2">
                <div className="flex items-center gap-2">
                  <img src="Imagem RGB branco 3 - fundo transparente PNG.png" alt="Teles Odonto - Materiais Protéticos" className="h-10 w-auto object-contain" />
                </div>
                <div className="flex items-center justify-between mt-1 px-2 py-1 rounded bg-slate-800/60 border border-slate-700/50">
                  <span className="text-[11px] font-medium text-slate-300">Neves Pro CRM</span>
                  <span className="text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">v2.6 Audited</span>
                </div>
              </div>

              <div className="px-4 py-6 space-y-1.5">
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>

                <a href="index.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="layout-grid" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página Inicial</span>
                </a>

                <a href="vendas.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="shopping-cart" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página de Vendas</span>
                </a>

                <a href="comissoes.html" className="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
                  <i data-lucide="briefcase" className="w-4 h-4 text-white"></i>
                  <span>Comissões</span>
                </a>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800/80 bg-slate-900/60 relative z-10">
              <div className="flex items-center gap-3 p-2 rounded-xl bg-slate-800/40 border border-slate-700/40">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow">
                  OP
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-semibold text-white truncate">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400 truncate">operador@salespro.com</p>
                </div>
                <div className="w-2 h-2 rounded-full bg-emerald-400 shrink-0 ring-4 ring-emerald-500/20"></div>
              </div>
              <p className="text-[10px] text-slate-400 text-center mt-3">© 2026 Neves Pro CRM</p>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            
            {/* TOPBAR LIMPO */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Teles Odonto</span>
                <span className="text-slate-400">&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  Módulo Ativo
                </span>
              </div>

              <div className="flex items-center gap-3">
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  ● SISTEMA ONLINE
                </span>
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                  OP
                </div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              
              {/* CABEÇALHO */}
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold text-indigo-700 uppercase tracking-widest bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                      MÓDULO FINANCEIRO
                    </span>
                    <span className="text-xs text-slate-400">• Ciclo Mensal</span>
                  </div>
                  <h2 className="text-2xl font-black text-slate-900 mt-1">Comissões e Metas de Vendedores</h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Gestão escalonada de comissionamento, apuração por liquidação de títulos e conciliação de metas odontológicas.
                  </p>
                </div>

                <div className="flex items-center gap-2">
                  <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold shadow-xs">
                    <i data-lucide="calendar" className="w-4 h-4 text-indigo-600"></i>
                    <span className="text-slate-500">MÊS:</span>
                    <span className="text-slate-800">Novembro / 2026</span>
                  </div>
                </div>
              </div>

              {/* CARD EXECUTIVO: CONSOLIDADO GERAL */}
              <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 relative overflow-hidden">
                <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600">
                      <i data-lucide="trending-up" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <h3 className="font-extrabold text-sm text-slate-900">Consolidado Geral de Vendas Brutas do Mês</h3>
                      <p className="text-[11px] text-slate-400">Emissão bruta de pedidos/DAVs vs. liquidações efetivas</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-5">
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200/60">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">TOTAL BRUTO FATURADO</span>
                    <p className="text-2xl font-black text-slate-900">{formatBRL(consolidados.brutoGeral)}</p>
                    <p className="text-[11px] text-slate-400 mt-1">{consolidados.totalPedidos} pedidos emitidos</p>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200/60">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">VENDEDORES ATIVOS</span>
                    <p className="text-2xl font-black text-slate-900">{sellers.length} Operadores</p>
                    <p className="text-[11px] text-slate-400 mt-1">100% com emissão</p>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200/60">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">TICKET MÉDIO</span>
                    <p className="text-2xl font-black text-slate-900">{formatBRL(consolidados.ticketMedio)}</p>
                    <p className="text-[11px] text-slate-400 mt-1">Média por pedido</p>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200/60">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">TOTAL LIQUIDADO</span>
                    <p className="text-2xl font-black text-emerald-600">{formatBRL(consolidados.baixadoGeral)}</p>
                    <p className="text-[11px] text-slate-400 mt-1">{consolidados.totalBaixas} baixas pagas</p>
                  </div>
                </div>

                {/* DESEMPENHO INDIVIDUAL */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-5 pt-5 border-t border-slate-100">
                  {relatorioVendedores.map((r, i) => (
                    <div key={r.id} className="p-5 rounded-2xl bg-white border border-slate-200/80 shadow-xs space-y-3">
                      <div className="flex justify-between items-start">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center shrink-0">
                            {r.codeVnd === "VND-01" ? "AL" : "LD"}
                          </div>
                          <div>
                            <h4 className="font-bold text-xs text-slate-900">{r.name}</h4>
                            <p className="text-[10px] text-slate-400">{r.codeVnd} • {r.role}</p>
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-2 py-2 border-y border-slate-100 text-center">
                        <div>
                          <span className="text-[9px] font-bold text-slate-400 uppercase block">VENDAS BRUTAS</span>
                          <span className="text-xs font-black text-slate-900 mt-0.5 block">{formatBRL(r.totalBruto)}</span>
                        </div>
                        <div>
                          <span className="text-[9px] font-bold text-slate-400 uppercase block">LIQUIDADO</span>
                          <span className="text-xs font-black text-emerald-600 mt-0.5 block">{formatBRL(r.totalBaixado)}</span>
                        </div>
                        <div>
                          <span className="text-[9px] font-bold text-slate-400 uppercase block">A LIQUIDAR</span>
                          <span className="text-xs font-black text-indigo-700 mt-0.5 block">{formatBRL(r.aLiquidarAberto)}</span>
                        </div>
                      </div>

                      <div className="flex justify-between items-center text-xs pt-1">
                        <span className="text-slate-500">Comissão Liberada: <strong className="text-slate-900">{formatBRL(r.comissaoLiberada)}</strong></span>
                        <span className="text-slate-500">Projeção: <strong className="text-indigo-700">{formatBRL(r.comissaoProjetada)}</strong></span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* APURAÇÃO INDIVIDUAL DE COMISSÕES */}
              <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-extrabold text-sm text-slate-900">Apuração Individual de Comissões</h3>
                    <p className="text-[11px] text-slate-400">Títulos confirmados e baixados pelo financeiro em Nov/2026</p>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 text-slate-500 uppercase text-[10px]">
                      <tr>
                        <th className="py-2.5 px-3">Cód / Nome</th>
                        <th className="py-2.5 px-3">Vendas Brutas</th>
                        <th className="py-2.5 px-3">Baixas</th>
                        <th className="py-2.5 px-3">Total Liquidado</th>
                        <th className="py-2.5 px-3">Comissão Liberada</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {relatorioVendedores.map((r, i) => (
                        <tr key={r.id} className="hover:bg-slate-50 transition">
                          <td className="py-3 px-3">
                            <span className="font-bold text-slate-900 block">#{i + 1} {r.name}</span>
                            <span className="text-[10px] text-slate-400">{r.codeVnd}</span>
                          </td>
                          <td className="py-3 px-3 font-black text-slate-900">{formatBRL(r.totalBruto)}</td>
                          <td className="py-3 px-3">
                            <span className="font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-full text-[10px]">
                              {r.baixasCount} baixas
                            </span>
                          </td>
                          <td className="py-3 px-3 font-bold text-emerald-600">{formatBRL(r.totalBaixado)}</td>
                          <td className="py-3 px-3 font-black text-slate-900">{formatBRL(r.comissaoLiberada)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* EXTRATO DE AUDITORIA */}
              <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
                <div className="flex justify-between items-center pb-3 border-b">
                  <h3 className="font-extrabold text-sm text-slate-900">Extrato de Auditoria Comercial por Período</h3>
                  <select 
                    value={vendedorSelecionadoExtrato} 
                    onChange={e => setVendedorSelecionadoExtrato(e.target.value)}
                    className="p-1.5 border rounded-xl bg-slate-50 text-xs font-bold outline-none"
                  >
                    {sellers.map(s => <option key={s.id} value={s.codeVnd}>{s.name} ({s.codeVnd})</option>)}
                  </select>
                </div>

                {extratoAuditoria.length === 0 ? (
                  <div className="py-8 text-center text-xs text-slate-400 bg-slate-50 rounded-xl border border-dashed">
                    Nenhuma parcela baixada no momento para este vendedor.
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 uppercase text-[10px]">
                        <tr>
                          <th className="py-2.5 px-3">DAV</th>
                          <th className="py-2.5 px-3">Cliente</th>
                          <th className="py-2.5 px-3">Data Baixa</th>
                          <th className="py-2.5 px-3">Parcela</th>
                          <th className="py-2.5 px-3">Valor Baixado</th>
                          <th className="py-2.5 px-3">Comissão</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {extratoAuditoria.map((item, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 font-mono font-bold text-indigo-700">#{item.dav}</td>
                            <td className="py-2.5 px-3 font-bold text-slate-900">{item.cliente}</td>
                            <td className="py-2.5 px-3 text-slate-600">{item.dataBaixa}</td>
                            <td className="py-2.5 px-3">{item.tipoParcela}</td>
                            <td className="py-2.5 px-3 font-bold text-slate-900">{formatBRL(item.valorBaixado)}</td>
                            <td className="py-2.5 px-3 font-black text-emerald-600">{formatBRL(item.comissaoGerada)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
