  <!-- Tipografia Plus Jakarta Sans -->

  <style>

      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",
      storageBucket: "neves-pro-crm-comissoes.firebasestorage.app",
      messagingSenderId: "747505960352",
      appId: "1:747505960352:web:5e7d2d5168a14dbfe490c5",
      measurementId: "G-9CF84R9BWM"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.fb = { collection, onSnapshot, query, orderBy };

      console.log("🔥 Firebase Firestore conectado em comissoes.html!");
    } catch (err) {
      console.error("Erro ao inicializar Firebase em comissoes.html:", err);
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Marca d'água vetorial oficial Teles Odonto
    const ToothWatermark = ({ className = "w-64 h-64 text-slate-900 opacity-[0.035]" }) => (
      <svg viewBox="0 0 100 120" className={className} fill="currentColor">
        <path d="M 45 15 C 28 15 15 32 15 55 C 15 78 28 98 42 98 C 48 98 52 82 52 70 C 52 82 56 98 62 98 C 76 98 89 78 89 55 C 89 32 76 15 59 15 C 55 15 52 24 52 24 C 52 24 49 15 45 15 Z" fill="none" stroke="currentColor" strokeWidth="6"/>
        <path d="M 8 52 C 32 78 68 78 92 38" fill="none" stroke="currentColor" strokeWidth="6"/>
        <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" />
      </svg>
    );

    const defaultSellersConfig = [
      {
        cod: "1",
        codeVnd: "VND-01",
        initials: "AL",
        name: "André Luiz Nóbrega Martins",
        role: "Representante Comercial",
        statusBadge: "Líder em Emissão",
        meta: 32000,
        rates: {
          regular: 3.0,
          bom: 3.5,
          otimo: 4.0,
          parcial: 1.5,
          dentistas: null
        }
      },
      {
        cod: "2",
        codeVnd: "VND-02",
        initials: "LD",
        name: "Luis Daniel da Silva",
        role: "Consultor Técnico Especialista",
        statusBadge: "Ativo",
        meta: 32000,
        rates: {
          regular: 2.0,
          bom: 2.5,
          otimo: 3.0,
          parcial: 1.5,
          dentistas: 4.0
        }
      }
    ];

    function App() {
      const [commissionMonth, setCommissionMonth] = useState('2026-11');
      const [compareMoM, setCompareMoM] = useState(true);
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [firebaseStatus, setFirebaseStatus] = useState('Conectando...');
      const [selectedAuditSeller, setSelectedAuditSeller] = useState('1'); // André default

      // Configuração de Vendedores com persistência em localStorage
      const [sellers, setSellers] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_sellers');
          return saved ? JSON.parse(saved) : defaultSellersConfig;
        } catch {
          return defaultSellersConfig;
        }
      });

      // Modo de Edição Visual de Layout (isLayoutEditMode)
      const [isLayoutEditMode, setIsLayoutEditMode] = useState(() => {
        return localStorage.getItem('neves_crm_layout_edit') === 'true';
      });

      const [layoutConfig, setLayoutConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_layout_config');
          return saved ? JSON.parse(saved) : {
            sidebarSide: 'left',
            logoUrl: '',
            watermarkOpacity: 0.035,
            moduleTitle: 'Comissões e Metas de Vendedores',
            moduleSubtitle: 'Base calculada exclusivamente sobre valores efetivamente liquidados'
          };
        } catch {
          return {
            sidebarSide: 'left',
            logoUrl: '',
            watermarkOpacity: 0.035,
            moduleTitle: 'Comissões e Metas de Vendedores',
            moduleSubtitle: 'Base calculada exclusivamente sobre valores efetivamente liquidados'
          };
        }
      });

      // Modal de Edição de Regras do Vendedor
      const [editingSeller, setEditingSeller] = useState(null);

      // Formulário Lateral: Novo Vendedor
      const [newSellerForm, setNewSellerForm] = useState({
        cod: '',
        name: '',
        profile: 'padrao', // padrao, especial, personalizado
        regular: '2.0',
        bom: '2.5',
        otimo: '3.0',
        hasParcial: true,
        hasDentistas: false
      });

      useEffect(() => {
        localStorage.setItem('neves_crm_sellers', JSON.stringify(sellers));
      }, [sellers]);

      useEffect(() => {
        localStorage.setItem('neves_crm_layout_config', JSON.stringify(layoutConfig));
      }, [layoutConfig]);

      useEffect(() => {
        localStorage.setItem('neves_crm_layout_edit', isLayoutEditMode);
      }, [isLayoutEditMode]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Listener em Tempo Real do Firebase
      useEffect(() => {
        const startListener = () => {
          if (!window.db || !window.fb) return;
          setFirebaseStatus('Online');

          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const q = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));

            const unsubscribe = window.fb.onSnapshot(q, (snapshot) => {
              const docsList = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setSales(docsList);
              setLoading(false);
            }, (error) => {
              console.error("Erro no listener de comissões:", error);
              setFirebaseStatus('Atenção');
              setLoading(false);
            });

            return unsubscribe;
          } catch (e) {
            console.error("Erro no listener:", e);
            setFirebaseStatus('Offline');
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListener();
        } else {
          window.addEventListener("firebase-ready", startListener);
          return () => window.removeEventListener("firebase-ready", startListener);
        }
      }, []);

      // Mês Anterior para Comparativo MoM
      const previousMonth = useMemo(() => {
        const [y, m] = commissionMonth.split('-').map(Number);
        const prevDate = new Date(y, m - 2, 1);
        const prevY = prevDate.getFullYear();
        const prevM = String(prevDate.getMonth() + 1).padStart(2, '0');
        return `${prevY}-${prevM}`;
      }, [commissionMonth]);

      // Alternar Mês com Botões < e >
      const handleShiftMonth = (offset) => {
        const [y, m] = commissionMonth.split('-').map(Number);
        const newDate = new Date(y, m - 1 + offset, 1);
        const nextY = newDate.getFullYear();
        const nextM = String(newDate.getMonth() + 1).padStart(2, '0');
        setCommissionMonth(`${nextY}-${nextM}`);
      };

      // Cálculo de alíquota do vendedor
      const getAppliedRate = (seller, tipoVenda, volumeBruto) => {
        if (!seller) return 3.0;
        if (tipoVenda === 'PARCIAL') return seller.rates.parcial || 1.5;
        if (tipoVenda === 'DENTISTAS' && seller.rates.dentistas) return seller.rates.dentistas;

        // Escalonamento por Meta Bruta
        if (volumeBruto >= 32000) return seller.rates.otimo;
        if (volumeBruto >= 21000) return seller.rates.bom;
        return seller.rates.regular;
      };

      // Vendas do Mês Atual vs Mês Anterior
      const currentSales = useMemo(() => {
        return sales.filter(s => s.date && s.date.startsWith(commissionMonth));
      }, [sales, commissionMonth]);

      const prevSales = useMemo(() => {
        return sales.filter(s => s.date && s.date.startsWith(previousMonth));
      }, [sales, previousMonth]);

      // APURAÇÃO DETALHADA DAS BAIXAS DO MÊS
      const auditDetails = useMemo(() => {
        const baixas = [];
        let totalLiquidadoMes = 0;

        sales.forEach(sale => {
          (sale.installments || []).forEach(inst => {
            const payDate = inst.paymentDate || (inst.status === 'Pago' ? sale.date : null);
            if (inst.status === 'Pago' && payDate && payDate.startsWith(commissionMonth)) {
              const instAmt = Number(inst.amount) || 0;
              totalLiquidadoMes += instAmt;

              // Identifica vendedor
              const sellerObj = sellers.find(s => s.cod === sale.codVendedor || s.name === sale.salesperson);

              // Identifica tipo da parcela
              let tipoParcelaStr = `${inst.number}/${(sale.installments || []).length} (Integral)`;
              if (sale.prazo === '0') tipoParcelaStr = 'À Vista (Integral)';
              else if (sale.tipoVenda === 'PARCIAL') tipoParcelaStr = 'Parcial (Entrada)';
              else if (inst.observacao && inst.observacao.includes('FIFO')) tipoParcelaStr = 'Abat. Parcial (FIFO)';

              // Cálculo da taxa
              const sellerGross = currentSales
                .filter(s => s.codVendedor === sellerObj?.cod || s.salesperson === sellerObj?.name)
                .reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);

              const appliedRate = getAppliedRate(sellerObj, sale.tipoVenda, sellerGross);
              const comissaoGerada = instAmt * (appliedRate / 100);

              baixas.push({
                saleId: sale.id,
                dav: sale.dav,
                client: sale.client,
                salesperson: sale.salesperson || sellerObj?.name || 'Vendedor',
                codVendedor: sale.codVendedor || sellerObj?.cod || '1',
                tipoVenda: sale.tipoVenda,
                tipoParcela: tipoParcelaStr,
                instNumber: inst.number,
                instAmount: instAmt,
                payDate: payDate,
                rate: appliedRate,
                comissao: comissaoGerada
              });
            }
          });
        });

        return { baixas, totalLiquidadoMes };
      }, [sales, currentSales, commissionMonth, sellers]);

      // INDICADORES MACRO DO PAINEL EXECUTIVO
      const macroKPIs = useMemo(() => {
        // Bruto Atual vs Anterior
        const currentGross = currentSales.reduce((acc, s) => acc + (Number(s.amount) || 0), 0);
        const prevGross = prevSales.reduce((acc, s) => acc + (Number(s.amount) || 0), 0);
        const grossDiffPct = prevGross > 0 ? ((currentGross - prevGross) / prevGross) * 100 : (currentGross > 0 ? 100 : 0);

        // Vendedores Ativos
        const activeSellersWithSales = new Set(currentSales.map(s => s.codVendedor || s.salesperson)).size;
        const totalSellers = sellers.length;
        const activePct = totalSellers > 0 ? Math.round((activeSellersWithSales / totalSellers) * 100) : 0;

        // Ticket Médio
        const ticketMedioVendedor = activeSellersWithSales > 0 ? currentGross / activeSellersWithSales : 0;
        const ticketMedioDAV = currentSales.length > 0 ? currentGross / currentSales.length : 0;
        const prevTicketMedioDAV = prevSales.length > 0 ? prevGross / prevSales.length : 0;
        const ticketDiffPct = prevTicketMedioDAV > 0 ? ((ticketMedioDAV - prevTicketMedioDAV) / prevTicketMedioDAV) * 100 : 0;

        // Liquidado vs Carteira Aberta
        const liquidado = auditDetails.totalLiquidadoMes;
        let aberto = 0;
        currentSales.forEach(s => {
          (s.installments || []).forEach(inst => {
            if (inst.status !== 'Pago') aberto += Number(inst.amount) || 0;
          });
        });
        const totalCarteira = liquidado + aberto;
        const liquidadoPct = totalCarteira > 0 ? Math.round((liquidado / totalCarteira) * 100) : 0;

        return {
          currentGross,
          prevGross,
          grossDiffPct,
          currentOrders: currentSales.length,
          activeSellersWithSales,
          totalSellers,
          activePct,
          ticketMedioVendedor,
          ticketMedioDAV,
          ticketDiffPct,
          liquidado,
          aberto,
          liquidadoPct
        };
      }, [currentSales, prevSales, sellers, auditDetails.totalLiquidadoMes]);

      // MÉTRICAS INDIVIDUAIS POR VENDEDOR
      const sellerAnalytics = useMemo(() => {
        return sellers.map(seller => {
          // Vendas brutas no mês
          const vendedorSales = currentSales.filter(s => s.codVendedor === seller.cod || s.salesperson === seller.name);
          const vendedorGross = vendedorSales.reduce((acc, s) => acc + (Number(s.amount) || 0), 0);

          // Vendas brutas no mês anterior
          const vendedorPrevSales = prevSales.filter(s => s.codVendedor === seller.cod || s.salesperson === seller.name);
          const vendedorPrevGross = vendedorPrevSales.reduce((acc, s) => acc + (Number(s.amount) || 0), 0);
          const grossMoMPct = vendedorPrevGross > 0 ? ((vendedorGross - vendedorPrevGross) / vendedorPrevGross) * 100 : 0;

          // Baixas liquidadas
          const vendedorBaixas = auditDetails.baixas.filter(b => b.codVendedor === seller.cod || b.salesperson === seller.name);
          const totalLiquidado = vendedorBaixas.reduce((acc, b) => acc + b.instAmount, 0);
          const totalComissao = vendedorBaixas.reduce((acc, b) => acc + b.comissao, 0);

          // Separação de comissões por modalidade
          let comParcial = 0;
          let comTotal = 0;
          let comDentistas = 0;

          vendedorBaixas.forEach(b => {
            if (b.tipoVenda === 'PARCIAL') comParcial += b.comissao;
            else if (b.tipoVenda === 'DENTISTAS') comDentistas += b.comissao;
            else comTotal += b.comissao;
          });

          // Carteira aberta (a liquidar)
          let aLiquidar = 0;
          vendedorSales.forEach(s => {
            (s.installments || []).forEach(inst => {
              if (inst.status !== 'Pago') aLiquidar += Number(inst.amount) || 0;
            });
          });

          // Projeção Potencial (se liquidar 100%)
          const rateProj = getAppliedRate(seller, 'TOTAL', vendedorGross);
          const comissaoPotencial = (vendedorGross * (rateProj / 100));

          // Faixa de Meta
          let faixaAtual = 'Faixa Regular';
          let proximoDegrauMsg = `Próximo degrau: Bom (> R$ 21.000) • Restam R$ ${Math.max(0, 21000 - vendedorGross).toFixed(2)}`;
          if (vendedorGross >= 32000) {
            faixaAtual = 'Faixa Ótimo (Meta Superada)';
            proximoDegrauMsg = '🎉 Bônus Máximo Atingido (+1.0%)!';
          } else if (vendedorGross >= 21000) {
            faixaAtual = 'Faixa Bom';
            proximoDegrauMsg = `Próximo degrau: Ótimo (≥ R$ 32.000) • Restam R$ ${(32000 - vendedorGross).toFixed(2)}`;
          }

          const pctMeta = Math.min(100, (vendedorGross / seller.meta) * 100);

          return {
            ...seller,
            bruto: vendedorGross,
            prevBruto: vendedorPrevGross,
            grossMoMPct,
            davsCount: vendedorSales.length,
            liquidado: totalLiquidado,
            baixasCount: vendedorBaixas.length,
            aLiquidar,
            comissao: totalComissao,
            comParcial,
            comTotal,
            comDentistas,
            comissaoPotencial,
            pctMeta,
            faixaAtual,
            proximoDegrauMsg
          };
        });
      }, [sellers, currentSales, prevSales, auditDetails.baixas]);

      // RANKING DE VENDAS (Ordenado pelo volume liquidado)
      const salesRanking = useMemo(() => {
        return [...sellerAnalytics].sort((a, b) => b.liquidado - a.liquidado);
      }, [sellerAnalytics]);

      // Meta Coletiva
      const collectiveMetaPct = useMemo(() => {
        const totalMeta = sellers.reduce((acc, s) => acc + s.meta, 0);
        const totalRealizado = macroKPIs.currentGross;
        return totalMeta > 0 ? Math.min(100, Math.round((totalRealizado / totalMeta) * 100)) : 0;
      }, [sellers, macroKPIs.currentGross]);

      // Extrato filtrado para o vendedor selecionado na auditoria
      const activeSellerAudit = useMemo(() => {
        return auditDetails.baixas.filter(b => b.codVendedor === selectedAuditSeller);
      }, [auditDetails.baixas, selectedAuditSeller]);

      const activeSellerName = useMemo(() => {
        return sellers.find(s => s.cod === selectedAuditSeller)?.name || 'Vendedor';
      }, [sellers, selectedAuditSeller]);

      // Salvar Edição de Regras do Vendedor
      const handleSaveSellerRules = (e) => {
        e.preventDefault();
        if (!editingSeller) return;

        setSellers(prev => prev.map(s => {
          if (s.cod === editingSeller.cod) {
            return {
              ...s,
              name: editingSeller.name,
              rates: {
                ...s.rates,
                regular: parseFloat(editingSeller.rates.regular) || s.rates.regular,
                bom: parseFloat(editingSeller.rates.bom) || s.rates.bom,
                otimo: parseFloat(editingSeller.rates.otimo) || s.rates.otimo,
                parcial: parseFloat(editingSeller.rates.parcial) || s.rates.parcial,
                dentistas: editingSeller.rates.dentistas !== null ? (parseFloat(editingSeller.rates.dentistas) || 4.0) : null
              }
            };
          }
          return s;
        }));

        alert("✅ Regras do vendedor atualizadas com sucesso!");
        setEditingSeller(null);
      };

      // Adicionar Novo Vendedor pelo Formulário Lateral
      const handleAddNewSeller = (e) => {
        e.preventDefault();
        if (!newSellerForm.name) {
          alert("Por favor, preencha o nome do vendedor.");
          return;
        }

        const newCod = newSellerForm.cod || String(sellers.length + 1);
        const initials = newSellerForm.name.split(' ').slice(0, 2).map(n => n[0]).join('').toUpperCase();

        let regVal = parseFloat(newSellerForm.regular);
        let bomVal = parseFloat(newSellerForm.bom);
        let otimoVal = parseFloat(newSellerForm.otimo);

        if (newSellerForm.profile === 'especial') {
          regVal = 3.0; bomVal = 3.5; otimoVal = 4.0;
        } else if (newSellerForm.profile === 'padrao') {
          regVal = 2.0; bomVal = 2.5; otimoVal = 3.0;
        }

        const newEntry = {
          cod: newCod,
          codeVnd: `VND-0${newCod}`,
          initials: initials || 'VND',
          name: newSellerForm.name,
          role: "Representante Comercial",
          statusBadge: "Ativo",
          meta: 32000,
          rates: {
            regular: regVal,
            bom: bomVal,
            otimo: otimoVal,
            parcial: newSellerForm.hasParcial ? 1.5 : 0,
            dentistas: newSellerForm.hasDentistas ? 4.0 : null
          }
        };

        setSellers(prev => [...prev, newEntry]);
        alert(`🎉 Vendedor ${newSellerForm.name} cadastrado com sucesso!`);
        setNewSellerForm({
          cod: '',
          name: '',
          profile: 'padrao',
          regular: '2.0',
          bom: '2.5',
          otimo: '3.0',
          hasParcial: true,
          hasDentistas: false
        });
      };

      // Exportação em CSV da Tabela de Apuração
      const handleExportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "CÓD;NOME;VENDAS BRUTAS;VENDAS BAIXADAS;TOTAL LIQUIDADO;COM. PARCIAL;COM. TOTAL;COM. DENTISTAS;TOTAL COMISSAO\n";

        sellerAnalytics.forEach(s => {
          csvContent += `${s.codeVnd};${s.name};${s.bruto.toFixed(2)};${s.baixasCount};${s.liquidado.toFixed(2)};${s.comParcial.toFixed(2)};${s.comTotal.toFixed(2)};${s.comDentistas.toFixed(2)};${s.comissao.toFixed(2)}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `comissoes_${commissionMonth}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className={`flex flex-col ${layoutConfig.sidebarSide === 'right' ? 'md:flex-row-reverse' : 'md:flex-row'} min-h-screen`}>
          
          {/* MENU LATERAL ESCURO (SIDEBAR #1a202c / bg-slate-900) */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-slate-300 flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden">
            
            {/* MARCA D'ÁGUA INFERIOR NA SIDEBAR */}
            <div className="absolute -bottom-12 -right-12 pointer-events-none text-white opacity-[0.06] w-72 h-72">
              <ToothWatermark className="w-full h-full text-white" />
            </div>

            <div className="relative z-10">
              {/* TOPO: LOGO OFICIAL TELES ODONTO + NEVES PRO CRM */}
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-sm shadow-md ring-2 ring-indigo-400/20">
                    TO
                  </div>
                  <div>
                    <h1 className="text-white font-extrabold text-sm tracking-tight leading-tight">Teles Odonto</h1>
                    <p className="text-[10px] text-indigo-400 font-bold tracking-wider uppercase">Materiais Protéticos</p>
                    <span className="inline-block mt-0.5 text-[9px] bg-slate-800 text-slate-300 px-1.5 py-0.2 rounded font-semibold border border-slate-700">
                      Neves Pro CRM
                    </span>
                  </div>
                </div>
              </div>

              {/* SEÇÃO DE MENU: NAVEGAÇÃO COMERCIAL */}
              <div className="px-4 py-5">
                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2.5">
                  NAVEGAÇÃO COMERCIAL
                </p>
                <nav className="space-y-1.5">
                  <a 
                    href="index.html"

                        type="text" 
                        value={editingSeller.rates.parcial} 
                        onChange={e => setEditingSeller({ ...editingSeller, rates: { ...editingSeller.rates, parcial: e.target.value } })} 
                        className="w-full p-2 border rounded-xl bg-slate-50 text-center font-extrabold outline-none" 
                      />
                    </div>
                    <div>
                      <span className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Dentistas (%)</span>
                      <input 
                        type="text" 
                        placeholder="Desabilitado" 
                        value={editingSeller.rates.dentistas || ''} 
                        onChange={e => setEditingSeller({ ...editingSeller, rates: { ...editingSeller.rates, dentistas: e.target.value ? e.target.value : null } })} 
                        className="w-full p-2 border rounded-xl bg-slate-50 text-center font-extrabold outline-none text-emerald-700" 
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button 
                      type="button" 
                      onClick={() => setEditingSeller(null)} 
                      className="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 rounded-xl text-xs font-bold text-white bg-indigo-700 hover:bg-indigo-800 shadow"
                    >
                      Salvar Alterações
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
