<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neves Pro CRM - Página de Vendas & Carteira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ToothWatermark = ({ className = "w-64 h-64 opacity-[0.06]" }) => (
      <svg viewBox="0 0 100 120" className={className} fill="currentColor">
        <path d="M 45 15 C 28 15 15 32 15 55 C 15 78 28 98 42 98 C 48 98 52 82 52 70 C 52 82 56 98 62 98 C 76 98 89 78 89 55 C 89 32 76 15 59 15 C 55 15 52 24 52 24 C 52 24 49 15 45 15 Z" fill="none" stroke="currentColor" strokeWidth="6"/>
        <path d="M 8 52 C 32 78 68 78 92 38" fill="none" stroke="currentColor" strokeWidth="6"/>
        <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" />
      </svg>
    );

    const initialClients = [
      { cod: "2", name: "JOÃO PESSOA MEDEIROS COSTA", nickname: "" },
      { cod: "4", name: "LEONARDO AMORIM DE FRANCA E SOUSA", nickname: "ERDENIA" },
      { cod: "5", name: "IMPRESSIONE LABORATÓRIO DE PROTESE LTDA", nickname: "" },
      { cod: "7", name: "DAVI DA CUNHA GONCALVES", nickname: "DR. DAVI CUNHA" },
      { cod: "8", name: "LEONARDO DA SILVA SOUZA", nickname: "CHINA" },
      { cod: "9", name: "JOAO FERNANDO BRITO SILVA", nickname: "MARAPONGA" },
      { cod: "10", name: "JOSE BRENO MESQUITA FARIAS", nickname: "SMILE LAB" },
      { cod: "88", name: "Laboratório Dental Sorriso", nickname: "HELENA" },
      { cod: "93", name: "Implantes & Próteses Vitória", nickname: "CONCEPT" },
      { cod: "104", name: "Clínica OdontoPrime", nickname: "DR. VALTER" }
    ];

    function App() {
      const [clients] = useState(initialClients);
      const [selectedClient, setSelectedClient] = useState(initialClients[1]);
      const [filter, setFilter] = useState('all');
      const [search, setSearch] = useState('');
      const [fifoAmount, setFifoAmount] = useState('');
      const [fifoMsg, setFifoMsg] = useState('');

      const [clientSales, setClientSales] = useState([
        { id: 'cs-1', dav: '48925', amount: 850.0, date: '2026-11-12', installments: [
          { id: 'i-1', number: 1, amount: 850.0, dueDate: '2026-11-12', status: 'Em aberto' }
        ]}
      ]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const handleFifo = (e) => {
        e.preventDefault();
        const val = parseFloat(fifoAmount);
        if (!val) return;
        setFifoMsg(`✅ Amortização de R$ ${val.toFixed(2)} liquidada nas parcelas mais antigas via FIFO!`);
        setFifoAmount('');
        setTimeout(() => setFifoMsg(''), 4000);
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* SIDEBAR COM LINKS EXTERNOS */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-slate-300 flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden">
            <div className="absolute -bottom-12 -right-12 pointer-events-none text-white/5 w-64 h-64">
              <ToothWatermark className="w-full h-full" />
            </div>

            <div>
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">TO</div>
                  <div>
                    <h1 className="text-white font-bold text-sm leading-tight">Teles Odonto</h1>
                    <p className="text-[10px] text-indigo-400 font-semibold tracking-wider uppercase">Neves Pro CRM</p>
                  </div>
                </div>
              </div>

              <div className="px-4 py-5">
                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>
                <nav className="space-y-1">
                  <a href="index.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 transition">
                    <i data-lucide="layout-grid" className="w-4 h-4"></i>
                    <span>Página Inicial</span>
                  </a>
                  <a href="vendas.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold bg-indigo-700 text-white shadow-md">
                    <i data-lucide="shopping-cart" className="w-4 h-4"></i>
                    <span>Página de Vendas</span>
                  </a>
                  <a href="comissoes.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 transition">
                    <i data-lucide="briefcase" className="w-4 h-4"></i>
                    <span>Comissões</span>
                  </a>
                </nav>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800 relative z-10 space-y-3">
              <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center text-xs font-bold">OP</div>
                <div className="truncate">
                  <p className="text-xs font-bold text-slate-200">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400">operador@nevespro.com</p>
                </div>
              </div>
              <div className="text-[9px] text-slate-500 text-center leading-tight">
                <p>Neves Pro CRM, Todos os Direitos Reservado</p>
                <p className="text-indigo-400 font-semibold mt-0.5">Por Daniel Silva</p>
              </div>
            </div>
          </aside>

          {/* MAIN */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Neves Pro CRM</span>
                <span>&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2 py-0.5 rounded-full">Página de Vendas & Carteira</span>
              </div>
              <div className="flex items-center gap-4">
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  ● SISTEMA ONLINE
                </span>
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs">D</div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                  <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full">
                    MÓDULO FINANCEIRO • CARTEIRA ATIVA • Exercício 2026
                  </span>
                  <h2 className="text-xl font-bold text-slate-900 mt-1">Carteira de Clientes e Vendas</h2>
                  <p className="text-xs text-slate-400">Total de {clients.length} clientes na base operacional</p>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => window.print()} className="bg-white border text-slate-700 font-bold text-xs px-3 py-2 rounded-xl shadow-sm">
                    ↓ Relatório Sintético
                  </button>
                  <a href="index.html" className="bg-indigo-700 text-white font-bold text-xs px-3 py-2 rounded-xl shadow-sm">
                    ⊕ Novo Pedido / DAV
                  </a>
                </div>
              </div>

              {/* 2 Cards Superiores */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="bg-white p-5 rounded-2xl border-l-4 border-blue-600 border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-start">
                    <span className="text-xs font-bold text-blue-700 uppercase">Vencendo Hoje (12/11/2026)</span>
                    <span className="text-[10px] bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded-full">Urgente</span>
                  </div>
                  <p className="text-2xl font-black text-slate-900 mt-2">R$ 850,00</p>
                  <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden mt-3">
                    <div className="bg-blue-600 h-full" style={{ width: '40%' }}></div>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border-l-4 border-indigo-600 border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-start">
                    <span className="text-xs font-bold text-indigo-700 uppercase">Vencendo no Mês Atual (Novembro)</span>
                    <span className="text-[10px] bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">Fluxo Geral</span>
                  </div>
                  <p className="text-2xl font-black text-slate-900 mt-2">R$ 2.450,00</p>
                  <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden mt-3">
                    <div className="bg-indigo-600 h-full" style={{ width: '65%' }}></div>
                  </div>
                </div>
              </div>

              {/* Filtros + Busca */}
              <div className="flex flex-col sm:flex-row justify-between items-center gap-3">
                <div className="flex flex-wrap gap-2 text-xs font-semibold">
                  <button onClick={() => setFilter('all')} className={`px-3 py-1.5 rounded-full ${filter === 'all' ? 'bg-[#1a202c] text-white' : 'bg-slate-100 text-slate-600'}`}>Todos ({clients.length})</button>
                  <button onClick={() => setFilter('compras')} className={`px-3 py-1.5 rounded-full ${filter === 'compras' ? 'bg-indigo-700 text-white' : 'bg-slate-100 text-slate-600'}`}>● Com compras (3)</button>
                  <button onClick={() => setFilter('inad')} className={`px-3 py-1.5 rounded-full ${filter === 'inad' ? 'bg-rose-600 text-white' : 'bg-red-50 text-red-700'}`}>● Inadimplentes (1)</button>
                  <button onClick={() => setFilter('rec')} className={`px-3 py-1.5 rounded-full ${filter === 'rec' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700'}`}>● À receber (2)</button>
                </div>
                <input type="text" placeholder="Buscar por código ou nome..." value={search} onChange={e => setSearch(e.target.value)} className="text-xs border rounded-full px-4 py-2 bg-slate-50 w-full sm:w-64 outline-none" />
              </div>

              {/* Master-Detail */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <div className="lg:col-span-7 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 uppercase text-[10px]">
                        <tr>
                          <th className="py-2.5 px-3">CÓD</th>
                          <th className="py-2.5 px-3">RAZÃO / NOME FANTASIA</th>
                          <th className="py-2.5 px-3">SITUAÇÃO</th>
                          <th className="py-2.5 px-3 text-center">AÇÃO</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {clients
                          .filter(c => c.name.toLowerCase().includes(search.toLowerCase()) || c.cod.includes(search))
                          .map(c => {
                            const isSelected = selectedClient?.cod === c.cod;
                            return (
                              <tr key={c.cod} className={`hover:bg-slate-50 ${isSelected ? 'bg-indigo-50/50' : ''}`}>
                                <td className="py-3 px-3 font-bold text-slate-700">#{c.cod}</td>
                                <td className="py-3 px-3">
                                  <p className="font-bold text-slate-900">{c.name}</p>
                                  {c.nickname && <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-bold mr-1">{c.nickname}</span>}
                                  {c.cod === '4' && <p className="text-[10px] text-red-600 font-semibold mt-0.5">⚠ Possui parcela em atraso</p>}
                                </td>
                                <td className="py-3 px-3">
                                  {c.cod === '4' ? <span className="bg-red-50 text-red-700 font-bold px-2 py-0.5 rounded-full text-[10px]">● Vencido</span> :
                                   c.cod === '93' ? <span className="bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded-full text-[10px]">À vencer</span> :
                                   <span className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full text-[10px]">Sem débitos</span>}
                                </td>
                                <td className="py-3 px-3 text-center">
                                  <button onClick={() => setSelectedClient(c)} className={`px-3 py-1 rounded-xl font-bold text-xs transition ${isSelected ? 'bg-[#1a202c] text-white' : 'text-indigo-700 hover:bg-indigo-50'}`}>
                                    {isSelected ? 'Ficha Ativa 👁' : 'Abrir Ficha >'}
                                  </button>
                                </td>
                              </tr>
                            );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Detail */}
                {selectedClient && (
                  <div className="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-5">
                    <div className="flex justify-between items-start border-b pb-4">
                      <div className="flex items-center gap-3">
                        <span className="w-10 h-10 rounded-xl bg-[#1a202c] text-white flex items-center justify-center font-bold text-sm">#{selectedClient.cod}</span>
                        <div>
                          <h3 className="font-extrabold text-slate-900 text-base leading-tight">{selectedClient.name}</h3>
                          <p className="text-[11px] text-slate-400">Responsável: {selectedClient.nickname || 'Geral'}</p>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <span className="text-[10px] text-slate-400 block font-bold">TOTAL</span>
                        <b className="text-slate-900">R$ 3.200</b>
                      </div>
                      <div className="bg-emerald-50/70 p-2.5 rounded-xl border border-emerald-100">
                        <span className="text-[10px] text-emerald-700 block font-bold">PAGO</span>
                        <b className="text-emerald-700">R$ 1.600</b>
                      </div>
                      <div className="bg-rose-50/70 p-2.5 rounded-xl border border-rose-100">
                        <span className="text-[10px] text-rose-700 block font-bold">EM ABERTO</span>
                        <b className="text-rose-700">R$ 1.600</b>
                      </div>
                    </div>

                    {/* Card FIFO */}
                    <div className="bg-gradient-to-br from-indigo-700 to-purple-800 p-5 rounded-2xl text-white space-y-3 shadow-md">
                      <h4 className="font-bold text-sm flex items-center gap-1.5">
                        <i data-lucide="zap" className="w-4 h-4 text-amber-300"></i>
                        Promissória & Amortização FIFO
                      </h4>
                      <p className="text-[11px] text-indigo-100">Digite o valor arrecadado para amortizar automaticamente nas parcelas mais antigas em atraso.</p>
                      <form onSubmit={handleFifo} className="space-y-2">
                        <div className="flex gap-2">
                          <input type="number" step="0.01" placeholder="Valor Recebido (R$)" value={fifoAmount} onChange={e => setFifoAmount(e.target.value)} className="bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-xs text-white outline-none flex-1 font-bold placeholder-white/50" required />
                          <button type="submit" className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow">
                            ⚡ Abater no Saldo
                          </button>
                        </div>
                      </form>
                      {fifoMsg && <p className="text-xs bg-emerald-500/30 p-2 rounded-lg font-bold text-white">{fifoMsg}</p>}
                    </div>

                    {/* Títulos */}
                    <div className="space-y-3">
                      <h4 className="text-xs font-bold text-slate-800 uppercase">Títulos deste Cliente</h4>
                      {clientSales.map(s => (
                        <div key={s.id} className="p-3 rounded-xl border border-slate-200 bg-slate-50 space-y-2 text-xs">
                          <div className="flex justify-between font-bold">
                            <span>DAV #{s.dav}</span>
                            <span className="text-slate-900">R$ {s.amount.toFixed(2)}</span>
                          </div>
                          <div className="space-y-1">
                            {s.installments.map(inst => (
                              <div key={inst.id} className="p-2 rounded-lg bg-white border flex justify-between items-center">
                                <span>Parc. {inst.number} - R$ {inst.amount.toFixed(2)}</span>
                                <span className="font-bold text-[10px] text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full">{inst.status}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
