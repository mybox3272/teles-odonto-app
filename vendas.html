<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Componente Vetorial do Ícone Gráfico do Dente Oficial Teles Odonto
    const ToothWatermark = ({ className = "w-64 h-64 text-slate-900 opacity-[0.035]" }) => (
      <svg viewBox="0 0 100 120" className={className} fill="currentColor">
        <path d="M 45 15 C 28 15 15 32 15 55 C 15 78 28 98 42 98 C 48 98 52 82 52 70 C 52 82 56 98 62 98 C 76 98 89 78 89 55 C 89 32 76 15 59 15 C 55 15 52 24 52 24 C 52 24 49 15 45 15 Z" fill="none" stroke="currentColor" strokeWidth="6"/>
        <path d="M 8 52 C 32 78 68 78 92 38" fill="none" stroke="currentColor" strokeWidth="6"/>
        <polygon points="78,16 81,24 89,27 81,30 78,38 75,30 67,27 75,24" />
      </svg>
    );

    const initialClients = [
      { cod: "2", name: "JOÃO PESSOA MEDEIROS COSTA", nickname: "JOÃO PESSOA", doc: "04.819.341/0001-92", vendor: "André Luiz" },
      { cod: "4", name: "LEONARDO AMORIM DE FRANCA E SOUSA", nickname: "ERDENIA", doc: "12.459.882/0001-30", vendor: "Luis Daniel" },
      { cod: "5", name: "IMPRESSIONE LABORATÓRIO DE PROTESE LTDA", nickname: "IMPRESSIONE", doc: "08.123.456/0001-88", vendor: "André Luiz" },
      { cod: "7", name: "DAVI DA CUNHA GONCALVES", nickname: "DR. DAVI CUNHA", doc: "33.782.910/0001-54", vendor: "André Luiz" },
      { cod: "8", name: "LEONARDO DA SILVA SOUZA", nickname: "CHINA", doc: "19.324.551/0001-09", vendor: "Luis Daniel" },
      { cod: "9", name: "JOAO FERNANDO BRITO SILVA", nickname: "MARAPONGA", doc: "25.109.843/0001-71", vendor: "André Luiz" },
      { cod: "10", name: "JOSE BRENO MESQUITA FARIAS", nickname: "SMILE LAB", doc: "14.992.831/0001-18", vendor: "Luis Daniel" },
      { cod: "88", name: "Laboratório Dental Sorriso", nickname: "HELENA", doc: "07.654.321/0001-44", vendor: "André Luiz" },
      { cod: "93", name: "Implantes & Próteses Vitória", nickname: "CONCEPT", doc: "11.223.344/0001-55", vendor: "Luis Daniel" },
      { cod: "104", name: "Clínica OdontoPrime Dr. Valter", nickname: "DR. VALTER", doc: "22.334.455/0001-66", vendor: "André Luiz" }
    ];

    const sellersList = [
      { cod: "1", name: "André Luiz Nóbrega Martins", rate: "3.5%" },
      { cod: "2", name: "Luis Daniel da Silva", rate: "3.0%" }
    ];

    function App() {
      const [clients, setClients] = useState(initialClients);
      const [selectedClient, setSelectedClient] = useState(initialClients[1]); // Cód 4 default
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [firebaseStatus, setFirebaseStatus] = useState('Conectando...');
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 8;

      // Amortização FIFO
      const [fifoAmount, setFifoAmount] = useState('');
      const [fifoVendor, setFifoVendor] = useState('1');
      const [fifoMsg, setFifoMsg] = useState('');
      const [processingFifo, setProcessingFifo] = useState(false);

      // Modal de Abatimento Parcial Individual
      const [modalPartial, setModalPartial] = useState(null); // { saleId, installmentNumber, maxAmount }
      const [partialInput, setPartialInput] = useState('');

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const todayStr = useMemo(() => {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }, []);

      // Conexão em Tempo Real com Firestore
      useEffect(() => {
        const startListener = () => {
          if (!window.db || !window.fb) return;
          setFirebaseStatus('Online');

          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const q = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));

            const unsubscribe = window.fb.onSnapshot(q, (snapshot) => {
              const docsList = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setSales(docsList);
              setLoading(false);

              // Auto-atualização de clientes caso haja novos registros nas vendas
              docsList.forEach(sale => {
                if (sale.codCliente && !initialClients.some(c => c.cod === sale.codCliente)) {
                  setClients(prev => {
                    if (prev.some(c => c.cod === sale.codCliente)) return prev;
                    return [...prev, {
                      cod: sale.codCliente,
                      name: sale.client || `Cliente #${sale.codCliente}`,
                      nickname: '',
                      doc: '00.000.000/0001-00',
                      vendor: sale.salesperson || 'André Luiz'
                    }];
                  });
                }
              });
            }, (err) => {
              console.error("Erro listener vendas.html:", err);
              setFirebaseStatus('Atenção');
              setLoading(false);
            });

            return unsubscribe;
          } catch (e) {
            console.error("Erro de conexão:", e);
            setFirebaseStatus('Offline');
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListener();
        } else {
          window.addEventListener("firebase-ready", startListener);
          return () => window.removeEventListener("firebase-ready", startListener);
        }
      }, []);

      // Cálculo de Atraso e Situação por Cliente
      const clientStatsMap = useMemo(() => {
        const map = {};
        clients.forEach(c => {
          map[c.cod] = {
            totalComprado: 0,
            totalPago: 0,
            totalAberto: 0,
            totalVencido: 0,
            totalAVencer: 0,
            atrasosCount: 0,
            maxDiasAtraso: 0,
            pedidosCount: 0
          };
        });

        sales.forEach(s => {
          const cCod = s.codCliente;
          if (!map[cCod]) {
            map[cCod] = {
              totalComprado: 0, totalPago: 0, totalAberto: 0,
              totalVencido: 0, totalAVencer: 0, atrasosCount: 0,
              maxDiasAtraso: 0, pedidosCount: 0
            };
          }

          map[cCod].pedidosCount++;
          const saleAmt = Number(s.amount) || 0;
          map[cCod].totalComprado += saleAmt;

          (s.installments || []).forEach(inst => {
            const amt = Number(inst.amount) || 0;
            if (inst.status === 'Pago') {
              map[cCod].totalPago += amt;
            } else {
              map[cCod].totalAberto += amt;
              // Cálculo de dias de vencimento
              if (inst.dueDate && inst.dueDate < todayStr) {
                map[cCod].totalVencido += amt;
                map[cCod].atrasosCount++;
                const diffTime = Math.abs(new Date(todayStr) - new Date(inst.dueDate));
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays > map[cCod].maxDiasAtraso) {
                  map[cCod].maxDiasAtraso = diffDays;
                }
              } else {
                map[cCod].totalAVencer += amt;
              }
            }
          });
        });

        return map;
      }, [clients, sales, todayStr]);

      // Filtragem e Paginação da Tabela da Esquerda
      const filteredClients = useMemo(() => {
        return clients.filter(c => {
          const stats = clientStatsMap[c.cod] || {};
          const matchSearch = c.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              (c.nickname && c.nickname.toLowerCase().includes(searchTerm.toLowerCase())) ||
                              String(c.cod).includes(searchTerm);
          if (!matchSearch) return false;

          if (statusFilter === 'vencidos') return stats.totalVencido > 0;
          if (statusFilter === 'avencer') return stats.totalAVencer > 0 && stats.totalVencido === 0;
          if (statusFilter === 'quitados') return stats.totalComprado > 0 && stats.totalAberto === 0;
          return true;
        });
      }, [clients, clientStatsMap, searchTerm, statusFilter]);

      const totalPages = Math.ceil(filteredClients.length / pageSize) || 1;
      const paginatedClients = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredClients.slice(start, start + pageSize);
      }, [filteredClients, currentPage, pageSize]);

      // Vendas do Cliente Ativo
      const activeClientSales = useMemo(() => {
        if (!selectedClient) return [];
        return sales.filter(s => String(s.codCliente) === String(selectedClient.cod));
      }, [sales, selectedClient]);

      const activeStats = clientStatsMap[selectedClient?.cod] || {
        totalComprado: 0, totalPago: 0, totalAberto: 0
      };

      // AMORTIZAÇÃO FIFO EM CASCATA COM DIVISÃO DE PARCELA (SPLIT)
      const handleFifoSubmit = async (e) => {
        e.preventDefault();
        const abateVal = parseFloat(fifoAmount.replace(',', '.'));
        if (!abateVal || !selectedClient) return;

        setProcessingFifo(true);
        let rem = abateVal;
        let alteracoesCount = 0;

        try {
          // Ordena as vendas do cliente por data mais antiga
          const vendasOrdenadas = [...activeClientSales].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

          for (const sale of vendasOrdenadas) {
            if (rem <= 0) break;

            let saleAlterada = false;
            let newInstallments = [];

            for (const inst of (sale.installments || [])) {
              if (inst.status === 'Pago' || rem <= 0) {
                newInstallments.push(inst);
                continue;
              }

              const instAmt = Number(inst.amount) || 0;
              if (rem >= instAmt) {
                // Quitação total desta parcela
                rem -= instAmt;
                saleAlterada = true;
                newInstallments.push({
                  ...inst,
                  status: 'Pago',
                  paymentDate: todayStr,
                  liquidadoPor: fifoVendor
                });
              } else {
                // SPLIT DA PARCELA: Parte Quitada + Saldo Restante em Aberto
                const valorQuitado = rem;
                const saldoRestante = instAmt - valorQuitado;
                rem = 0;
                saleAlterada = true;

                // 1. Registro Pago
                newInstallments.push({
                  number: inst.number,
                  amount: valorQuitado,
                  dueDate: inst.dueDate,
                  status: 'Pago',
                  paymentDate: todayStr,
                  liquidadoPor: fifoVendor,
                  observacao: `Abatimento parcial FIFO de R$ ${valorQuitado.toFixed(2)}`
                });

                // 2. Registro do Saldo Restante
                newInstallments.push({
                  number: Number(`${inst.number}.1`),
                  amount: saldoRestante,
                  dueDate: inst.dueDate,
                  status: 'Em aberto',
                  paymentDate: null,
                  observacao: `Saldo restante após amortização FIFO`
                });
              }
            }

            if (saleAlterada) {
              alteracoesCount++;
              const todosPagos = newInstallments.every(i => i.status === 'Pago');

              if (window.db && window.fb) {
                const vendaRef = window.fb.doc(window.db, "vendas", sale.id);
                await window.fb.updateDoc(vendaRef, {
                  installments: newInstallments,
                  isPaid: todosPagos
                });
              }
            }
          }

          setFifoMsg(`✅ R$ ${abateVal.toFixed(2)} amortizado via FIFO com sucesso em ${alteracoesCount} título(s)!`);
          setFifoAmount('');
        } catch (err) {
          console.error("Erro no FIFO:", err);
          setFifoMsg(`❌ Erro ao amortizar no Firebase: ${err.message}`);
        } finally {
          setProcessingFifo(false);
          setTimeout(() => setFifoMsg(''), 6000);
        }
      };

      // BAIXA DIRETA / REABERTURA DE UMA PARCELA
      const handleToggleBaixa = async (saleId, instNumber, currentStatus) => {
        const novoStatus = currentStatus === 'Pago' ? 'Em aberto' : 'Pago';
        const confirmMsg = currentStatus === 'Pago' 
          ? `Deseja REABRIR / ESTORNAR a parcela #${instNumber}?` 
          : `Confirmar baixa total da parcela #${instNumber}?`;

        if (!confirm(confirmMsg)) return;

        try {
          const targetSale = sales.find(s => s.id === saleId);
          if (!targetSale) return;

          const updatedInstallments = (targetSale.installments || []).map(inst => {
            if (inst.number === instNumber) {
              return {
                ...inst,
                status: novoStatus,
                paymentDate: novoStatus === 'Pago' ? todayStr : null
              };
            }
            return inst;
          });

          const todosPagos = updatedInstallments.every(i => i.status === 'Pago');

          if (window.db && window.fb) {
            const vendaRef = window.fb.doc(window.db, "vendas", saleId);
            await window.fb.updateDoc(vendaRef, {
              installments: updatedInstallments,
              isPaid: todosPagos
            });
            alert(`✅ Parcela #${instNumber} alterada para: ${novoStatus}!`);
          }
        } catch (err) {
          console.error("Erro ao alterar parcela:", err);
          alert("❌ Erro ao salvar: " + err.message);
        }
      };

      // ABATIMENTO PARCIAL DE UMA PARCELA ESPECÍFICA (MODAL)
      const handleModalPartialSubmit = async (e) => {
        e.preventDefault();
        const abateVal = parseFloat(partialInput.replace(',', '.'));
        if (!abateVal || !modalPartial) return;

        if (abateVal >= modalPartial.maxAmount) {
          alert("Para quitar o valor total, use o botão 'Dar Baixa'. O abatimento parcial deve ser inferior ao saldo da parcela.");
          return;
        }

        try {
          const targetSale = sales.find(s => s.id === modalPartial.saleId);
          if (!targetSale) return;

          let newInstallments = [];
          (targetSale.installments || []).forEach(inst => {
            if (inst.number === modalPartial.installmentNumber) {
              const instAmt = Number(inst.amount) || 0;
              const saldoRestante = instAmt - abateVal;

              // Parte Paga
              newInstallments.push({
                number: inst.number,
                amount: abateVal,
                dueDate: inst.dueDate,
                status: 'Pago',
                paymentDate: todayStr,
                observacao: `Abatimento avulso de R$ ${abateVal.toFixed(2)}`
              });

              // Saldo Restante
              newInstallments.push({
                number: Number(`${inst.number}.1`),
                amount: saldoRestante,
                dueDate: inst.dueDate,
                status: 'Em aberto',
                paymentDate: null,
                observacao: `Saldo remanescente da parcela #${inst.number}`
              });
            } else {
              newInstallments.push(inst);
            }
          });

          if (window.db && window.fb) {
            const vendaRef = window.fb.doc(window.db, "vendas", modalPartial.saleId);
            await window.fb.updateDoc(vendaRef, {
              installments: newInstallments,
              isPaid: false
            });
            alert(`✅ Abatimento de R$ ${abateVal.toFixed(2)} aplicado com sucesso!`);
          }

          setModalPartial(null);
          setPartialInput('');
        } catch (err) {
          console.error("Erro no abatimento parcial:", err);
          alert("❌ Erro ao abater: " + err.message);
        }
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* MENU LATERAL ESCURO (SIDEBAR #1a202c / bg-slate-900) */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-slate-300 flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden">
            
            {/* MARCA D'ÁGUA INFERIOR NA SIDEBAR */}
            <div className="absolute -bottom-12 -right-12 pointer-events-none text-white opacity-[0.06] w-72 h-72">
              <ToothWatermark className="w-full h-full text-white" />
            </div>

            <div className="relative z-10">
              {/* TOPO: LOGO OFICIAL TELES ODONTO + NEVES PRO CRM */}
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-sm shadow-md ring-2 ring-indigo-400/20">
                    TO
                  </div>
                  <div>
                    <h1 className="text-white font-extrabold text-sm tracking-tight leading-tight">Teles Odonto</h1>
                    <p className="text-[10px] text-indigo-400 font-bold tracking-wider uppercase">Materiais Protéticos</p>
                    <span className="inline-block mt-0.5 text-[9px] bg-slate-800 text-slate-300 px-1.5 py-0.2 rounded font-semibold border border-slate-700">
                      Neves Pro CRM
                    </span>
                  </div>
                </div>
              </div>

              {/* SEÇÃO DE MENU: NAVEGAÇÃO COMERCIAL */}
              <div className="px-4 py-5">
                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2.5">
                  NAVEGAÇÃO COMERCIAL
                </p>
                <nav className="space-y-1.5">
                  <a 
                    href="index.html" 
                    className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition"
                  >
                    <i data-lucide="layout-grid" className="w-4 h-4"></i>
                    <span>Página Inicial</span>
                  </a>
                  <a 
                    href="vendas.html" 
                    className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold bg-indigo-700 text-white shadow-md transition"
                  >
                    <i data-lucide="shopping-cart" className="w-4 h-4"></i>
                    <span>Página de Vendas</span>
                  </a>
                  <a 
                    href="comissoes.html" 
                    className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition"
                  >
                    <i data-lucide="briefcase" className="w-4 h-4"></i>
                    <span>Comissões</span>
                  </a>
                </nav>
              </div>
            </div>

            {/* CARD DE OPERADOR E RODAPÉ */}
            <div className="p-4 border-t border-slate-800 relative z-10 space-y-3">
              <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex items-center gap-3 shadow-inner">
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center text-xs font-bold shrink-0">
                  <i data-lucide="user" className="w-4 h-4"></i>
                </div>
                <div className="truncate">
                  <p className="text-xs font-bold text-slate-200 leading-tight">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400 truncate">operador@nevespro.com</p>
                </div>
              </div>

              <div className="text-[9px] text-slate-500 text-center leading-tight">
                <p>Neves Pro CRM, Todos os Direitos Reservado</p>
                <p className="text-indigo-400 font-semibold mt-0.5">Por Daniel Silva</p>
              </div>
            </div>
          </aside>

          {/* MAIN CONTAINER */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            
            {/* TOPBAR GLOBAL */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Neves Pro CRM</span>
                <span className="text-slate-400">&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  Página de Vendas & Central de Cobranças
                </span>
              </div>

              <div className="flex items-center gap-3">
                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  ● SISTEMA ONLINE
                </span>

                <button className="w-8 h-8 rounded-full border border-slate-200/80 bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center transition" title="Central de Ajuda">
                  <i data-lucide="help-circle" className="w-4 h-4"></i>
                </button>

                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs shadow-sm ring-2 ring-indigo-600/20">
                  OP
                </div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              
              {/* CABEÇALHO DO MÓDULO */}
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>

                <form onSubmit={handleModalPartialSubmit} className="space-y-3">
                  <div>
                    <label className="text-[11px] font-semibold text-slate-600 block mb-1">Valor do Abatimento (R$)</label>
                    <input 
                      type="text" 
                      placeholder="Ex: 250.00" 
                      value={partialInput} 
                      onChange={e => setPartialInput(e.target.value)} 
                      className="w-full text-xs p-2.5 border rounded-xl bg-slate-50 font-extrabold outline-none focus:ring-2 focus:ring-indigo-600/30" 
                      required 
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setModalPartial(null)} 
                      className="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-1.5 rounded-xl text-xs font-bold text-white bg-indigo-700 hover:bg-indigo-800 shadow"
                    >
                      Confirmar Abatimento
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
