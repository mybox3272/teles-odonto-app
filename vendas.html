    // =========================================================================
    // FUNÇÃO ROBUSTA DE VERIFICAÇÃO DE STATUS DE PARCELA (CORREÇÃO DE DATAS)

    const verificarStatusParcela = (dueDateStr, statusAtual) => {
      if (statusAtual === 'Pago') {
        return { status: 'Pago', diasAtraso: 0, isVencido: false };
      }

      if (!dueDateStr) {
        return { status: statusAtual || 'Em aberto', diasAtraso: 0, isVencido: false };
      }

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);

      let dataVenc;
      if (typeof dueDateStr === 'string' && dueDateStr.includes('/')) {
        // Formato brasileiro DD/MM/AAAA
        const parts = dueDateStr.split('/').map(Number);
        if (parts.length === 3) {
          dataVenc = new Date(parts[2], parts[1] - 1, parts[0], 0, 0, 0, 0);
        }
      } else if (typeof dueDateStr === 'string' && dueDateStr.includes('-')) {
        // Formato ISO AAAA-MM-DD
        const parts = dueDateStr.split('-').map(Number);
        if (parts.length === 3) {
          dataVenc = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
        }
      }

      if (!dataVenc || isNaN(dataVenc.getTime())) {
        dataVenc = new Date(dueDateStr);
        dataVenc.setHours(0, 0, 0, 0);
      }

      if (isNaN(dataVenc.getTime())) {
        return { status: statusAtual || 'Em aberto', diasAtraso: 0, isVencido: false };
      }

      // Se a data de vencimento for hoje ou posterior, está À VENCER
      if (dataVenc >= hoje) {
        const diffMs = dataVenc.getTime() - hoje.getTime();
        const diffDias = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
        return {
          status: 'À Vencer',
          diasAtraso: 0,
          diasParaVencer: diffDias,
          isVencido: false
        };
      }

      // Se venceu antes de hoje, calcula o atraso real
      const atrasoMs = hoje.getTime() - dataVenc.getTime();
      const atrasoDias = Math.floor(atrasoMs / (1000 * 60 * 60 * 24));
      return {
        status: 'Vencido',
        diasAtraso: atrasoDias > 0 ? atrasoDias : 1,
        diasParaVencer: 0,
        isVencido: true
      };
    };

    function App() {
      const [clients, setClients] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_clients');
          return saved ? JSON.parse(saved) : initialClientsSeed;
        } catch {

        }
      });

      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filtroTexto, setFiltroTexto] = useState('');
      const [abaFiltro, setAbaFiltro] = useState('TODOS'); // 'TODOS', 'COM_COMPRAS', 'INADIMPLENTES', 'A_RECEBER'
      const [selectedClientCod, setSelectedClientCod] = useState("4");

      // Estados para Amortização FIFO
      const [valorAmortizacao, setValorAmortizacao] = useState('');
      const [vendedorAmortizacao, setVendedorAmortizacao] = useState('ERDENIA');

      // Modais
      const [showModalEditarCliente, setShowModalEditarCliente] = useState(false);
      const [clienteEditando, setClienteEditando] = useState(null);

      const [showModalImportar, setShowModalImportar] = useState(false);
      const [textoImportacao, setTextoImportacao] = useState('');

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Sincronização em tempo real com Firebase Firestore
      useEffect(() => {
        const startListeners = () => {
          if (!window.db || !window.fb) return;

          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const qVendas = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));
            const unsubVendas = window.fb.onSnapshot(qVendas, (snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setSales(list);
              setLoading(false);
            }, () => setLoading(false));

            const clientesCol = window.fb.collection(window.db, "clientes");
            const unsubClientes = window.fb.onSnapshot(clientesCol, (snapshot) => {
              if (!snapshot.empty) {
                const firestoreClients = snapshot.docs.map(doc => ({ cod: doc.id, ...doc.data() }));
                setClients(prev => {
                  const map = {};
                  prev.forEach(c => map[String(c.cod)] = c);
                  firestoreClients.forEach(c => map[String(c.cod)] = { ...map[String(c.cod)], ...c });
                  const merged = Object.values(map);
                  localStorage.setItem('neves_crm_clients', JSON.stringify(merged));
                  return merged;
                });
              }
            });

            return () => { unsubVendas(); unsubClientes(); };
          } catch (e) {
            console.error("Erro listeners vendas.html:", e);
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListeners();
        } else {
          window.addEventListener("firebase-ready", startListeners);
          return () => window.removeEventListener("firebase-ready", startListeners);
        }
      }, []);

      // Agrupamento financeiro de cada cliente na carteira
      const dadosFinanceirosPorCliente = useMemo(() => {
        const map = {};

        clients.forEach(c => {
          map[String(c.cod)] = {
            totalComprado: 0,
            totalPago: 0,
            totalEmAberto: 0,
            totalVencido: 0,
            pedidosCount: 0,
            temVencido: false,
            temAReceber: false
          };
        });

        sales.forEach(sale => {
          const cod = String(sale.codCliente);
          if (!map[cod]) {
            map[cod] = { totalComprado: 0, totalPago: 0, totalEmAberto: 0, totalVencido: 0, pedidosCount: 0, temVencido: false, temAReceber: false };
          }

          map[cod].pedidosCount += 1;
          map[cod].totalComprado += Number(sale.amount) || 0;

          (sale.installments || []).forEach(inst => {
            const amt = Number(inst.amount) || 0;
            if (inst.status === 'Pago') {
              map[cod].totalPago += amt;
            } else {
              map[cod].totalEmAberto += amt;
              map[cod].temAReceber = true;
              
              const st = verificarStatusParcela(inst.dueDate, inst.status);
              if (st.isVencido) {
                map[cod].totalVencido += amt;
                map[cod].temVencido = true;
              }
            }
          });
        });

        // Caso de amostragem padrão para Leonardo Amorim (#4) se ainda não houver dados no Firestore
        if (map["4"] && map["4"].pedidosCount === 0) {
          map["4"] = {
            totalComprado: 3200.00,
            totalPago: 1600.00,
            totalEmAberto: 1600.00,
            totalVencido: 0,
            pedidosCount: 1,
            temVencido: false,
            temAReceber: true
          };
        }

        return map;
      }, [clients, sales]);

      // Filtragem da carteira
      const clientesFiltrados = useMemo(() => {
        return clients.filter(c => {
          const cod = String(c.cod);
          const fin = dadosFinanceirosPorCliente[cod] || { pedidosCount: 0, temVencido: false, temAReceber: false };

          // Filtro por abas
          if (abaFiltro === 'COM_COMPRAS' && fin.pedidosCount === 0) return false;
          if (abaFiltro === 'INADIMPLENTES' && !fin.temVencido) return false;
          if (abaFiltro === 'A_RECEBER' && !fin.temAReceber) return false;

          // Filtro por texto
          if (filtroTexto.trim()) {
            const termo = filtroTexto.toLowerCase();
            const bateNome = c.name && c.name.toLowerCase().includes(termo);
            const bateCod = cod.includes(termo);
            const bateCidade = c.cidade && c.cidade.toLowerCase().includes(termo);
            return bateNome || bateCod || bateCidade;
          }

          return true;
        });
      }, [clients, dadosFinanceirosPorCliente, abaFiltro, filtroTexto]);

      // Cliente selecionado atualmente para o Painel de Detalhes
      const clienteSelecionado = useMemo(() => {
        return clients.find(c => String(c.cod) === String(selectedClientCod)) || clients[0] || null;

        if (!clienteSelecionado) return [];

        // Se for o cliente #4 e não tiver vendas no Firestore, exibe DAV simulado

          return [{
            id: 'mock-dav-002',
            dav: '002',
            dateDisplay: '01/10/2026',
            amount: 3200.00,
            salesperson: 'ERDENIA',
            tipoVenda: 'TOTAL',
            description: 'Pedido Odonto Prótese Estética',
            installments: [
              { number: 1, amount: 1600.00, dueDate: '01/11/2026', status: 'À Vencer', paymentMethod: 'Boleto / Duplicata' },

          }];

        return lista;
      }, [sales, clienteSelecionado]);

      // Totais calculados do cliente selecionado
      const resumoFinanceiroCliente = useMemo(() => {
        if (!clienteSelecionado) return { comprado: 0, pago: 0, emAberto: 0 };
        const fin = dadosFinanceirosPorCliente[String(clienteSelecionado.cod)];

          return { comprado: fin.totalComprado, pago: fin.totalPago, emAberto: fin.totalEmAberto };
        }
        return { comprado: 0, pago: 0, emAberto: 0 };
      }, [clienteSelecionado, dadosFinanceirosPorCliente]);

      // Amortização Inteligente (Regra FIFO)
      const handleAmortizarSaldo = async () => {
        const valorNum = parseFloat(valorAmortizacao.replace(',', '.'));
        if (!valorNum || valorNum <= 0) {
          alert("Informe um valor de amortização válido.");
          return;
        }

        if (vendasDoCliente.length === 0) {
          alert("O cliente não possui vendas registradas para amortizar.");
          return;
        }

        let saldoRestante = valorNum;
        let alteracoesFeitas = 0;

        for (const venda of vendasDoCliente) {
          if (saldoRestante <= 0) break;

          let mudou = false;
          const novosInst = (venda.installments || []).map(inst => {
            if (inst.status !== 'Pago' && saldoRestante > 0) {
              const valorParc = Number(inst.amount) || 0;
              if (saldoRestante >= valorParc) {
                saldoRestante -= valorParc;
                mudou = true;
                return { ...inst, status: 'Pago', paidAt: new Date().toISOString() };
              } else {
                const novoValor = valorParc - saldoRestante;
                saldoRestante = 0;
                mudou = true;
                return { ...inst, amount: novoValor, note: `Abatido parcialmente` };
              }
            }
            return inst;
          });

          if (mudou) {
            alteracoesFeitas++;
            if (window.db && window.fb && venda.id) {
              try {
                await window.fb.updateDoc(window.fb.doc(window.db, "vendas", venda.id), {
                  installments: novosInst
                });
              } catch (e) {
                console.error("Erro ao atualizar venda:", e);
              }
            } else {
              setSales(prev => prev.map(s => s.id === venda.id ? { ...s, installments: novosInst } : s));
            }
          }
        }

        alert(`✅ Amortização de R$ ${valorNum.toFixed(2)} aplicada com sucesso!`);
        setValorAmortizacao('');
      };

      // Ação: Dar Baixa Direta em Parcela Específica
      const handleDarBaixaParcela = async (vendaId, numeroParcela) => {
        const vendaAlvo = sales.find(s => s.id === vendaId) || vendasDoCliente.find(s => s.id === vendaId);
        if (!vendaAlvo) return;

        const novosInst = (vendaAlvo.installments || []).map(inst => {
          if (inst.number === numeroParcela) {
            return { ...inst, status: 'Pago', paidAt: new Date().toISOString() };
          }
          return inst;
        });

        if (window.db && window.fb && vendaAlvo.id && !vendaAlvo.id.startsWith('mock')) {
          await window.fb.updateDoc(window.fb.doc(window.db, "vendas", vendaAlvo.id), {
            installments: novosInst
          });
        } else {
          setSales(prev => prev.map(s => s.id === vendaId ? { ...s, installments: novosInst } : s));
        }

        alert(`✅ Parcela ${numeroParcela} baixada com sucesso!`);
      };

      // Ação: Abater Parcial em Parcela Específica
      const handleAbaterParcial = async (vendaId, numeroParcela) => {
        const valorStr = prompt("Informe o valor a abater desta parcela (R$):");
        if (!valorStr) return;
        const abater = parseFloat(valorStr.replace(',', '.'));
        if (!abater || abater <= 0) {
          alert("Valor inválido.");
          return;
        }

        const vendaAlvo = sales.find(s => s.id === vendaId) || vendasDoCliente.find(s => s.id === vendaId);
        if (!vendaAlvo) return;

        const novosInst = (vendaAlvo.installments || []).map(inst => {
          if (inst.number === numeroParcela) {
            const valAtual = Number(inst.amount) || 0;
            if (abater >= valAtual) {
              return { ...inst, status: 'Pago', paidAt: new Date().toISOString() };
            } else {
              return { ...inst, amount: valAtual - abater };
            }
          }
          return inst;
        });

        if (window.db && window.fb && vendaAlvo.id && !vendaAlvo.id.startsWith('mock')) {
          await window.fb.updateDoc(window.fb.doc(window.db, "vendas", vendaAlvo.id), {
            installments: novosInst
          });
        } else {
          setSales(prev => prev.map(s => s.id === vendaId ? { ...s, installments: novosInst } : s));
        }

        alert(`✅ Abatimento de R$ ${abater.toFixed(2)} registrado!`);
      };

      // Ação: Excluir DAV de Teste

        if (!confirm(`Deseja realmente excluir o DAV #${davNum}? Esta ação não pode ser desfeita.`)) {
          return;

        if (window.db && window.fb && vendaId && !vendaId.startsWith('mock')) {

            await window.fb.deleteDoc(window.fb.doc(window.db, "vendas", vendaId));

            console.error("Erro ao excluir DAV:", e);

        } else {
          setSales(prev => prev.filter(s => s.id !== vendaId));
        }

        alert(`🗑️ DAV #${davNum} excluído com sucesso!`);
      };

      // Salvar Edição do Cliente

        e.preventDefault();
        if (!clienteEditando) return;

        setClients(prev => prev.map(c => String(c.cod) === String(clienteEditando.cod) ? clienteEditando : c));

        if (window.db && window.fb) {
          try {
            await window.fb.setDoc(window.fb.doc(window.db, "clientes", String(clienteEditando.cod)), clienteEditando, { merge: true });
          } catch (err) {
            console.error("Erro ao atualizar cliente:", err);
          }

        setShowModalEditarCliente(false);
        alert("✅ Dados do cliente atualizados com sucesso!");
      };

        <div className="flex flex-col md:flex-row min-h-screen">

          {/* ========================================== */}

            <div className="absolute -bottom-10 -right-10 w-56 h-56 pointer-events-none opacity-[0.06] brightness-200">
              <ToothWatermark className="w-full h-full text-white" />
            </div>

            <div className="relative z-10">
              <div className="p-6 border-b border-slate-800/80 flex flex-col gap-2">
                <div className="flex items-center gap-3">

                                </div>

                                {/* LISTAGEM DE PARCELAS COM AVALIAÇÃO DE STATUS CORRIGIDA */}
                                <div className="space-y-2 pt-2 border-t border-slate-200/60">
                                  {(venda.installments || []).map((inst, i) => {
                                    // Utiliza a função segura de cálculo de vencimento
                                    const infoStatus = verificarStatusParcela(inst.dueDate, inst.status);

                                    return (
                                      <div key={i} className="p-3 rounded-xl bg-white border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                        <div className="flex items-center gap-2.5">
                                          <span className="text-xs font-mono font-bold text-slate-400">
                                            {inst.number || i + 1}/{(venda.installments || []).length}
                                          </span>
                                          <div>
                                            <div className="flex items-center gap-2">
                                              <span className="text-xs font-extrabold text-slate-900">
                                                Parcela {inst.number || i + 1} • R$ {Number(inst.amount).toFixed(2)}
                                              </span>
                                              
                                              {/* BADGES COM STATUS CORRIGIDO */}
                                              {infoStatus.status === 'Pago' ? (
                                                <span className="text-[9px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">
                                                  ✓ Quitado
                                                </span>
                                              ) : infoStatus.status === 'Vencido' ? (
                                                <span className="text-[9px] font-black bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full">
                                                  ⚠️ Vencido ({infoStatus.diasAtraso}d)
                                                </span>
                                              ) : (
                                                <span className="text-[9px] font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">
                                                  ● À Vencer ({infoStatus.diasParaVencer || 0}d)
                                                </span>
                                              )}
                                            </div>
                                            <p className="text-[10px] text-slate-400 mt-0.5">
                                              Vencimento: <strong className="text-slate-700">{inst.dueDate}</strong>
                                            </p>
                                          </div>
                                        </div>

                                        {/* AÇÕES DA PARCELA */}
                                        {infoStatus.status !== 'Pago' && (
                                          <div className="flex items-center gap-1.5 shrink-0">
                                            <button 
                                              onClick={() => handleAbaterParcial(venda.id, inst.number || i + 1)}
                                              className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold transition"
                                            >
                                              Abater Parcial
                                            </button>
                                            <button 
                                              onClick={() => handleDarBaixaParcela(venda.id, inst.number || i + 1)}
                                              className="px-2.5 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-[10px] font-bold border border-emerald-200 transition"
                                            >
                                              Dar Baixa
                                            </button>
                                          </div>
                                        )}
                                      </div>
                                    );
                                  })}
                                </div>

                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                    </div>
                  ) : (
                    <div className="p-8 text-center text-xs text-slate-400 bg-white rounded-2xl border">
                      Selecione um cliente ao lado para ver a ficha detalhada.
                    </div>
                  )}
                </div>

              </div>

            </div>
          </main>

          {/* MODAL: EDITAR CLIENTE */}
          {showModalEditarCliente && clienteEditando && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full space-y-4 shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center border-b pb-2">
                  <h4 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <i data-lucide="user-check" className="w-5 h-5 text-indigo-700"></i>
                    <span>Editar Cadastro #{clienteEditando.cod}</span>
                  </h4>
                  <button onClick={() => setShowModalEditarCliente(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>

                <form onSubmit={handleSalvarEdicaoCliente} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Nome / Razão Social *</label>
                    <input 
                      type="text" 
                      value={clienteEditando.name} 
                      onChange={e => setClienteEditando({ ...clienteEditando, name: e.target.value })} 
                      className="w-full p-2.5 border rounded-xl bg-slate-50 font-bold outline-none" 
                      required 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">CPF ou CNPJ</label>
                      <input 
                        type="text" 
                        value={clienteEditando.cpf_cnpj || ''} 
                        onChange={e => setClienteEditando({ ...clienteEditando, cpf_cnpj: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Categoria</label>
                      <input 
                        type="text" 
                        value={clienteEditando.categoria || ''} 
                        onChange={e => setClienteEditando({ ...clienteEditando, categoria: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Logradouro</label>
                      <input 
                        type="text" 
                        value={clienteEditando.logradouro || ''} 
                        onChange={e => setClienteEditando({ ...clienteEditando, logradouro: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                    <div className="col-span-2">
                      <label className="font-semibold text-slate-600 block mb-1">Endereço</label>
                      <input 
                        type="text" 
                        value={clienteEditando.endereco || ''} 
                        onChange={e => setClienteEditando({ ...clienteEditando, endereco: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Número</label>
                      <input 
                        type="text" 
                        value={clienteEditando.numero || ''} 
                        onChange={e => setClienteEditando({ ...clienteEditando, numero: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none text-center font-bold" 
                      />
                    </div>
                    <div className="col-span-2">
                      <label className="font-semibold text-slate-600 block mb-1">Bairro</label>
                      <input 
                        type="text" 
                        value={clienteEditando.bairro || ''} 
                        onChange={e => setClienteEditando({ ...clienteEditando, bairro: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Cidade</label>
                      <input 
                        type="text" 
                        value={clienteEditando.cidade || ''} 
                        onChange={e => setClienteEditando({ ...clienteEditando, cidade: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">UF</label>
                      <input 
                        type="text" 
                        value={clienteEditando.uf || ''} 
                        onChange={e => setClienteEditando({ ...clienteEditando, uf: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none text-center font-bold" 
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button 
                      type="button" 
                      onClick={() => setShowModalEditarCliente(false)} 
                      className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-indigo-700 hover:bg-indigo-800 shadow"
                    >
                      Salvar Alterações
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: IMPORTAR CLIENTES EM LOTE */}
          {showModalImportar && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full space-y-4 shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center border-b pb-2">
                  <h4 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <i data-lucide="file-spreadsheet" className="w-5 h-5 text-indigo-700"></i>
                    <span>Importar Lista em Lote (Excel / CSV)</span>
                  </h4>
                  <button onClick={() => setShowModalImportar(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>

                <p className="text-xs text-slate-500">
                  Cole as linhas da sua planilha (Código, Nome, Categoria, Cidade, Telefone) separadas por tabulação ou vírgula:
                </p>

                <textarea 
                  rows="6"
                  placeholder="2; JOÃO PESSOA MEDEIROS COSTA; Prótese Fixa; Fortaleza; 85 99122-3344"
                  value={textoImportacao}
                  onChange={e => setTextoImportacao(e.target.value)}
                  className="w-full p-3 border rounded-2xl bg-slate-50 font-mono text-xs outline-none focus:ring-2 focus:ring-indigo-600/30"
                ></textarea>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button 
                    type="button" 
                    onClick={() => setShowModalImportar(false)} 
                    className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200"
                  >
                    Fechar
                  </button>
                  <button 
                    type="button" 
                    onClick={() => {
                      if (!textoImportacao.trim()) return;
                      const linhas = textoImportacao.split('\n');
                      const novos = [];
                      linhas.forEach(linha => {
                        const parts = linha.includes(';') ? linha.split(';') : linha.includes('\t') ? linha.split('\t') : linha.split(',');
                        if (parts.length >= 2) {
                          novos.push({
                            cod: parts[0].trim(),
                            name: parts[1].trim(),
                            categoria: parts[2] ? parts[2].trim() : 'Geral',
                            cidade: parts[3] ? parts[3].trim() : 'Fortaleza',
                            uf: 'CE',
                            telefone: parts[4] ? parts[4].trim() : ''
                          });
                        }
                      });
                      if (novos.length > 0) {
                        setClients(prev => [...prev, ...novos]);
                        alert(`✅ ${novos.length} clientes adicionados à carteira!`);
                        setShowModalImportar(false);
                      }
                    }}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-indigo-700 hover:bg-indigo-800 shadow"
                  >
                    Processar e Adicionar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
