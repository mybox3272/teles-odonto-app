    const { useState, useEffect, useMemo } = React;

    const formatBRL = (val) => {
      const n = Number(val) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const verificarStatusParcela = (dueDateStr, statusAtual) => {
      if (statusAtual === 'Pago') return { status: 'Pago', diasAtraso: 0, isVencido: false };
      if (!dueDateStr) return { status: statusAtual || 'Em aberto', diasAtraso: 0, isVencido: false };

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);

      let dataVenc;
      if (typeof dueDateStr === 'string' && dueDateStr.includes('/')) {
        const parts = dueDateStr.split('/').map(Number);
        if (parts.length === 3) dataVenc = new Date(parts[2], parts[1] - 1, parts[0], 0, 0, 0, 0);
      } else if (typeof dueDateStr === 'string' && dueDateStr.includes('-')) {
        const parts = dueDateStr.split('-').map(Number);
        if (parts.length === 3) dataVenc = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
      }

      if (!dataVenc || isNaN(dataVenc.getTime())) {
        dataVenc = new Date(dueDateStr);
        dataVenc.setHours(0, 0, 0, 0);
      }

      if (isNaN(dataVenc.getTime())) return { status: statusAtual || 'Em aberto', diasAtraso: 0, isVencido: false };

      if (dataVenc >= hoje) {
        const diffMs = dataVenc.getTime() - hoje.getTime();
        const diffDias = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
        return { status: 'À Vencer', diasAtraso: 0, diasParaVencer: diffDias, isVencido: false };
      }

      const atrasoMs = hoje.getTime() - dataVenc.getTime();
      const atrasoDias = Math.floor(atrasoMs / (1000 * 60 * 60 * 24));
      return { status: 'Vencido', diasAtraso: atrasoDias > 0 ? atrasoDias : 1, diasParaVencer: 0, isVencido: true };
    };

    const initialClientsSeed = [

      { cod: "4", name: "LEONARDO AMORIM DE FRANCA E SOUSA", cpf_cnpj: "043.***.***-89", categoria: "Prótese Total e Parcial", logradouro: "Av.", endereco: "Santos Dumont", numero: "1200", bairro: "Aldeota", cidade: "Fortaleza", uf: "CE", ddd: "85", telefone: "98844-1234", area: "Fortaleza Metropolitana", vendor: "Luis Daniel da Silva" },
      { cod: "5", name: "IMPRESSIONE LABORATÓRIO DE PROTESE LTDA", cpf_cnpj: "12.345.678/0001-90", categoria: "Ortodontia & Fixa", logradouro: "Av.", endereco: "Dom Luís", numero: "800", bairro: "Aldeota", cidade: "Fortaleza", uf: "CE", ddd: "85", telefone: "98711-2233", area: "Fortaleza Leste", vendor: "André Luiz Nóbrega Martins" },

          if (clienteParam) setSelectedClientCod(String(clienteParam).trim());
        } catch (e) {
          console.error(e);
        }
      }, []);

      useEffect(() => {
        const startListeners = () => {
          if (!window.db || !window.fb) return;
          try {
            const vendasCol = window.fb.collection(window.db, "vendas");
            const qVendas = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));
            window.fb.onSnapshot(qVendas, (snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setSales(list);
              setLoading(false);
            });

            const clientesCol = window.fb.collection(window.db, "clientes");
            window.fb.onSnapshot(clientesCol, (snapshot) => {
              if (!snapshot.empty) {
                const firestoreClients = snapshot.docs.map(doc => ({ cod: doc.id, ...doc.data() }));
                setClients(prev => {
                  const map = {};
                  prev.forEach(c => map[String(c.cod)] = c);
                  firestoreClients.forEach(c => map[String(c.cod)] = { ...map[String(c.cod)], ...c });
                  const merged = Object.values(map);
                  localStorage.setItem('neves_crm_clients', JSON.stringify(merged));
                  return merged;
                });
              }
            });
          } catch (e) {
            console.error(e);
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListeners();
        } else {
          window.addEventListener("firebase-ready", startListeners);
          return () => window.removeEventListener("firebase-ready", startListeners);
        }
      }, []);

      const dadosFinanceirosPorCliente = useMemo(() => {
        const map = {};
        clients.forEach(c => {
          map[String(c.cod)] = { totalComprado: 0, totalPago: 0, totalEmAberto: 0, totalVencido: 0, pedidosCount: 0, temVencido: false, temAReceber: false };
        });

        sales.forEach(sale => {
          const cod = String(sale.codCliente);
          if (!map[cod]) map[cod] = { totalComprado: 0, totalPago: 0, totalEmAberto: 0, totalVencido: 0, pedidosCount: 0, temVencido: false, temAReceber: false };
          map[cod].pedidosCount += 1;
          map[cod].totalComprado += Number(sale.amount) || 0;

          (sale.installments || []).forEach(inst => {
            const amt = Number(inst.amount) || 0;
            if (inst.status === 'Pago') {
              map[cod].totalPago += amt;
            } else {
              map[cod].totalEmAberto += amt;
              map[cod].temAReceber = true;
              const st = verificarStatusParcela(inst.dueDate, inst.status);
              if (st.isVencido) {
                map[cod].totalVencido += amt;
                map[cod].temVencido = true;
              }
            }
          });
        });

        return map;
      }, [clients, sales]);

      const clientesFiltrados = useMemo(() => {
        return clients.filter(c => {
          const cod = String(c.cod);
          const fin = dadosFinanceirosPorCliente[cod] || { pedidosCount: 0, temVencido: false, temAReceber: false };
          if (abaFiltro === 'COM_COMPRAS' && fin.pedidosCount === 0) return false;
          if (abaFiltro === 'INADIMPLENTES' && !fin.temVencido) return false;
          if (abaFiltro === 'A_RECEBER' && !fin.temAReceber) return false;

          if (filtroTexto.trim()) {
            const termo = filtroTexto.toLowerCase();
            return (c.name && c.name.toLowerCase().includes(termo)) || cod.includes(termo) || (c.cidade && c.cidade.toLowerCase().includes(termo));
          }
          return true;
        });
      }, [clients, dadosFinanceirosPorCliente, abaFiltro, filtroTexto]);

      const clienteSelecionado = useMemo(() => {
        return clients.find(c => String(c.cod) === String(selectedClientCod)) || clients[0] || null;
      }, [clients, selectedClientCod]);

      const vendasDoCliente = useMemo(() => {
        if (!clienteSelecionado) return [];
        return sales.filter(s => String(s.codCliente) === String(clienteSelecionado.cod));
      }, [sales, clienteSelecionado]);

      const resumoFinanceiroCliente = useMemo(() => {
        if (!clienteSelecionado) return { comprado: 0, pago: 0, emAberto: 0 };
        const fin = dadosFinanceirosPorCliente[String(clienteSelecionado.cod)];
        return fin ? { comprado: fin.totalComprado, pago: fin.totalPago, emAberto: fin.totalEmAberto } : { comprado: 0, pago: 0, emAberto: 0 };
      }, [clienteSelecionado, dadosFinanceirosPorCliente]);

      const metricasGerais = useMemo(() => {
        let vencendoHojeValor = 0;
        let vencendoHojeCount = 0;
        let vencendoMesValor = 0;
        let vencendoMesCount = 0;

        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        const mesAtual = hoje.getMonth();
        const anoAtual = hoje.getFullYear();

        sales.forEach(sale => {
          (sale.installments || []).forEach(inst => {
            if (inst.status !== 'Pago') {
              const valorParc = Number(inst.amount) || 0;
              let dataVenc;
              if (typeof inst.dueDate === 'string' && inst.dueDate.includes('/')) {
                const parts = inst.dueDate.split('/').map(Number);
                if (parts.length === 3) dataVenc = new Date(parts[2], parts[1] - 1, parts[0], 0, 0, 0, 0);
              }
              if (dataVenc && !isNaN(dataVenc.getTime())) {
                if (dataVenc.getTime() === hoje.getTime()) {
                  vencendoHojeValor += valorParc;
                  vencendoHojeCount++;
                }
                if (dataVenc.getMonth() === mesAtual && dataVenc.getFullYear() === anoAtual) {
                  vencendoMesValor += valorParc;
                  vencendoMesCount++;
                }
              }
            }
          });
        });

        return { vencendoHojeValor, vencendoHojeCount, vencendoMesValor, vencendoMesCount };
      }, [sales]);

      const handleAmortizarSaldo = async () => {
        const valorNum = parseFloat(valorAmortizacao.replace(',', '.'));
        if (!valorNum || valorNum <= 0) return alert("Informe um valor válido.");
        if (vendasDoCliente.length === 0) return alert("Nenhuma venda para amortizar.");

        let saldoRestante = valorNum;
        for (const venda of vendasDoCliente) {
          if (saldoRestante <= 0) break;
          let mudou = false;
          const novosInst = (venda.installments || []).map(inst => {
            if (inst.status !== 'Pago' && saldoRestante > 0) {
              const valorParc = Number(inst.amount) || 0;
              if (saldoRestante >= valorParc) {
                saldoRestante -= valorParc;
                mudou = true;
                return { ...inst, status: 'Pago', paidAt: new Date().toISOString() };
              } else {
                const novoValor = parseFloat((valorParc - saldoRestante).toFixed(2));
                saldoRestante = 0;
                mudou = true;
                return { ...inst, amount: novoValor };
              }
            }
            return inst;
          });

          if (mudou && window.db && window.fb && venda.id) {
            await window.fb.updateDoc(window.fb.doc(window.db, "vendas", venda.id), {
              installments: novosInst,
              isPaid: novosInst.every(i => i.status === 'Pago')
            });
          }
        }
        alert(`✅ Amortização de R$ ${valorNum.toFixed(2)} aplicada!`);
        setValorAmortizacao('');
      };

      const handleDarBaixaParcela = async (vendaId, numeroParcela) => {
        const vendaAlvo = sales.find(s => s.id === vendaId) || vendasDoCliente.find(s => s.id === vendaId);
        if (!vendaAlvo) return;
        const novosInst = (vendaAlvo.installments || []).map(inst => inst.number === numeroParcela ? { ...inst, status: 'Pago', paidAt: new Date().toISOString() } : inst);
        if (window.db && window.fb && vendaAlvo.id) {
          await window.fb.updateDoc(window.fb.doc(window.db, "vendas", vendaAlvo.id), { installments: novosInst, isPaid: novosInst.every(i => i.status === 'Pago') });
        }
        alert(`✅ Parcela ${numeroParcela} baixada!`);
      };

      const handleAbaterParcial = async (vendaId, numeroParcela) => {
        const valorStr = prompt("Valor a abater (R$):");
        if (!valorStr) return;
        const abater = parseFloat(valorStr.replace(',', '.'));
        const vendaAlvo = sales.find(s => s.id === vendaId) || vendasDoCliente.find(s => s.id === vendaId);
        if (!vendaAlvo) return;
        const novosInst = (vendaAlvo.installments || []).map(inst => {
          if (inst.number === numeroParcela) {
            const valAtual = Number(inst.amount) || 0;
            return abater >= valAtual ? { ...inst, status: 'Pago', paidAt: new Date().toISOString() } : { ...inst, amount: parseFloat((valAtual - abater).toFixed(2)) };
          }
          return inst;
        });
        if (window.db && window.fb && vendaAlvo.id) {
          await window.fb.updateDoc(window.fb.doc(window.db, "vendas", vendaAlvo.id), { installments: novosInst, isPaid: novosInst.every(i => i.status === 'Pago') });
        }
        alert(`✅ Abatimento de R$ ${abater.toFixed(2)} registrado!`);
      };

      const handleExcluirDAV = async (vendaId, davNum) => {
        if (!confirm(`Deseja realmente excluir o DAV #${davNum}?`)) return;
        if (window.db && window.fb && vendaId) {
          await window.fb.deleteDoc(window.fb.doc(window.db, "vendas", vendaId));
        } else {
          setSales(prev => prev.filter(s => s.id !== vendaId));
        }
        alert(`🗑️ DAV #${davNum} excluído!`);
      };

      return (

              {/* CABEÇALHO */}
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <span className="text-[10px] font-bold text-indigo-700 uppercase tracking-widest">
                    MÓDULO FINANCEIRO • CARTEIRA ATIVA • Exercício Fiscal 2026
                  </span>
                  <h2 className="text-2xl font-black text-slate-900 mt-1">Carteira de Clientes e Vendas</h2>

                    Consulte os {clients.length} clientes cadastrados, filtre inadimplentes ou parcelas à receber e dê baixa.
                  </p>
                </div>

                <div className="flex items-center flex-wrap gap-2">
                  <button 
                    onClick={() => setShowModalImportar(true)}
                    className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 shadow-xs"
                  >
                    <i data-lucide="file-spreadsheet" className="w-4 h-4 text-slate-500"></i>
                    <span>Importar Clientes</span>
                  </button>

                  <a 
                    href="index.html" 
                    className="flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-700 text-white text-xs font-black hover:bg-indigo-800 shadow-md shadow-indigo-600/20"
                  >
                    <i data-lucide="plus-circle" className="w-4 h-4"></i>
                    <span>Novo Pedido / DAV</span>
                  </a>
                </div>
              </div>

              {/* 2 CARDS SUPERIORES DINÂMICOS */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-white p-5 rounded-2xl border-l-4 border-l-indigo-600 border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-start">
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600">
                        <i data-lucide="calendar" className="w-4 h-4"></i>
                      </div>
                      <div>
                        <span className="text-xs font-bold text-slate-800 block">Vencendo Hoje</span>
                        <span className="text-[11px] text-slate-400">Liquidações programadas para o dia corrente</span>
                      </div>
                    </div>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">
                      {metricasGerais.vencendoHojeCount} parcela(s)
                    </span>
                  </div>
                  <div className="mt-4 flex justify-between items-baseline">
                    <span className="text-2xl font-black text-slate-900">{formatBRL(metricasGerais.vencendoHojeValor)}</span>
                    <span className="text-[11px] font-semibold text-indigo-600">Posição em tempo real</span>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border-l-4 border-l-blue-500 border border-slate-200/80 shadow-sm">
                  <div className="flex justify-between items-start">
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600">
                        <i data-lucide="trending-up" className="w-4 h-4"></i>
                      </div>
                      <div>
                        <span className="text-xs font-bold text-slate-800 block">Vencendo no Mês Atual (Novembro/2026)</span>
                        <span className="text-[11px] text-slate-400">Projeção total de recebimento</span>
                      </div>
                    </div>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800">
                      {metricasGerais.vencendoMesCount} parcela(s)
                    </span>
                  </div>
                  <div className="mt-4 flex justify-between items-baseline">
                    <span className="text-2xl font-black text-slate-900">{formatBRL(metricasGerais.vencendoMesValor)}</span>
                    <span className="text-[11px] font-semibold text-slate-400">Carteira Ativa</span>
                  </div>
                </div>
              </div>

              {/* FILTROS TÁTICOS E BUSCA */}
              <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
                <div className="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
                  <button 
                    onClick={() => setAbaFiltro('TODOS')}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${
                      abaFiltro === 'TODOS' ? 'bg-indigo-700 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    👥 Todos ({clients.length})
                  </button>

                  <button 
                    onClick={() => setAbaFiltro('COM_COMPRAS')}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${
                      abaFiltro === 'COM_COMPRAS' ? 'bg-indigo-700 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    ● Com compras ({Object.values(dadosFinanceirosPorCliente).filter(f => f.pedidosCount > 0).length})
                  </button>

                  <button 
                    onClick={() => setAbaFiltro('INADIMPLENTES')}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${
                      abaFiltro === 'INADIMPLENTES' ? 'bg-rose-600 text-white shadow-xs' : 'bg-rose-50 text-rose-700 hover:bg-rose-100'
                    }`}
                  >
                    ● Inadimplentes ({Object.values(dadosFinanceirosPorCliente).filter(f => f.temVencido).length})
                  </button>

                  <button 
                    onClick={() => setAbaFiltro('A_RECEBER')}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${
                      abaFiltro === 'A_RECEBER' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100'
                    }`}
                  >
                    ● À receber ({Object.values(dadosFinanceirosPorCliente).filter(f => f.temAReceber).length})
                  </button>
                </div>

                <div className="relative min-w-[260px]">
                  <input 
                    type="text" 
                    placeholder="Buscar por código ou nome..." 
                    value={filtroTexto} 
                    onChange={e => setFiltroTexto(e.target.value)} 
                    className="w-full pl-9 pr-4 py-2 border rounded-xl bg-white text-xs font-semibold outline-none focus:ring-2 focus:ring-indigo-600/30"
                  />
                  <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                </div>
              </div>

              {/* MASTER-DETAIL */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                {/* LISTAGEM (MASTER) */}
                <div className="lg:col-span-7 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                  <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div>
                      <span className="text-xs font-bold text-slate-800">Listagem da Carteira</span>
                      <span className="text-[11px] text-slate-400 ml-2">{clientesFiltrados.length} listados</span>
                    </div>
                    <span className="text-[10px] text-slate-500 font-medium">Clique para abrir a ficha</span>
                  </div>

                  <div className="divide-y divide-slate-100">
                    {clientesFiltrados.map(c => {
                      const cod = String(c.cod);
                      const isSelected = String(selectedClientCod) === cod;
                      const fin = dadosFinanceirosPorCliente[cod] || { totalComprado: 0, pedidosCount: 0, temVencido: false, temAReceber: false };

                      return (
                        <div 
                          key={cod} 
                          onClick={() => setSelectedClientCod(cod)}
                          className={`p-4 flex items-center justify-between cursor-pointer transition ${
                            isSelected ? 'bg-indigo-50/60 border-l-4 border-l-indigo-600' : 'hover:bg-slate-50'
                          }`}
                        >
                          <div className="flex items-center gap-3 min-w-0">
                            <span className="w-8 text-xs font-mono font-bold text-indigo-700">#{cod}</span>
                            <div className="min-w-0">
                              <h4 className="text-xs font-bold text-slate-900 truncate">{c.name}</h4>
                              <p className="text-[11px] text-slate-400 truncate">{c.categoria} • {c.cidade} - {c.uf}</p>
                            </div>
                          </div>

                          <div className="text-right shrink-0 ml-4 flex items-center gap-4">
                            <div>
                              <span className="text-xs font-black text-slate-900 block">{formatBRL(fin.totalComprado)}</span>
                              <span className="text-[10px] text-slate-400">{fin.pedidosCount} pedido(s)</span>
                            </div>

                            <div>
                              {fin.temVencido ? (
                                <span className="text-[10px] font-bold bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full">● Vencido</span>
                              ) : fin.temAReceber ? (
                                <span className="text-[10px] font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">● À vencer</span>
                              ) : (
                                <span className="text-[10px] font-semibold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">Sem débitos</span>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* FICHA DETALHADA (DETAIL) */}
                <div className="lg:col-span-5 space-y-4">
                  {clienteSelecionado && (
                    <div className="space-y-4">
                      
                      {/* CARD DO CLIENTE */}
                      <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">
                                Cód: #{clienteSelecionado.cod}
                              </span>
                              <span className="text-[10px] text-slate-400">CPF/CNPJ: {clienteSelecionado.cpf_cnpj || 'Não informado'}</span>
                            </div>
                            <h3 className="text-sm font-black text-slate-900 mt-1">{clienteSelecionado.name}</h3>
                            <p className="text-[11px] text-slate-500 mt-0.5">
                              {clienteSelecionado.logradouro} {clienteSelecionado.endereco}, {clienteSelecionado.numero} - {clienteSelecionado.bairro}, {clienteSelecionado.cidade}
                            </p>
                          </div>
                        </div>

                        {/* SALDOS REAIS */}
                        <div className="grid grid-cols-3 gap-2 pt-2 border-t text-center">
                          <div className="bg-slate-50 p-2.5 rounded-xl">
                            <span className="text-[9px] font-bold text-slate-400 uppercase block">TOTAL COMPRADO</span>
                            <span className="text-xs font-black text-slate-900 mt-0.5 block">{formatBRL(resumoFinanceiroCliente.comprado)}</span>
                          </div>
                          <div className="bg-slate-50 p-2.5 rounded-xl">
                            <span className="text-[9px] font-bold text-slate-400 uppercase block">TOTAL PAGO</span>
                            <span className="text-xs font-black text-emerald-600 mt-0.5 block">{formatBRL(resumoFinanceiroCliente.pago)}</span>
                          </div>
                          <div className="bg-slate-50 p-2.5 rounded-xl">
                            <span className="text-[9px] font-bold text-slate-400 uppercase block">EM ABERTO</span>
                            <span className="text-xs font-black text-indigo-700 mt-0.5 block">{formatBRL(resumoFinanceiroCliente.emAberto)}</span>
                          </div>
                        </div>
                      </div>

                      {/* AMORTIZAÇÃO FIFO */}
                      <div className="bg-indigo-900 text-white p-5 rounded-2xl shadow-md space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold flex items-center gap-2 text-indigo-200">
                            <i data-lucide="credit-card" className="w-4 h-4"></i>
                            Promissória & Amortização FIFO
                          </span>
                        </div>
                        <p className="text-[11px] text-indigo-200/80 leading-relaxed">
                          Digite o valor arrecadado para amortizar automaticamente nas parcelas mais antigas deste cliente.
                        </p>

                        <div className="flex gap-2">
                          <input 
                            type="text" 
                            placeholder="R$ 800,00" 
                            value={valorAmortizacao} 
                            onChange={e => setValorAmortizacao(e.target.value)} 
                            className="flex-1 p-2 rounded-xl bg-white text-slate-900 font-black text-xs outline-none" 
                          />
                          <button 
                            onClick={handleAmortizarSaldo}
                            className="px-4 py-2 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black text-xs transition shadow flex items-center gap-1.5"
                          >
                            <i data-lucide="check" className="w-4 h-4"></i>
                            <span>Abater Saldo</span>
                          </button>
                        </div>
                      </div>

                      {/* HISTÓRICO DE TÍTULOS E VENDAS REAIS */}
                      <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                        <div className="flex justify-between items-center border-b pb-3">
                          <h4 className="text-xs font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="receipt" className="w-4 h-4 text-indigo-600"></i>
                            Histórico de Vendas & Títulos
                          </h4>
                          <span className="text-[11px] text-slate-400">{vendasDoCliente.length} DAV(s)</span>
                        </div>

                        {vendasDoCliente.length === 0 ? (
                          <div className="py-8 text-center text-xs text-slate-400 bg-slate-50 rounded-xl border border-dashed">
                            Nenhum título em aberto ou histórico de compra para este cliente.
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {vendasDoCliente.map(venda => (
                              <div key={venda.id || venda.dav} className="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-3">
                                
                                <div className="flex justify-between items-start">
                                  <div className="flex items-center gap-2.5">
                                    <div className="w-9 h-9 rounded-xl bg-indigo-700 text-white font-mono font-bold text-xs flex items-center justify-center shrink-0">
                                      #{venda.dav}
                                    </div>
                                    <div>
                                      <h5 className="text-xs font-bold text-slate-900">{venda.client}</h5>
                                      <p className="text-[10px] text-slate-400">Emitido em {venda.dateDisplay || venda.date}</p>
                                    </div>
                                  </div>

                                  <div className="flex items-center gap-2">
                                    <span className="text-xs font-black text-slate-900">{formatBRL(venda.amount)}</span>
                                    <button 
                                      onClick={() => handleExcluirDAV(venda.id, venda.dav)}
                                      title="Excluir DAV"
                                      className="p-1 rounded text-slate-400 hover:text-rose-600 transition"
                                    >
                                      <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                    </button>
                                  </div>
                                </div>

                                {/* LISTAGEM DE PARCELAS */}
                                <div className="space-y-2 pt-2 border-t border-slate-200/60">
                                  {(venda.installments || []).map((inst, i) => {
                                    const infoStatus = verificarStatusParcela(inst.dueDate, inst.status);

                                    return (
                                      <div key={i} className="p-2.5 rounded-xl bg-white border border-slate-200 flex items-center justify-between">
                                        <div>
                                          <div className="flex items-center gap-2">
                                            <span className="text-xs font-bold text-slate-900">
                                              Parcela {inst.number || i + 1} • {formatBRL(inst.amount)}
                                            </span>
                                            {infoStatus.status === 'Pago' ? (
                                              <span className="text-[9px] font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded">Quitado</span>
                                            ) : infoStatus.status === 'Vencido' ? (
                                              <span className="text-[9px] font-black bg-rose-100 text-rose-800 px-1.5 py-0.2 rounded">Vencido</span>
                                            ) : (
                                              <span className="text-[9px] font-bold bg-blue-100 text-blue-800 px-1.5 py-0.2 rounded">À Vencer</span>
                                            )}
                                          </div>
                                          <p className="text-[10px] text-slate-400">Vencimento: {inst.dueDate}</p>
                                        </div>

                                        {infoStatus.status !== 'Pago' && (
                                          <div className="flex items-center gap-1">
                                            <button 
                                              onClick={() => handleAbaterParcial(venda.id, inst.number || i + 1)}
                                              className="px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold"
                                            >
                                              Abater
                                            </button>
                                            <button 
                                              onClick={() => handleDarBaixaParcela(venda.id, inst.number || i + 1)}
                                              className="px-2 py-1 rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-[10px] font-bold border border-emerald-200"
                                            >
                                              Baixar
                                            </button>
                                          </div>
                                        )}
                                      </div>
                                    );
                                  })}
                                </div>

                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                    </div>
                  )}
                </div>

              </div>

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
