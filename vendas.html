    const initialClientsSeed = [

      {

        numero: "320",

    ];

    const sellersList = [
      { cod: "1", name: "André Luiz Nóbrega Martins", rate: "3.5%" },
      { cod: "2", name: "Luis Daniel da Silva", rate: "3.0%" }
    ];

    function App() {
      // Estado de Clientes: Carrega do LocalStorage ou do seed
      const [clients, setClients] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_clients');
          return saved ? JSON.parse(saved) : initialClientsSeed;
        } catch {
          return initialClientsSeed;
        }
      });

      const [selectedClient, setSelectedClient] = useState(null);
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [firebaseStatus, setFirebaseStatus] = useState('Conectando...');
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 8;

      // Amortização FIFO
      const [fifoAmount, setFifoAmount] = useState('');
      const [fifoVendor, setFifoVendor] = useState('1');
      const [fifoMsg, setFifoMsg] = useState('');
      const [processingFifo, setProcessingFifo] = useState(false);

      // Modal de Abatimento Parcial Individual
      const [modalPartial, setModalPartial] = useState(null);
      const [partialInput, setPartialInput] = useState('');

      // MODAL DE IMPORTAÇÃO EM LOTE DE CLIENTES
      const [showImportModal, setShowImportModal] = useState(false);
      const [importText, setImportText] = useState('');
      const [importVendorDefault, setImportVendorDefault] = useState('André Luiz');
      const [parsedPreview, setParsedPreview] = useState([]);
      const [importingFirebase, setImportingFirebase] = useState(false);
      const [importFeedback, setImportFeedback] = useState('');

      // MODAL DE CADASTRO INDIVIDUAL E EDIÇÃO
      const [showClientModal, setShowClientModal] = useState(false);
      const [modalMode, setModalMode] = useState('new'); // 'new' ou 'edit'
      const [clientFormData, setClientFormData] = useState({
        cod: '',
        name: '',
        categoria: '',
        logradouro: 'Av.',
        endereco: '',
        numero: '',
        bairro: '',
        cidade: '',
        uf: 'CE',
        ddd: '85',
        telefone: '',
        area: '',
        vendor: 'André Luiz'
      });

      // Salva no LocalStorage
      useEffect(() => {
        localStorage.setItem('neves_crm_clients', JSON.stringify(clients));
      }, [clients]);

      // Define cliente selecionado padrão
      useEffect(() => {
        if (!selectedClient && clients.length > 0) {
          setSelectedClient(clients[0]);
        }
      }, [clients, selectedClient]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const todayStr = useMemo(() => {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }, []);

      // Conexão em Tempo Real com Firestore (Vendas e Clientes)
      useEffect(() => {
        const startListeners = () => {
          if (!window.db || !window.fb) return;
          setFirebaseStatus('Online');

          try {
            // 1. Listener de Vendas
            const vendasCol = window.fb.collection(window.db, "vendas");
            const qVendas = window.fb.query(vendasCol, window.fb.orderBy("date", "desc"));

            const unsubVendas = window.fb.onSnapshot(qVendas, (snapshot) => {
              const docsList = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setSales(docsList);
              setLoading(false);
            }, (err) => {
              console.error("Erro listener vendas:", err);
              setFirebaseStatus('Atenção');
              setLoading(false);
            });

            // 2. Listener da Coleção "clientes"
            const clientesCol = window.fb.collection(window.db, "clientes");
            const unsubClientes = window.fb.onSnapshot(clientesCol, (snapshot) => {
              if (!snapshot.empty) {
                const firestoreClients = snapshot.docs.map(doc => ({
                  cod: doc.id,
                  ...doc.data()
                }));

                setClients(prev => {
                  const map = {};
                  prev.forEach(c => map[String(c.cod)] = c);
                  firestoreClients.forEach(c => map[String(c.cod)] = { ...map[String(c.cod)], ...c });
                  return Object.values(map);
                });
              }
            }, (err) => {
              console.warn("Coleção clientes em modo local/cache:", err);
            });

            return () => {
              unsubVendas();
              unsubClientes();
            };
          } catch (e) {
            console.error("Erro de conexão Firestore:", e);
            setFirebaseStatus('Offline');
            setLoading(false);
          }
        };

        if (window.db && window.fb) {
          startListeners();
        } else {
          window.addEventListener("firebase-ready", startListeners);
          return () => window.removeEventListener("firebase-ready", startListeners);
        }
      }, []);

      // DOWNLOAD DO ARQUIVO MODELO CSV
      const handleDownloadTemplate = () => {
        const header = "Codigo;Nome;Categoria;Logradouro;Endereco;Numero;Bairro;Cidade;UF;DDD;Telefone;Area;Vendedor\n";
        const ex1 = "101;Dr. Carlos Eduardo Silveira;Ortodontia;Av.;Santos Dumont;1200;Aldeota;Fortaleza;CE;85;987654321;Fortaleza Metropolitana;André Luiz\n";
        const ex2 = "102;Clinica Sorrir Bem Ltda;Prótese Fixa;Rua;Barata Ribeiro;200;Centro;Sobral;CE;88;998877665;Região Norte;Luis Daniel\n";
        const ex3 = "103;Laboratorio Dental Alpha;Dentistas;Travessa;das Flores;45;Benfica;Fortaleza;CE;85;981112233;Fortaleza Centro;André Luiz\n";

        const csvContent = "data:text/csv;charset=utf-8," + encodeURIComponent(header + ex1 + ex2 + ex3);
        const link = document.createElement("a");
        link.setAttribute("href", csvContent);
        link.setAttribute("download", "modelo_clientes_teles_odonto.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Parser inteligente das 12 colunas
      useEffect(() => {
        if (!importText.trim()) {
          setParsedPreview([]);
          return;
        }

        const lines = importText.trim().split(/\r?\n/);
        const parsed = [];

        lines.forEach(line => {
          if (!line.trim()) return;

          let parts = [];
          if (line.includes('\t')) parts = line.split('\t');
          else if (line.includes(';')) parts = line.split(';');
          else if (line.includes('|')) parts = line.split('|');
          else parts = line.split(',');

          const clean = parts.map(p => p.trim().replace(/^["']|["']$/g, ''));
          
          const first = clean[0]?.toLowerCase() || '';
          if (first === 'codigo' || first === 'código' || first === 'cod' || first === 'id') return;

          const cod = clean[0] || '';
          const name = clean[1] || '';
          if (!cod || !name) return;

          parsed.push({
            cod,
            name,
            categoria: clean[2] || '',
            logradouro: clean[3] || 'Av.',
            endereco: clean[4] || '',
            numero: clean[5] || '',
            bairro: clean[6] || '',
            cidade: clean[7] || '',
            uf: clean[8] || 'CE',
            ddd: clean[9] || '85',
            telefone: clean[10] || '',
            area: clean[11] || '',
            vendor: clean[12] || importVendorDefault
          });
        });

        setParsedPreview(parsed);
      }, [importText, importVendorDefault]);

      // Upload de Arquivo .CSV ou .TXT
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          setImportText(event.target.result || '');
        };
        reader.readAsText(file);
      };

      // Executar a Importação em Lote
      const handleConfirmBatchImport = async () => {
        if (parsedPreview.length === 0) {
          alert("Nenhum cliente válido reconhecido na prévia.");
          return;
        }

        setImportingFirebase(true);
        setImportFeedback('Gravando registros no Firebase Firestore...');

        try {
          setClients(prev => {
            const map = {};
            prev.forEach(c => map[String(c.cod)] = c);
            parsedPreview.forEach(c => map[String(c.cod)] = c);
            return Object.values(map);
          });

          if (window.db && window.fb) {
            const batch = window.fb.writeBatch(window.db);

            parsedPreview.forEach(c => {
              const clientDocRef = window.fb.doc(window.db, "clientes", String(c.cod));
              batch.set(clientDocRef, {
                ...c,
                atualizadoEm: new Date().toISOString()
              }, { merge: true });
            });

            await batch.commit();
          }

          setImportFeedback(`🎉 Sucesso! ${parsedPreview.length} cliente(s) importados e sincronizados!`);
          setTimeout(() => {
            setShowImportModal(false);
            setImportText('');
            setParsedPreview([]);
            setImportFeedback('');
          }, 1500);

        } catch (err) {
          console.error("Erro na gravação em lote:", err);
          setImportFeedback(`❌ Erro no Firestore: ${err.message}. Mas os clientes foram gravados localmente!`);
        } finally {
          setImportingFirebase(false);
        }
      };

      // ABRIR MODAL DE CLIENTE: NOVO OU EDIÇÃO
      const handleOpenClientModal = (mode, clientToEdit = null) => {
        setModalMode(mode);
        if (mode === 'edit' && clientToEdit) {
          setClientFormData({
            cod: clientToEdit.cod,
            name: clientToEdit.name,
            categoria: clientToEdit.categoria || '',
            logradouro: clientToEdit.logradouro || 'Av.',
            endereco: clientToEdit.endereco || '',
            numero: clientToEdit.numero || '',
            bairro: clientToEdit.bairro || '',
            cidade: clientToEdit.cidade || '',
            uf: clientToEdit.uf || 'CE',
            ddd: clientToEdit.ddd || '85',
            telefone: clientToEdit.telefone || '',
            area: clientToEdit.area || '',
            vendor: clientToEdit.vendor || 'André Luiz'
          });
        } else {
          setClientFormData({
            cod: '',
            name: '',
            categoria: '',
            logradouro: 'Av.',
            endereco: '',
            numero: '',
            bairro: '',
            cidade: '',
            uf: 'CE',
            ddd: '85',
            telefone: '',
            area: '',
            vendor: 'André Luiz'
          });
        }
        setShowClientModal(true);
      };

      // SALVAR CLIENTE (NOVO OU EDITADO)
      const handleSaveClientForm = async (e) => {
        e.preventDefault();
        if (!clientFormData.cod || !clientFormData.name) {
          alert("Atenção: Apenas Código e Nome são obrigatórios!");
          return;
        }

        const clientData = {
          cod: String(clientFormData.cod),
          name: clientFormData.name,
          categoria: clientFormData.categoria || '',
          logradouro: clientFormData.logradouro || 'Av.',
          endereco: clientFormData.endereco || '',
          numero: clientFormData.numero || '',
          bairro: clientFormData.bairro || '',
          cidade: clientFormData.cidade || '',
          uf: clientFormData.uf || 'CE',
          ddd: clientFormData.ddd || '85',
          telefone: clientFormData.telefone || '',
          area: clientFormData.area || '',
          vendor: clientFormData.vendor || 'André Luiz'
        };

        // Salva Local
        setClients(prev => {
          const map = {};
          prev.forEach(c => map[String(c.cod)] = c);
          map[clientData.cod] = clientData;
          return Object.values(map);
        });

        // Atualiza selecionado
        if (selectedClient?.cod === clientData.cod || modalMode === 'new') {
          setSelectedClient(clientData);
        }

        // Salva Firestore
        if (window.db && window.fb) {
          try {
            await window.fb.setDoc(window.fb.doc(window.db, "clientes", clientData.cod), clientData, { merge: true });
          } catch (err) {
            console.error("Erro ao gravar cliente:", err);
          }
        }

        setShowClientModal(false);
        alert(`✅ Cliente #${clientData.cod} (${clientData.name}) ${modalMode === 'edit' ? 'atualizado' : 'cadastrado'} com sucesso!`);
      };

      // Estatísticas Financeiras por Cliente
      const clientStatsMap = useMemo(() => {
        const map = {};
        clients.forEach(c => {
          map[c.cod] = {
            totalComprado: 0, totalPago: 0, totalAberto: 0,
            totalVencido: 0, totalAVencer: 0, atrasosCount: 0,
            maxDiasAtraso: 0, pedidosCount: 0
          };
        });

        sales.forEach(s => {
          const cCod = String(s.codCliente);
          if (!map[cCod]) {
            map[cCod] = {
              totalComprado: 0, totalPago: 0, totalAberto: 0,
              totalVencido: 0, totalAVencer: 0, atrasosCount: 0,
              maxDiasAtraso: 0, pedidosCount: 0
            };
          }

          map[cCod].pedidosCount++;
          const saleAmt = Number(s.amount) || 0;
          map[cCod].totalComprado += saleAmt;

          (s.installments || []).forEach(inst => {
            const amt = Number(inst.amount) || 0;
            if (inst.status === 'Pago') {
              map[cCod].totalPago += amt;
            } else {
              map[cCod].totalAberto += amt;
              if (inst.dueDate && inst.dueDate < todayStr) {
                map[cCod].totalVencido += amt;
                map[cCod].atrasosCount++;
                const diffTime = Math.abs(new Date(todayStr) - new Date(inst.dueDate));
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays > map[cCod].maxDiasAtraso) {
                  map[cCod].maxDiasAtraso = diffDays;
                }
              } else {
                map[cCod].totalAVencer += amt;
              }
            }
          });
        });

        return map;
      }, [clients, sales, todayStr]);

      // Filtragem da Carteira
      const filteredClients = useMemo(() => {
        return clients.filter(c => {
          const stats = clientStatsMap[c.cod] || {};
          const matchSearch = c.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              (c.categoria && c.categoria.toLowerCase().includes(searchTerm.toLowerCase())) ||
                              (c.bairro && c.bairro.toLowerCase().includes(searchTerm.toLowerCase())) ||
                              String(c.cod).includes(searchTerm);
          if (!matchSearch) return false;

          if (statusFilter === 'vencidos') return stats.totalVencido > 0;
          if (statusFilter === 'avencer') return stats.totalAVencer > 0 && stats.totalVencido === 0;
          if (statusFilter === 'quitados') return stats.totalComprado > 0 && stats.totalAberto === 0;
          return true;
        });
      }, [clients, clientStatsMap, searchTerm, statusFilter]);

      const totalPages = Math.ceil(filteredClients.length / pageSize) || 1;
      const paginatedClients = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredClients.slice(start, start + pageSize);
      }, [filteredClients, currentPage, pageSize]);

      // Vendas do Cliente Selecionado
      const activeClientSales = useMemo(() => {
        if (!selectedClient) return [];
        return sales.filter(s => String(s.codCliente) === String(selectedClient.cod));
      }, [sales, selectedClient]);

      const activeStats = clientStatsMap[selectedClient?.cod] || {
        totalComprado: 0, totalPago: 0, totalAberto: 0
      };

      // AMORTIZAÇÃO FIFO EM CASCATA COM DIVISÃO DE PARCELA
      const handleFifoSubmit = async (e) => {
        e.preventDefault();
        const abateVal = parseFloat(fifoAmount.replace(',', '.'));
        if (!abateVal || !selectedClient) return;

        setProcessingFifo(true);
        let rem = abateVal;
        let alteracoesCount = 0;

        try {
          const vendasOrdenadas = [...activeClientSales].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

          for (const sale of vendasOrdenadas) {
            if (rem <= 0) break;

            let saleAlterada = false;
            let newInstallments = [];

            for (const inst of (sale.installments || [])) {
              if (inst.status === 'Pago' || rem <= 0) {
                newInstallments.push(inst);
                continue;
              }

              const instAmt = Number(inst.amount) || 0;
              if (rem >= instAmt) {
                rem -= instAmt;
                saleAlterada = true;
                newInstallments.push({
                  ...inst,
                  status: 'Pago',
                  paymentDate: todayStr,
                  liquidadoPor: fifoVendor
                });
              } else {
                const valorQuitado = rem;
                const saldoRestante = instAmt - valorQuitado;
                rem = 0;
                saleAlterada = true;

                newInstallments.push({
                  number: inst.number,
                  amount: valorQuitado,
                  dueDate: inst.dueDate,
                  status: 'Pago',
                  paymentDate: todayStr,
                  liquidadoPor: fifoVendor,
                  observacao: `Abatimento parcial FIFO de R$ ${valorQuitado.toFixed(2)}`
                });

                newInstallments.push({
                  number: Number(`${inst.number}.1`),
                  amount: saldoRestante,
                  dueDate: inst.dueDate,
                  status: 'Em aberto',
                  paymentDate: null,
                  observacao: `Saldo restante após amortização FIFO`
                });
              }
            }

            if (saleAlterada) {
              alteracoesCount++;
              const todosPagos = newInstallments.every(i => i.status === 'Pago');

              if (window.db && window.fb) {
                const vendaRef = window.fb.doc(window.db, "vendas", sale.id);
                await window.fb.updateDoc(vendaRef, {
                  installments: newInstallments,
                  isPaid: todosPagos
                });
              }
            }
          }

          setFifoMsg(`✅ R$ ${abateVal.toFixed(2)} amortizado via FIFO em ${alteracoesCount} título(s)!`);

          const targetSale = sales.find(s => s.id === saleId);
          if (!targetSale) return;

          const updatedInstallments = (targetSale.installments || []).map(inst => {
            if (inst.number === instNumber) {
              return {
                ...inst,
                status: novoStatus,
                paymentDate: novoStatus === 'Pago' ? todayStr : null
              };
            }
            return inst;
          });

          const todosPagos = updatedInstallments.every(i => i.status === 'Pago');

          if (window.db && window.fb) {
            const vendaRef = window.fb.doc(window.db, "vendas", saleId);
            await window.fb.updateDoc(vendaRef, {
              installments: updatedInstallments,
              isPaid: todosPagos

            alert(`✅ Parcela #${instNumber} alterada para: ${novoStatus}!`);

                                    subtitleText = `Quitado em: ${inst.paymentDate || 'Data da Baixa'}`;
                                    subtitleColor = 'text-emerald-700';
                                  } else if (isVencido) {
                                    const diffDays = Math.ceil(Math.abs(new Date(todayStr) - new Date(inst.dueDate)) / (1000 * 60 * 60 * 24));

                                    subtitleColor = 'text-rose-600 font-bold';

                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );

                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Vendedor(a)</label>
                      <select

                        <option value="Travessa">Travessa</option>
                        <option value="Alameda">Alameda</option>
                        <option value="Rodovia">Rodovia</option>
                      </select>
                    </div>
                    <div className="sm:col-span-2">
                      <label className="font-semibold text-slate-600 block mb-1">Endereço</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Santos Dumont" 
                        value={clientFormData.endereco} 
                        onChange={e => setClientFormData({ ...clientFormData, endereco: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Nº</label>
                      <input 
                        type="text" 
                        placeholder="1200" 
                        value={clientFormData.numero} 
                        onChange={e => setClientFormData({ ...clientFormData, numero: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none text-center" 
                      />
                    </div>
                  </div>

                  {/* Linha 5: Bairro, Cidade e UF */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Bairro</label>
                      <input 
                        type="text" 
                        placeholder="Aldeota" 
                        value={clientFormData.bairro} 
                        onChange={e => setClientFormData({ ...clientFormData, bairro: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">Cidade</label>
                      <input 
                        type="text" 
                        placeholder="Fortaleza" 
                        value={clientFormData.cidade} 
                        onChange={e => setClientFormData({ ...clientFormData, cidade: e.target.value })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none" 
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-600 block mb-1">UF</label>
                      <input 
                        type="text" 
                        maxLength="2"
                        placeholder="CE" 
                        value={clientFormData.uf} 
                        onChange={e => setClientFormData({ ...clientFormData, uf: e.target.value.toUpperCase() })} 
                        className="w-full p-2.5 border rounded-xl bg-slate-50 outline-none text-center font-bold" 
                      />
                    </div>
                  </div>

                  {/* Ações */}
                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button 
                      type="button" 
                      onClick={() => setShowClientModal(false)} 
                      className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-indigo-700 hover:bg-indigo-800 shadow"
                    >
                      {modalMode === 'edit' ? 'Salvar Alterações' : 'Cadastrar Cliente'}
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL 3: ABATIMENTO PARCIAL DE PARCELA                    */}
          {/* ========================================================= */}
          {modalPartial && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-xl border border-slate-200">
                <div className="flex justify-between items-center border-b pb-2">
                  <h4 className="font-bold text-sm text-slate-900">Abatimento Parcial de Parcela</h4>
                  <button onClick={() => setModalPartial(null)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                
                <p className="text-xs text-slate-600 leading-relaxed">
                  Saldo atual da Parcela #{modalPartial.installmentNumber}: <b className="text-slate-900">R$ {modalPartial.maxAmount.toFixed(2)}</b>.
                  Digite o valor que deseja abater agora:
                </p>

                <form onSubmit={handleModalPartialSubmit} className="space-y-3">
                  <div>
                    <label className="text-[11px] font-semibold text-slate-600 block mb-1">Valor do Abatimento (R$)</label>
                    <input 
                      type="text" 
                      placeholder="Ex: 250.00" 
                      value={partialInput} 
                      onChange={e => setPartialInput(e.target.value)} 
                      className="w-full text-xs p-2.5 border rounded-xl bg-slate-50 font-extrabold outline-none focus:ring-2 focus:ring-indigo-600/30" 
                      required 
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setModalPartial(null)} 
                      className="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-1.5 rounded-xl text-xs font-bold text-white bg-indigo-700 hover:bg-indigo-800 shadow"
                    >
                      Confirmar Abatimento
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
