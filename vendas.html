<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teles Odonto - Carteira de Vendas & Inadimplência</title>

  <!-- Tipografia Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel para execução autônoma no navegador -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>

  <!-- Inicialização do Firebase Firestore com Fallback Seguro e Busca Única -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      getDocs, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANX_NEnljW5ED0YqWc6pZ7ARPy1hNToXg",
      authDomain: "neves-pro-crm-comissoes.firebaseapp.com",
      projectId: "neves-pro-crm-comissoes",
      storageBucket: "neves-pro-crm-comissoes.firebasestorage.app",
      messagingSenderId: "747505960352",
      appId: "1:747505960352:web:5e7d2d5168a14dbfe490c5",
      measurementId: "G-9CF84R9BWM"
    };

    try {
      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.fb = { collection, doc, setDoc, addDoc, updateDoc, deleteDoc, getDocs, query, orderBy };
      window.dispatchEvent(new Event("firebase-ready"));
      console.log("🔥 Firebase conectado com busca única (anti-loop) no vendas.html!");
    } catch (err) {
      console.warn("Aviso na inicialização do Firebase:", err);
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 antialiased text-slate-800">
  <div id="root">
    <!-- Fallback visível caso o script demore a montar -->
    <div style="padding: 40px; text-align: center; color: #64748b; font-family: sans-serif;">
      <p style="font-weight: bold; font-size: 16px;">Carregando Carteira de Vendas Teles Odonto...</p>
      <p style="font-size: 12px; margin-top: 8px;">Aguarde a inicialização do sistema.</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const formatBRL = (val) => {
      const n = Number(val) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    // Base auditada de clientes da Teles Odonto
    const initialClientsSeed = [
      { cod: "2", name: "JOÃO PESSOA MEDEIROS COSTA", categoria: "Prótese Fixa", telefone: "(85) 99122-3344", cnpj: "02.145.890/0001-34", endereco: "Rua Monsenhor Tabosa, 450 - Praia de Iracema", cidade: "Fortaleza - CE", vendor: "André Luiz Nóbrega Martins", vendorCode: "VND-01" },
      { cod: "4", name: "LEONARDO AMORIM DE FRANCA E SOUSA", categoria: "Prótese Total e Parcial", telefone: "(85) 98844-1234", cnpj: "04.312.980/0001-89", endereco: "Av. Santos Dumont, 1200 - Aldeota", cidade: "Fortaleza - CE", vendor: "Luis Daniel da Silva", vendorCode: "VND-02" },
      { cod: "5", name: "IMPRESSIONE LABORATÓRIO DE PROTESE LTDA", categoria: "Ortodontia & Fixa", telefone: "(85) 98711-2233", cnpj: "12.345.678/0001-90", endereco: "Av. Dom Luís, 800 - Aldeota", cidade: "Fortaleza - CE", vendor: "André Luiz Nóbrega Martins", vendorCode: "VND-01" },
      { cod: "7", name: "DAVI DA CUNHA GONCALVES", categoria: "Implantodontia", telefone: "(85) 99655-4433", cnpj: "01.998.441/0001-12", endereco: "Rua Barão de Studart, 1550 - Dionísio Torres", cidade: "Fortaleza - CE", vendor: "André Luiz Nóbrega Martins", vendorCode: "VND-01" },
      { cod: "8", name: "LEONARDO DA SILVA SOUZA", categoria: "Ortodontia Digital", telefone: "(88) 98122-9988", cnpj: "05.512.671/0001-01", endereco: "Rua Coronel Mont Alverne, 210 - Centro", cidade: "Sobral - CE", vendor: "Luis Daniel da Silva", vendorCode: "VND-02" },
      { cod: "14", name: "CLINICA ODONTOLOGICA JORIO DA ESCOSSIA LTDA", categoria: "Próteses Múltiplas", telefone: "(85) 99455-1100", cnpj: "07.891.234/0001-45", endereco: "Av. Pontes Vieira, 2500 - Dionísio Torres", cidade: "Fortaleza - CE", vendor: "André Luiz Nóbrega Martins", vendorCode: "VND-01" }
    ];

    function App() {
      const [sales, setSales] = useState(() => {
        try {
          const cached = localStorage.getItem('neves_crm_sales_cache');
          return cached ? JSON.parse(cached) : [];
        } catch {
          return [];
        }
      });
      const [loading, setLoading] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [filtroTexto, setFiltroTexto] = useState('');
      const [filtroStatus, setFiltroStatus] = useState('TODOS');
      const [clienteSelecionadoCod, setClienteSelecionadoCod] = useState("2");

      const [clients, setClients] = useState(() => {
        try {
          const saved = localStorage.getItem('neves_crm_clients');
          return saved ? JSON.parse(saved) : initialClientsSeed;
        } catch {
          return initialClientsSeed;
        }
      });

      const carregouRef = useRef(false);

      const renderIcons = () => {
        try {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
          }
        } catch (e) {}
      };

      useEffect(() => {
        renderIcons();
      });

      // Ler cliente passado por URL (?cliente=X)
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const cliParam = params.get('cliente');
          if (cliParam) {
            setClienteSelecionadoCod(cliParam);
          }
        } catch (e) {}
      }, []);

      // Busca única no Firebase via getDocs (Anti-Loop com 0 consumo repetitivo)
      const buscarDadosUmaVez = async (isManual = false) => {
        if (!window.db || !window.fb) return;

        try {
          if (isManual) setRefreshing(true);
          else setLoading(true);

          // 1. Busca ÚNICA de Vendas
          const qVendas = window.fb.query(
            window.fb.collection(window.db, "vendas"),
            window.fb.orderBy("date", "desc")
          );
          const snapVendas = await window.fb.getDocs(qVendas);
          const listaVendas = snapVendas.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setSales(listaVendas);
          try {
            localStorage.setItem('neves_crm_sales_cache', JSON.stringify(listaVendas));
          } catch (e) {}

          // 2. Busca ÚNICA de Clientes
          const snapClientes = await window.fb.getDocs(window.fb.collection(window.db, "clientes"));
          if (!snapClientes.empty) {
            const firestoreClients = snapClientes.docs.map(doc => ({ cod: doc.id, ...doc.data() }));
            setClients(prev => {
              const map = {};
              prev.forEach(c => map[String(c.cod)] = c);
              firestoreClients.forEach(c => map[String(c.cod)] = { ...map[String(c.cod)], ...c });
              const merged = Object.values(map);
              try {
                localStorage.setItem('neves_crm_clients', JSON.stringify(merged));
              } catch (e) {}
              return merged;
            });
          }
        } catch (e) {
          console.warn("Aviso na busca única do vendas.html:", e);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      // Dispara estritamente 1 vez no carregamento
      useEffect(() => {
        if (carregouRef.current) return;
        carregouRef.current = true;

        if (window.db && window.fb) {
          buscarDadosUmaVez();
        } else {
          window.addEventListener("firebase-ready", () => buscarDadosUmaVez(), { once: true });
        }
      }, []);

      // Dar baixa ou alternar status de parcela individual (com persistência cirúrgica)
      const handleToggleParcela = async (vendaId, parcelaNum) => {
        const venda = sales.find(s => s.id === vendaId || s.dav === vendaId);
        if (!venda) return;

        const updatedInstallments = (venda.installments || []).map(inst => {
          if (inst.number === parcelaNum) {
            const novoStatus = inst.status === 'Pago' ? 'Em aberto' : 'Pago';
            return {
              ...inst,
              status: novoStatus,
              paidAt: novoStatus === 'Pago' ? new Date().toISOString() : null
            };
          }
          return inst;
        });

        const allPaid = updatedInstallments.every(i => i.status === 'Pago');
        const updatedStatus = allPaid ? 'Pago' : 'Em aberto';

        // Atualização instantânea na tela
        setSales(prev => prev.map(s => {
          if ((s.id && s.id === vendaId) || s.dav === vendaId) {
            return { ...s, installments: updatedInstallments, status: updatedStatus, isPaid: allPaid };
          }
          return s;
        }));

        // Gravação direta no Firestore apenas do documento alterado
        if (window.db && window.fb && venda.id) {
          try {
            const docRef = window.fb.doc(window.db, "vendas", venda.id);
            await window.fb.updateDoc(docRef, {
              installments: updatedInstallments,
              status: updatedStatus,
              isPaid: allPaid
            });
          } catch (e) {
            console.error("Erro ao atualizar parcela no Firestore:", e);
          }
        }
      };

      // Excluir DAV de teste
      const handleExcluirVenda = async (vendaId, davNum) => {
        if (!confirm(`Deseja realmente excluir o DAV #${davNum}? Esta ação não pode ser desfeita.`)) return;

        setSales(prev => prev.filter(s => s.id !== vendaId && s.dav !== davNum));

        if (window.db && window.fb && vendaId) {
          try {
            await window.fb.deleteDoc(window.fb.doc(window.db, "vendas", vendaId));
            alert(`DAV #${davNum} excluído com sucesso!`);
          } catch (e) {
            console.error("Erro ao excluir venda no Firestore:", e);
          }
        }
      };

      // Carteira Consolidada de Clientes
      const carteiraClientes = useMemo(() => {
        return clients.map(cli => {
          const vendasDoCliente = sales.filter(s => String(s.codCliente) === String(cli.cod));
          let totalComprado = 0;
          let totalBaixado = 0;
          let totalEmAberto = 0;
          let totalVencido = 0;
          let parcelasPendentes = 0;

          const hoje = new Date();
          hoje.setHours(0, 0, 0, 0);

          vendasDoCliente.forEach(v => {
            totalComprado += Number(v.amount) || 0;
            (v.installments || []).forEach(inst => {
              const amt = Number(inst.amount) || 0;
              if (inst.status === 'Pago') {
                totalBaixado += amt;
              } else {
                totalEmAberto += amt;
                parcelasPendentes++;

                if (inst.dueDate) {
                  const partes = inst.dueDate.split('/');
                  if (partes.length === 3) {
                    const dtVenc = new Date(partes[2], partes[1] - 1, partes[0]);
                    if (dtVenc < hoje) {
                      totalVencido += amt;
                    }
                  }
                }
              }
            });
          });

          return {
            ...cli,
            vendasCount: vendasDoCliente.length,
            vendas: vendasDoCliente,
            totalComprado,
            totalBaixado,
            totalEmAberto,
            totalVencido,
            parcelasPendentes,
            statusFinanceiro: totalVencido > 0 ? 'INADIMPLENTE' : totalEmAberto > 0 ? 'EM_DIA' : 'QUITADO'
          };
        });
      }, [clients, sales]);

      // Filtragem da lista Master
      const clientesFiltrados = useMemo(() => {
        return carteiraClientes.filter(cli => {
          const matchTexto = 
            cli.name.toLowerCase().includes(filtroTexto.toLowerCase()) ||
            String(cli.cod).includes(filtroTexto) ||
            (cli.cidade && cli.cidade.toLowerCase().includes(filtroTexto.toLowerCase()));

          if (!matchTexto) return false;

          if (filtroStatus === 'INADIMPLENTES') return cli.totalVencido > 0;
          if (filtroStatus === 'EM_ABERTO') return cli.totalEmAberto > 0;
          if (filtroStatus === 'QUITADOS') return cli.totalEmAberto === 0;

          return true;
        });
      }, [carteiraClientes, filtroTexto, filtroStatus]);

      // Cliente Ativo selecionado para o Detail
      const clienteAtivo = useMemo(() => {
        return carteiraClientes.find(c => String(c.cod) === String(clienteSelecionadoCod)) || carteiraClientes[0];
      }, [carteiraClientes, clienteSelecionadoCod]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* BARRA LATERAL UNIFICADA */}
          <aside className="w-full md:w-64 bg-[#1a202c] text-white flex flex-col justify-between shrink-0 md:h-screen sticky top-0 z-30 relative overflow-hidden select-none border-r border-slate-800" id="app-sidebar">
            <div className="relative z-10">
              <div className="p-6 border-b border-slate-800 flex flex-col gap-1.5">
                <span className="font-extrabold text-lg tracking-tight text-white">Teles Odonto</span>
                <span className="text-[11px] text-slate-400 font-medium">Materiais Protéticos</span>
                <div className="flex items-center justify-between mt-2 px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/60">
                  <span className="text-[10px] text-slate-300 font-mono">Neves Pro CRM</span>
                  <span className="text-[9px] font-bold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded">v2.6 Audited</span>
                </div>
              </div>

              <div className="px-4 py-6 space-y-1.5">
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">Navegação Comercial</p>

                <a href="index.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="layout-grid" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Página Inicial</span>
                </a>

                <a href="vendas.html" className="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
                  <i data-lucide="shopping-cart" className="w-4 h-4 text-white"></i>
                  <span>Página de Vendas</span>
                </a>

                <a href="comissoes.html" className="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:text-white hover:bg-slate-800/80">
                  <i data-lucide="briefcase" className="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                  <span>Comissões</span>
                </a>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800 bg-slate-900/60 relative z-10">
              <div className="flex items-center gap-3 p-2 rounded-xl bg-slate-800/40 border border-slate-700/40">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow">
                  OP
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-semibold text-white truncate">Operador Comercial</p>
                  <p className="text-[10px] text-slate-400 truncate">operador@salespro.com</p>
                </div>
                <div className="w-2 h-2 rounded-full bg-emerald-400 shrink-0 ring-4 ring-emerald-500/20"></div>
              </div>
              <p className="text-[10px] text-slate-400 text-center mt-3">© 2026 Neves Pro CRM</p>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar h-screen">
            
            {/* TOPBAR LIMPO COM BOTÃO DE ATUALIZAÇÃO MANUAL */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
              <div className="flex items-center gap-2 text-xs font-medium text-slate-500">
                <span className="font-bold text-slate-800">Teles Odonto</span>
                <span className="text-slate-400">&gt;</span>
                <span className="text-indigo-700 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                  Carteira de Vendas & Inadimplência
                </span>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => buscarDadosUmaVez(true)}
                  disabled={refreshing || loading}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 text-xs font-semibold flex items-center gap-1.5 transition disabled:opacity-50"
                  title="Atualizar dados do Firebase sob demanda"
                >
                  <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 ${refreshing ? 'animate-spin text-indigo-600' : ''}`}></i>
                  <span>{refreshing ? 'Atualizando...' : 'Atualizar Dados'}</span>
                </button>

                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  ● SISTEMA ONLINE
                </span>
                <div className="w-8 h-8 rounded-full bg-indigo-700 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                  OP
                </div>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1 space-y-6">
              
              {/* ESTRUTURA MASTER-DETAIL */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                {/* COLUNA ESQUERDA: LISTA DA CARTEIRA DE CLIENTES (MASTER) */}
                <div className="lg:col-span-5 bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col h-[740px]">
                  
                  <div className="p-4 border-b border-slate-100 bg-slate-50/50 space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="font-extrabold text-sm text-slate-900">Carteira de Clientes</h3>
                      <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full">
                        {clientesFiltrados.length} clientes
                      </span>
                    </div>

                    <div className="relative">
                      <input 
                        type="text" 
                        placeholder="Buscar por nome, cód ou cidade..." 
                        value={filtroTexto} 
                        onChange={e => setFiltroTexto(e.target.value)} 
                        className="w-full pl-8 pr-3 py-2 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-indigo-600/30" 
                      />
                      <i data-lucide="search" className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-3"></i>
                    </div>

                    {/* ABAS DE FILTRO RÁPIDO */}
                    <div className="flex gap-1.5 p-1 bg-slate-200/60 rounded-xl text-[10px] font-bold">
                      <button 
                        onClick={() => setFiltroStatus('TODOS')} 
                        className={`flex-1 py-1 rounded-lg transition ${filtroStatus === 'TODOS' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                      >
                        Todos
                      </button>
                      <button 
                        onClick={() => setFiltroStatus('INADIMPLENTES')} 
                        className={`flex-1 py-1 rounded-lg transition ${filtroStatus === 'INADIMPLENTES' ? 'bg-rose-500 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                      >
                        Inadimplentes
                      </button>
                      <button 
                        onClick={() => setFiltroStatus('EM_ABERTO')} 
                        className={`flex-1 py-1 rounded-lg transition ${filtroStatus === 'EM_ABERTO' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                      >
                        Em Aberto
                      </button>
                    </div>
                  </div>

                  {loading ? (
                    <div className="p-12 text-center text-xs text-slate-400 flex items-center justify-center gap-2">
                      <i data-lucide="loader-2" className="w-4 h-4 animate-spin text-indigo-600"></i>
                      <span>Carregando carteira de vendas...</span>
                    </div>
                  ) : (
                    <div className="divide-y divide-slate-100 overflow-y-auto custom-scrollbar flex-1">
                      {clientesFiltrados.map(cli => {
                        const isSelected = clienteAtivo && String(clienteAtivo.cod) === String(cli.cod);
                        return (
                          <div 
                            key={cli.cod} 
                            onClick={() => setClienteSelecionadoCod(cli.cod)}
                            className={`p-3.5 cursor-pointer transition flex items-center justify-between ${
                              isSelected ? 'bg-indigo-50/80 border-l-4 border-indigo-600' : 'hover:bg-slate-50'
                            }`}
                          >
                            <div className="min-w-0 pr-2">
                              <div className="flex items-center gap-1.5">
                                <span className="text-[10px] font-mono font-bold text-slate-400">#{cli.cod}</span>
                                <h4 className="text-xs font-extrabold text-slate-900 truncate">{cli.name}</h4>
                              </div>
                              <p className="text-[10px] text-slate-400 mt-0.5 truncate">{cli.cidade || 'Fortaleza - CE'}</p>
                              
                              <div className="mt-1 flex items-center gap-2">
                                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${
                                  cli.statusFinanceiro === 'INADIMPLENTE' ? 'bg-rose-100 text-rose-800' :
                                  cli.statusFinanceiro === 'EM_DIA' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                                }`}>
                                  {cli.statusFinanceiro === 'INADIMPLENTE' ? 'Inadimplente' : cli.statusFinanceiro === 'EM_DIA' ? 'Em aberto' : 'Quitado'}
                                </span>
                                <span className="text-[10px] text-slate-500 font-semibold">
                                  {cli.vendasCount} DAV(s)
                                </span>
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="text-xs font-black text-slate-900 block">{formatBRL(cli.totalEmAberto)}</span>
                              {cli.totalVencido > 0 && (
                                <span className="text-[10px] font-bold text-rose-600 block">
                                  Atraso: {formatBRL(cli.totalVencido)}
                                </span>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                </div>

                {/* COLUNA DIREITA: FICHA FINANCEIRA DETALHADA DO CLIENTE (DETAIL) */}
                <div className="lg:col-span-7 space-y-6">
                  
                  {clienteAtivo ? (
                    <div className="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-6">
                      
                      {/* CABEÇALHO DO CLIENTE */}
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-mono font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded-lg">
                              CÓD: {clienteAtivo.cod}
                            </span>
                            <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full uppercase">
                              {clienteAtivo.categoria || 'Geral'}
                            </span>
                          </div>
                          <h2 className="text-base font-black text-slate-900 mt-1">{clienteAtivo.name}</h2>
                          <p className="text-xs text-slate-400 mt-0.5">
                            {clienteAtivo.telefone} • CNPJ: {clienteAtivo.cnpj || 'Não inf.'}
                          </p>
                          <p className="text-xs text-slate-500">
                            {clienteAtivo.endereco} - {clienteAtivo.cidade}
                          </p>
                          
                          {/* VENDEDOR TITULAR */}
                          <div className="mt-2 text-xs">
                            <span className="text-slate-400">Vendedor Titular: </span>
                            <strong className="text-indigo-700 font-bold">{clienteAtivo.vendor || 'André Luiz Nóbrega Martins'}</strong>
                          </div>
                        </div>

                        {/* BADGE DE SITUAÇÃO */}
                        <div className={`p-3 rounded-2xl border text-right ${
                          clienteAtivo.totalVencido > 0 
                            ? 'bg-rose-50 border-rose-200 text-rose-800' 
                            : 'bg-emerald-50 border-emerald-200 text-emerald-800'
                        }`}>
                          <span className="text-[10px] font-bold uppercase tracking-wider block">Situação Financeira</span>
                          <strong className="text-sm font-black block">
                            {clienteAtivo.totalVencido > 0 ? 'Restrição Ativa' : 'Em Dia'}
                          </strong>
                          {clienteAtivo.totalVencido > 0 && (
                            <span className="text-[10px] font-bold text-rose-600 block mt-0.5">
                              {formatBRL(clienteAtivo.totalVencido)} vencido
                            </span>
                          )}
                        </div>
                      </div>

                      {/* RESUMO DE SALDOS */}
                      <div className="grid grid-cols-3 gap-3">
                        <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80">
                          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Histórico Total</span>
                          <strong className="text-base font-black text-slate-900 mt-1 block">{formatBRL(clienteAtivo.totalComprado)}</strong>
                        </div>
                        <div className="p-3.5 rounded-2xl bg-emerald-50/60 border border-emerald-100">
                          <span className="text-[10px] font-bold text-emerald-700 uppercase tracking-wider block">Total Pago</span>
                          <strong className="text-base font-black text-emerald-700 mt-1 block">{formatBRL(clienteAtivo.totalBaixado)}</strong>
                        </div>
                        <div className="p-3.5 rounded-2xl bg-indigo-50/60 border border-indigo-100">
                          <span className="text-[10px] font-bold text-indigo-700 uppercase tracking-wider block">Saldo Devedor</span>
                          <strong className="text-base font-black text-indigo-800 mt-1 block">{formatBRL(clienteAtivo.totalEmAberto)}</strong>
                        </div>
                      </div>

                      {/* LISTA DE PEDIDOS DAV E PARCELAS */}
                      <div className="space-y-4">
                        <div className="flex justify-between items-center">
                          <h4 className="font-extrabold text-sm text-slate-900">Histórico de Pedidos DAV</h4>
                          <span className="text-xs text-slate-400">{clienteAtivo.vendas.length} lançamento(s)</span>
                        </div>

                        {clienteAtivo.vendas.length === 0 ? (
                          <div className="p-8 text-center text-xs text-slate-400 border rounded-2xl bg-slate-50">
                            Nenhum pedido DAV registrado para este cliente.
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {clienteAtivo.vendas.map(venda => (
                              <div key={venda.id || venda.dav} className="border border-slate-200 rounded-2xl p-4 bg-slate-50/50 space-y-3">
                                
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-200/60 pb-2.5">
                                  <div className="flex items-center gap-2">
                                    <span className="font-mono font-bold text-xs bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-xl">
                                      DAV #{venda.dav}
                                    </span>
                                    <span className="text-xs font-semibold text-slate-500">
                                      {venda.dateDisplay || venda.date}
                                    </span>
                                    <span className="text-[9px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded">
                                      {venda.tipoVenda || 'TOTAL'}
                                    </span>
                                  </div>

                                  <div className="flex items-center gap-3">
                                    <span className="text-xs font-black text-slate-900">{formatBRL(venda.amount)}</span>
                                    
                                    {/* BOTÃO PARA EXCLUIR DAV DE TESTE */}
                                    <button 
                                      onClick={() => handleExcluirVenda(venda.id, venda.dav)}
                                      className="text-[10px] text-rose-500 hover:text-rose-700 font-semibold underline p-1"
                                      title="Excluir este DAV"
                                    >
                                      Excluir DAV
                                    </button>
                                  </div>
                                </div>

                                {/* GRADE DE PARCELAS */}
                                <div className="space-y-1.5">
                                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">
                                    Parcelas e Vencimentos (Clique para dar Baixa / Estornar)
                                  </span>

                                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    {(venda.installments || []).map(inst => {
                                      const isPago = inst.status === 'Pago';
                                      return (
                                        <div 
                                          key={inst.number} 
                                          onClick={() => handleToggleParcela(venda.id || venda.dav, inst.number)}
                                          className={`p-2.5 rounded-xl border cursor-pointer transition flex items-center justify-between text-xs ${
                                            isPago 
                                              ? 'bg-emerald-50 border-emerald-200 text-emerald-900' 
                                              : 'bg-white border-slate-200 text-slate-800 hover:border-indigo-300'
                                          }`}
                                        >
                                          <div>
                                            <div className="flex items-center gap-1.5">
                                              <span className="font-bold">Parcela {inst.number}</span>
                                              <span className={`text-[9px] font-bold px-1.5 py-0.2 rounded ${
                                                isPago ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-200 text-slate-700'
                                              }`}>
                                                {isPago ? '✓ Pago' : 'Pendente'}
                                              </span>
                                            </div>
                                            <span className="text-[10px] text-slate-400 block mt-0.5">
                                              Vencimento: {inst.dueDate}
                                            </span>
                                          </div>

                                          <span className="font-black text-xs">
                                            {formatBRL(inst.amount)}
                                          </span>
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>

                              </div>
                            ))}
                          </div>
                        )}

                      </div>

                    </div>
                  ) : (
                    <div className="p-12 text-center text-xs text-slate-400 bg-white rounded-3xl border">
                      Selecione um cliente na lista à esquerda para carregar a ficha financeira.
                    </div>
                  )}

                </div>

              </div>

            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
